
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CYBER RUSH - Dopamine Overdrive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Inter', system-ui, sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    .interactive {
      pointer-events: auto;
    }
    .glow-text {
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
    }
    .glow-red {
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.8), 0 0 20px rgba(255, 0, 85, 0.4);
    }
    .shake {
      animation: shake 0.1s infinite;
    }
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      20% { transform: translate(-2px, 0px) rotate(-1deg); }
      40% { transform: translate(2px, -1px) rotate(1deg); }
      60% { transform: translate(-1px, 2px) rotate(0deg); }
      80% { transform: translate(1px, -2px) rotate(1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    .speed-lines {
      background: radial-gradient(circle, transparent 40%, rgba(0, 243, 255, 0.15) 90%);
      pointer-events: none;
    }
  </style>
</head>
<body class="flex items-center justify-center text-white">

  <div id="canvas-container"></div>
  <div id="speed-overlay" class="ui-overlay speed-lines opacity-0 transition-opacity duration-300"></div>

  <!-- HUD Upper Layer -->
  <div class="ui-overlay flex flex-col justify-between p-6">
    <div class="flex justify-between items-start">
      <div>
        <div class="text-xs uppercase tracking-widest text-cyan-400 font-bold">SCORE</div>
        <div id="score-text" class="text-4xl font-extrabold tracking-wider glow-text">0</div>
      </div>
      <div class="text-center">
        <div class="text-xs uppercase tracking-widest text-pink-500 font-bold">MULTIPLIER</div>
        <div id="combo-text" class="text-5xl font-black italic tracking-tighter glow-red">x1</div>
      </div>
      <div class="text-right">
        <div class="text-xs uppercase tracking-widest text-yellow-400 font-bold">SPEED</div>
        <div id="speed-text" class="text-4xl font-extrabold tracking-wider text-yellow-400">300 <span class="text-xs">KM/H</span></div>
      </div>
    </div>

    <!-- Central Alert Prompt (Choices) -->
    <div id="choice-prompt" class="self-center text-center opacity-0 transition-all duration-100 transform scale-90">
      <div class="text-2xl font-black tracking-widest text-yellow-300 animate-pulse bg-black/60 px-6 py-2 rounded-full border border-yellow-500/50">
        一瞬の判断を要求！
      </div>
    </div>

    <!-- Bottom Instructions / State -->
    <div class="flex justify-between items-end">
      <div class="text-xs text-gray-400">
        操作: <span class="text-white font-bold">[←] [→]</span> キー / または <span class="text-white font-bold">画面左右タップ</span>
      </div>
      <div id="fever-bar-container" class="w-1/3 bg-gray-900 border border-cyan-500/30 rounded-full h-4 p-0.5 overflow-hidden">
        <div id="fever-bar" class="bg-gradient-to-r from-cyan-500 via-pink-500 to-yellow-400 h-full rounded-full transition-all duration-75" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- Game Start / Game Over Screens -->
  <div id="overlay-screen" class="ui-overlay interactive flex flex-col items-center justify-center bg-black/80 backdrop-blur-md transition-opacity duration-300">
    <div class="text-center p-8 max-w-md">
      <h1 class="text-6xl font-black italic tracking-tighter mb-2 bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-300 italic">
        DOPAMINE RUSH
      </h1>
      <p class="text-cyan-300 font-medium tracking-wide mb-6 text-sm">
        極限状態の超高速世界。秒単位の生存選択を下せ。
      </p>

      <div id="game-over-stats" class="hidden mb-6 bg-gray-900/80 p-4 rounded-xl border border-gray-800 text-left">
        <div class="flex justify-between py-1 border-b border-gray-800">
          <span class="text-gray-400">最終スコア:</span>
          <span id="final-score" class="font-bold text-cyan-400">0</span>
        </div>
        <div class="flex justify-between py-1 border-b border-gray-800">
          <span class="text-gray-400">最高連続成功 (Combo):</span>
          <span id="final-combo" class="font-bold text-pink-500">0</span>
        </div>
        <div class="flex justify-between py-1">
          <span class="text-gray-400">到達最高速度:</span>
          <span id="final-speed" class="font-bold text-yellow-400">0 KM/H</span>
        </div>
      </div>

      <button id="start-btn" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-pink-600 hover:from-cyan-400 hover:to-pink-500 text-white font-black text-xl rounded-xl shadow-lg transform transition active:scale-95 uppercase tracking-wider">
        限界を超えてスタート
      </button>

      <div class="mt-6 grid grid-cols-2 gap-4 text-xs text-gray-400">
        <div class="bg-gray-900/60 p-2 rounded-lg border border-gray-800">
          <span class="text-cyan-400 font-bold block mb-1">青ゲート [GATE]</span>
          指定レーンを通過せよ！
        </div>
        <div class="bg-gray-900/60 p-2 rounded-lg border border-gray-800">
          <span class="text-pink-500 font-bold block mb-1">赤障害物 [OBSTACLE]</span>
          瞬時に回避せよ！
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Audio System (Web Audio API Synthesizer) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playPass() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
      playBoost() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
      playCrash() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
      }
    }

    const sound = new SoundEngine();

    // --- Game Logic & Variables ---
    let scene, camera, renderer;
    let player;
    let obstacles = [];
    let speedLinesParticles;
    const LANES = [-3.5, 0, 3.5];
    let currentLane = 1; // 0: Left, 1: Center, 2: Right
    let targetX = 0;

    let isPlaying = false;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let baseSpeed = 1.2;
    let speedMultiplier = 1.0;
    let maxReachedSpeed = 300;
    let distanceTraveled = 0;
    let feverGauge = 0;

    // UI Elements
    const scoreEl = document.getElementById('score-text');
    const comboEl = document.getElementById('combo-text');
    const speedEl = document.getElementById('speed-text');
    const feverBar = document.getElementById('fever-bar');
    const overlayScreen = document.getElementById('overlay-screen');
    const gameOverStats = document.getElementById('game-over-stats');
    const startBtn = document.getElementById('start-btn');
    const speedOverlay = document.getElementById('speed-overlay');
    const choicePrompt = document.getElementById('choice-prompt');

    // --- Three.js Setup ---
    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050508, 0.015);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      // カメラの位置を高くし(y: 3 -> 6.5)、遠く見下ろすアングルに調整
      camera.position.set(0, 6.5, 9);
      camera.lookAt(0, 0.5, -15);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x00f3ff, 1.2);
      dirLight.position.set(0, 20, -10);
      scene.add(dirLight);

      // Cyber Grid Track
      createTrack();

      // Player Craft
      createPlayer();

      // Speed Particles
      createParticles();

      window.addEventListener('resize', onWindowResize);
    }

    function createTrack() {
      // Ground grid
      const gridHelper = new THREE.GridHelper(200, 40, 0x00f3ff, 0x111122);
      gridHelper.position.z = -80;
      gridHelper.position.y = -0.5;
      scene.add(gridHelper);

      // Neon Side Rails
      const railGeo = new THREE.BoxGeometry(0.2, 0.4, 200);
      const railMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });

      const leftRail = new THREE.Mesh(railGeo, railMat);
      leftRail.position.set(-5.5, 0, -80);
      scene.add(leftRail);

      const rightRail = new THREE.Mesh(railGeo, railMat);
      rightRail.position.set(5.5, 0, -80);
      scene.add(rightRail);
    }

    function createPlayer() {
      const group = new THREE.Group();

      // Jet Body
      const bodyGeo = new THREE.ConeGeometry(0.8, 2.5, 4);
      bodyGeo.rotateX(Math.PI / 2);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x111111,
        roughness: 0.2,
        metalness: 0.8,
        emissive: 0x00f3ff,
        emissiveIntensity: 0.2
      });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      group.add(body);

      // Neon Wings
      const wingGeo = new THREE.BoxGeometry(2.8, 0.05, 0.8);
      const wingMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
      const wings = new THREE.Mesh(wingGeo, wingMat);
      wings.position.z = 0.3;
      group.add(wings);

      // Engine Glow
      const glowGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const glowMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.position.z = 1.2;
      group.add(glow);

      player = group;
      player.position.set(0, 0.5, 0);
      scene.add(player);
    }

    function createParticles() {
      const count = 300;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);

      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 30;
        positions[i + 1] = Math.random() * 10;
        positions[i + 2] = -Math.random() * 150;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.PointsMaterial({
        color: 0x00f3ff,
        size: 0.3,
        transparent: true,
        opacity: 0.8
      });

      speedLinesParticles = new THREE.Points(geometry, material);
      scene.add(speedLinesParticles);
    }

    function spawnObstacle() {
      if (!isPlaying) return;

      const laneIndex = Math.floor(Math.random() * 3);
      const laneX = LANES[laneIndex];
      const zPos = -120;

      // Random type: 0 = Red Wall (Avoid), 1 = Blue Energy Gate (Must Pass Through)
      const isGate = Math.random() > 0.4;
      const group = new THREE.Group();

      if (isGate) {
        // High-Reward Blue Ring Gate
        const geo = new THREE.TorusGeometry(1.5, 0.15, 16, 32);
        const mat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
        const ring = new THREE.Mesh(geo, mat);
        group.add(ring);

        group.userData = { type: 'gate', lane: laneIndex, passed: false };
      } else {
        // Red Obstacle Wall
        const geo = new THREE.BoxGeometry(2.4, 3, 0.5);
        const mat = new THREE.MeshStandardMaterial({
          color: 0xff0055,
          emissive: 0xff0055,
          emissiveIntensity: 0.5,
          roughness: 0.3
        });
        const box = new THREE.Mesh(geo, mat);
        box.position.y = 1;
        group.add(box);

        group.userData = { type: 'obstacle', lane: laneIndex, passed: false };
      }

      group.position.set(laneX, 0.8, zPos);
      scene.add(group);
      obstacles.push(group);
    }

    // --- Controls ---
    function moveLeft() {
      if (!isPlaying) return;
      if (currentLane > 0) {
        currentLane--;
        targetX = LANES[currentLane];
      }
    }

    function moveRight() {
      if (!isPlaying) return;
      if (currentLane < 2) {
        currentLane++;
        targetX = LANES[currentLane];
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
    });

    // Touch Support
    window.addEventListener('touchstart', (e) => {
      if (!isPlaying) return;
      const touchX = e.touches[0].clientX;
      if (touchX < window.innerWidth / 2) {
        moveLeft();
      } else {
        moveRight();
      }
    });

    // --- Core Game Loop ---
    let spawnTimer = 0;

    function gameLoop() {
      requestAnimationFrame(gameLoop);

      if (isPlaying) {
        // Speed scaling based on combo
        speedMultiplier = 1.0 + (combo * 0.05);
        const currentSpeed = baseSpeed * speedMultiplier;
        const speedKmh = Math.floor(currentSpeed * 220);
        
        if (speedKmh > maxReachedSpeed) maxReachedSpeed = speedKmh;
        speedEl.textContent = `${speedKmh}`;

        // Smooth Lane Transition (Ultra-responsive)
        player.position.x += (targetX - player.position.x) * 0.35;
        player.rotation.z = -(player.position.x - targetX) * 0.3; // Lean effect

        // Dynamic Speed Effects
        if (speedLinesParticles) {
          const positions = speedLinesParticles.geometry.attributes.position.array;
          for (let i = 2; i < positions.length; i += 3) {
            positions[i] += currentSpeed * 2.5;
            if (positions[i] > 10) {
              positions[i] = -150;
            }
          }
          speedLinesParticles.geometry.attributes.position.needsUpdate = true;
        }

        // Camera Shake & FOV dynamic stretch
        camera.fov = 75 + Math.min(combo * 1.5, 30);
        camera.updateProjectionMatrix();

        // Spawn obstacles dynamically faster
        spawnTimer += currentSpeed;
        if (spawnTimer > 18) {
          spawnObstacle();
          spawnTimer = 0;
        }

        // Move and process obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += currentSpeed;

          // Rotation effect for visual flare
          if (obs.userData.type === 'gate') {
            obs.children[0].rotation.z += 0.05;
          }

          // Collision Check
          const dz = obs.position.z - player.position.z;
          if (Math.abs(dz) < 1.2 && !obs.userData.passed) {
            // Player is inside the obstacle trigger Z range
            if (obs.userData.lane === currentLane) {
              if (obs.userData.type === 'gate') {
                // SUCCESS PASS!
                obs.userData.passed = true;
                onSuccessGate(obs);
              } else if (obs.userData.type === 'obstacle') {
                // CRASH!
                onCrash();
                break;
              }
            }
          }

          // Missed Gate handling
          if (obs.position.z > 2 && !obs.userData.passed) {
            obs.userData.passed = true;
            if (obs.userData.type === 'gate') {
              // Missed energy gate breaks combo
              resetCombo();
            }
          }

          // Clean up off-screen
          if (obs.position.z > 10) {
            scene.remove(obs);
            obstacles.splice(i, 1);
          }
        }

        // Score auto increase
        score += Math.floor(speedMultiplier * 2);
        scoreEl.textContent = score.toLocaleString();

        // High Speed Overlay Lines
        if (combo >= 5) {
          speedOverlay.classList.remove('opacity-0');
        } else {
          speedOverlay.classList.add('opacity-0');
        }
      }

      renderer.render(scene, camera);
    }

    function onSuccessGate(obs) {
      sound.playPass();
      combo++;
      if (combo > maxCombo) maxCombo = combo;

      comboEl.textContent = `x${combo}`;
      comboEl.classList.add('scale-125');
      setTimeout(() => comboEl.classList.remove('scale-125'), 100);

      // Pulse Fever Bar
      feverGauge = Math.min(100, feverGauge + 15);
      feverBar.style.width = `${feverGauge}%`;

      // Visual flash
      scene.background = new THREE.Color(0x002233);
      setTimeout(() => { scene.background = new THREE.Color(0x050508); }, 50);

      // Score bonus
      score += 500 * combo;
    }

    function resetCombo() {
      combo = 0;
      comboEl.textContent = `x1`;
      feverGauge = 0;
      feverBar.style.width = `0%`;
    }

    function onCrash() {
      sound.playCrash();
      isPlaying = false;
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 400);

      // Show Stats Screen
      document.getElementById('final-score').textContent = score.toLocaleString();
      document.getElementById('final-combo').textContent = `x${maxCombo}`;
      document.getElementById('final-speed').textContent = `${maxReachedSpeed} KM/H`;

      gameOverStats.classList.remove('hidden');
      startBtn.textContent = '限界に再挑戦する';
      overlayScreen.classList.remove('opacity-0', 'pointer-events-none');
    }

    function startGame() {
      sound.init();
      sound.playBoost();

      // Reset Variables
      score = 0;
      combo = 0;
      maxCombo = 0;
      baseSpeed = 1.3;
      speedMultiplier = 1.0;
      maxReachedSpeed = 300;
      currentLane = 1;
      targetX = LANES[1];
      player.position.x = 0;
      feverGauge = 0;
      feverBar.style.width = `0%`;

      scoreEl.textContent = '0';
      comboEl.textContent = 'x1';

      // Clear Obstacles
      obstacles.forEach(obs => scene.remove(obs));
      obstacles = [];

      overlayScreen.classList.add('opacity-0', 'pointer-events-none');
      isPlaying = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Initialize Game on Load
    window.onload = function() {
      initThree();
      gameLoop();

      startBtn.addEventListener('click', startGame);
    };
  </script>
</body>
</html>
