<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CROSS SLASHER - Ultra Action</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Screen Fit Wrapper */
        #viewport-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            background: #12131a;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.25);
            overflow: hidden;
            transform-origin: center center;
            flex-shrink: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Top Left HP & Ult Status */
        .player-status-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 240px;
            background: rgba(10, 15, 25, 0.75);
            backdrop-filter: blur(4px);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(102, 252, 241, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .bar-label {
            font-size: 11px;
            font-weight: bold;
            color: #66fcf1;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }

        .bar-outer {
            width: 100%;
            height: 12px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 6px;
        }

        .hp-bar-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0055, #ff5050);
            transition: width 0.1s ease-out;
        }

        .ult-bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            transition: width 0.1s ease-out;
        }

        .ult-btn {
            width: 100%;
            padding: 6px;
            background: linear-gradient(45deg, #ff0055, #f5af19);
            border: none;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.4;
            pointer-events: none;
            transition: all 0.2s;
        }

        .ult-btn.ready {
            opacity: 1;
            pointer-events: auto;
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 5px #f5af19; }
            100% { transform: scale(1.03); box-shadow: 0 0 20px #ff0055; }
        }

        /* Responsive Controls */
        .controls-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 15px 25px;
        }

        /* Left Slider */
        .slider-container {
            width: 190px;
            height: 60px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(102, 252, 241, 0.5);
            border-radius: 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .slider-thumb {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle, #66fcf1, #45a29e);
            position: absolute;
            left: 69px;
            box-shadow: 0 0 15px #66fcf1;
            cursor: pointer;
        }

        /* Right Action Buttons - Translucent & Larger */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 72px);
            grid-template-rows: repeat(2, 72px);
            gap: 10px;
        }

        .btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(20, 30, 45, 0.5);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.1s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.9);
            background: rgba(102, 252, 241, 0.6);
        }

        .btn-a { grid-column: 1; grid-row: 2; background: rgba(235, 77, 75, 0.45); border-color: #ff7979; }
        .btn-b { grid-column: 2; grid-row: 2; background: rgba(240, 147, 43, 0.45); border-color: #ffbe76; }
        .btn-dodge { grid-column: 3; grid-row: 2; background: rgba(46, 204, 113, 0.45); border-color: #2ecc71; font-size: 11px; }
        .btn-jump { grid-column: 2; grid-row: 1; background: rgba(52, 152, 219, 0.45); border-color: #3498db; font-size: 11px; }

        /* Top Right Menu Buttons */
        .top-right-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(102, 252, 241, 0.5);
            color: #fff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Modals */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-title {
            font-size: 32px;
            font-weight: 900;
            color: #66fcf1;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #66fcf1;
            letter-spacing: 2px;
        }

        .menu-btn {
            padding: 12px 30px;
            margin: 6px;
            background: transparent;
            border: 2px solid #45a29e;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 230px;
            text-align: center;
            transition: all 0.2s;
        }

        .menu-btn:hover {
            background: #45a29e;
            color: #050508;
            box-shadow: 0 0 15px #45a29e;
        }

        .home-center-char {
            width: 150px;
            height: 160px;
            border: 2px dashed #66fcf1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            cursor: pointer;
            background: rgba(255,255,255,0.03);
        }

        .stage-selector {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            overflow-x: auto;
            max-width: 85%;
            padding: 10px;
        }

        .stage-card {
            min-width: 75px;
            height: 75px;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            background: #12131a;
            color: #666;
        }

        .stage-card.unlocked { border-color: #45a29e; color: #fff; }
        .stage-card.selected { border-color: #66fcf1; background: #45a29e; color: #000; box-shadow: 0 0 12px #66fcf1; }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 320px;
            margin: 15px 0;
        }

        .setting-row input[type=range] { width: 170px; }

        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 80%;
            margin-bottom: 20px;
        }

        .shop-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid #45a29e;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden { display: none !important; }

        .combo-display {
            position: absolute;
            top: 75px;
            left: 15px;
            font-size: 28px;
            font-weight: 900;
            font-style: italic;
            color: #f5af19;
            text-shadow: 0 0 10px #ff0055;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>

<div id="viewport-wrapper">
    <div id="game-container">
        <!-- Game Canvas -->
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <!-- UI Overlay -->
        <div id="game-ui" class="ui-layer hidden">
            <div class="player-status-panel interactive">
                <div class="bar-label"><span>PLAYER HP</span><span id="hp-text">100/100</span></div>
                <div class="bar-outer"><div id="player-hp-bar" class="hp-bar-inner"></div></div>
                <div class="bar-label"><span>ULTIMATE GAUGE</span><span id="ult-text">0%</span></div>
                <div class="bar-outer"><div id="player-ult-bar" class="ult-bar-inner"></div></div>
                <button id="ult-btn" class="ult-btn interactive">必殺技 [ULTIMATE]</button>
            </div>

            <div id="combo-display" class="combo-display">0 COMBO!</div>

            <div class="top-right-controls interactive">
                <button id="pause-btn" class="icon-btn">⏸</button>
                <button id="shop-btn" class="icon-btn">🛒</button>
            </div>

            <!-- Touch Controls -->
            <div class="controls-panel interactive">
                <!-- Left Move Slider -->
                <div id="move-slider" class="slider-container">
                    <div id="slider-thumb" class="slider-thumb"></div>
                </div>

                <!-- Right Action Buttons -->
                <div class="action-buttons">
                    <div id="btn-jump" class="btn btn-jump">JUMP</div>
                    <div id="btn-a" class="btn btn-a">A</div>
                    <div id="btn-b" class="btn btn-b">B</div>
                    <div id="btn-dodge" class="btn btn-dodge">PARRY</div>
                </div>
            </div>
        </div>

        <!-- Home Screen Modal -->
        <div id="home-modal" class="modal interactive">
            <div class="modal-title">CROSS SLASHER</div>
            <div class="bar-label" style="font-size: 15px; margin-bottom: 12px;">所持ポイント: <span id="user-points" style="color:#f5af19;">0</span> PT</div>
            
            <div id="char-select-trigger" class="home-center-char">
                <div id="char-avatar" style="font-size: 40px; margin-bottom: 6px;">⚔️</div>
                <div id="char-name" style="font-weight: bold; color: #66fcf1; font-size: 14px;">キャラクター1</div>
                <div style="font-size: 10px; color: #aaa; margin-top: 4px;">[タップでキャラ変更/技確認]</div>
            </div>

            <button id="start-game-btn" class="menu-btn" style="background: #45a29e; color: #050508;">出撃 [START]</button>
            <button id="upgrade-btn" class="menu-btn">能力強化 [UPGRADE]</button>
            <button id="settings-btn" class="menu-btn">設定 [SETTINGS]</button>

            <div style="margin-top: 10px; font-size: 12px; color: #aaa;">ステージ選択</div>
            <div id="stage-selector" class="stage-selector">
                <!-- Stage Cards Generated by JS -->
            </div>
        </div>

        <!-- Character Selection / Info Modal -->
        <div id="char-modal" class="modal interactive hidden">
            <div class="modal-title">SELECT CHARACTER</div>
            <div style="display: flex; gap: 20px; margin-bottom: 15px;">
                <button id="select-c1" class="menu-btn" style="width: 140px;">Char 1 (剣士)</button>
                <button id="select-c2" class="menu-btn" style="width: 140px;">Char 2 (弓炎)</button>
            </div>
            <div id="char-desc" style="width: 80%; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; font-size: 13px; line-height: 1.6; max-height: 220px; overflow-y: auto; border: 1px solid #45a29e;">
                <!-- Desc loaded by JS -->
            </div>
            <button id="close-char-btn" class="menu-btn" style="margin-top: 15px;">決定・戻る</button>
        </div>

        <!-- Upgrade Modal -->
        <div id="upgrade-modal" class="modal interactive hidden">
            <div class="modal-title">UPGRADES</div>
            <div class="bar-label" style="font-size: 15px; margin-bottom: 15px;">所持ポイント: <span id="upgrade-points" style="color:#f5af19;">0</span> PT</div>
            <div style="display: flex; flex-direction: column; gap: 12px; width: 300px; margin-bottom: 20px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>攻撃力 (Lv.<span id="lvl-atk">1</span>): </span>
                    <button id="buy-atk-btn" class="menu-btn" style="width: 110px; padding: 6px; font-size: 12px;">100 PT</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>最大HP (Lv.<span id="lvl-hp">1</span>): </span>
                    <button id="buy-hp-btn" class="menu-btn" style="width: 110px; padding: 6px; font-size: 12px;">100 PT</button>
                </div>
            </div>
            <button id="close-upgrade-btn" class="menu-btn">戻る</button>
        </div>

        <!-- Shop / Item Pause Modal -->
        <div id="shop-modal" class="modal interactive hidden">
            <div class="modal-title">SHOP / PAUSE</div>
            <div class="bar-label" style="font-size: 15px; margin-bottom: 15px;">所持ポイント: <span id="shop-points" style="color:#f5af19;">0</span> PT</div>
            <div class="shop-grid">
                <div class="shop-item">
                    <div style="font-weight: bold; color: #66fcf1;">回復薬 (小)</div>
                    <div style="font-size: 11px; margin: 5px 0;">HPを30回復</div>
                    <button id="buy-item-heal1" class="menu-btn" style="width: 100px; padding: 6px; font-size: 12px;">50 PT</button>
                </div>
                <div class="shop-item">
                    <div style="font-weight: bold; color: #66fcf1;">回復薬 (大)</div>
                    <div style="font-size: 11px; margin: 5px 0;">HPを80回復</div>
                    <button id="buy-item-heal2" class="menu-btn" style="width: 100px; padding: 6px; font-size: 12px;">120 PT</button>
                </div>
            </div>
            <button id="close-shop-btn" class="menu-btn">再開 [RESUME]</button>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal interactive hidden">
            <div class="modal-title">SETTINGS</div>
            <div class="setting-row">
                <span>画面微調整スケール:</span>
                <input type="range" id="scale-slider" min="0.5" max="1.0" step="0.05" value="1.0">
            </div>
            <button id="close-settings-btn" class="menu-btn">完了</button>
        </div>

        <!-- Game Over / Victory Modal -->
        <div id="result-modal" class="modal interactive hidden">
            <div id="result-title" class="modal-title">VICTORY!</div>
            <div id="result-desc" style="font-size: 15px; margin-bottom: 20px;">ステージクリア！</div>
            <button id="result-ok-btn" class="menu-btn">ホームへ戻る</button>
        </div>
    </div>
</div>

<script>
/* --- ENGINE & AUTO SCALING SYSTEM --- */
const CANVAS_WIDTH = 960;
const CANVAS_HEIGHT = 540;
const GRAVITY = 0.6;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameContainer = document.getElementById('game-container');

let userScaleMultiplier = 1.0;

function fitGameToWindow() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    
    // Maintain 16:9 Aspect Ratio without stretching or cutting
    const scaleX = windowWidth / CANVAS_WIDTH;
    const scaleY = windowHeight / CANVAS_HEIGHT;
    const autoScale = Math.min(scaleX, scaleY);
    
    const finalScale = autoScale * userScaleMultiplier;
    gameContainer.style.transform = `scale(${finalScale})`;
}

window.addEventListener('resize', fitGameToWindow);
window.addEventListener('load', fitGameToWindow);

// Save State
let gameState = {
    points: 300,
    selectedChar: 1,
    selectedStage: 1,
    unlockedStage: 1,
    upgrades: { atk: 1, hp: 1 }
};

let inGame = false;
let isPaused = false;
let cameraX = 0;
let comboCount = 0;
let comboTimer = 0;
let stageData = { width: 3200, platforms: [], enemies: [] };

/* --- INPUT SYSTEM --- */
let inputState = {
    moveDir: 0,
    jumpPressed: false,
};

/* --- BICKMAN / STICKMAN ANIMATOR ENGINE --- */
function drawStickman(ctx, x, y, facing, pose) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing, 1);
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let color = pose.color || '#66fcf1';
    ctx.strokeStyle = color;
    ctx.fillStyle = color;

    // Joint Angles default
    let hX = 0, hY = -50; // Head
    let neckX = 0, neckY = -40;
    let hipX = 0, hipY = -20;

    let rShoulder = { x: 0, y: -38 }, lShoulder = { x: 0, y: -38 };
    let rElbow = { x: 10, y: -28 }, lElbow = { x: -10, y: -28 };
    let rHand = { x: 18, y: -20 }, lHand = { x: -12, y: -15 };

    let rHip = { x: 2, y: -20 }, lHip = { x: -2, y: -20 };
    let rKnee = { x: 6, y: -10 }, lKnee = { x: -6, y: -10 };
    let rFoot = { x: 8, y: 0 }, lFoot = { x: -8, y: 0 };

    let time = Date.now() * 0.015;

    if (pose.state === 'run') {
        rFoot = { x: Math.sin(time) * 18, y: Math.sin(time*2) * 5 };
        lFoot = { x: -Math.sin(time) * 18, y: Math.cos(time*2) * 5 };
        rKnee = { x: rFoot.x * 0.5, y: -10 - Math.abs(Math.sin(time)) * 6 };
        lKnee = { x: lFoot.x * 0.5, y: -10 - Math.abs(Math.cos(time)) * 6 };
        rHand = { x: -Math.sin(time) * 15, y: -22 };
        lHand = { x: Math.sin(time) * 15, y: -22 };
    } else if (pose.state === 'jump') {
        rKnee = { x: 10, y: -12 }; lKnee = { x: -12, y: -8 };
        rFoot = { x: 12, y: -2 }; lFoot = { x: -10, y: 2 };
        rHand = { x: 15, y: -45 }; lHand = { x: -15, y: -45 };
    } else if (pose.state === 'attack_sword') {
        rElbow = { x: 15, y: -40 };
        rHand = { x: 30, y: -35 };
        lHand = { x: 10, y: -25 };
    } else if (pose.state === 'attack_bow') {
        lElbow = { x: 20, y: -35 }; lHand = { x: 35, y: -35 }; // Holding bow
        rElbow = { x: -5, y: -35 }; rHand = { x: -15 + (pose.charge*10), y: -35 }; // Drawing string
    } else if (pose.state === 'spin_bow') {
        let spinAngle = Date.now() * 0.05;
        rHand = { x: Math.cos(spinAngle) * 25, y: -30 + Math.sin(spinAngle) * 25 };
        lHand = { x: -Math.cos(spinAngle) * 25, y: -30 - Math.sin(spinAngle) * 25 };
    }

    // Head
    ctx.beginPath();
    ctx.arc(hX, hY, 8, 0, Math.PI * 2);
    ctx.fill();

    // Spine
    ctx.beginPath();
    ctx.moveTo(neckX, neckY);
    ctx.lineTo(hipX, hipY);
    ctx.stroke();

    // Left Leg
    ctx.beginPath();
    ctx.moveTo(lHip.x, lHip.y);
    ctx.lineTo(lKnee.x, lKnee.y);
    ctx.lineTo(lFoot.x, lFoot.y);
    ctx.stroke();

    // Right Leg
    ctx.beginPath();
    ctx.moveTo(rHip.x, rHip.y);
    ctx.lineTo(rKnee.x, rKnee.y);
    ctx.lineTo(rFoot.x, rFoot.y);
    ctx.stroke();

    // Left Arm
    ctx.beginPath();
    ctx.moveTo(lShoulder.x, lShoulder.y);
    ctx.lineTo(lElbow.x, lElbow.y);
    ctx.lineTo(lHand.x, lHand.y);
    ctx.stroke();

    // Right Arm
    ctx.beginPath();
    ctx.moveTo(rShoulder.x, rShoulder.y);
    ctx.lineTo(rElbow.x, rElbow.y);
    ctx.lineTo(rHand.x, rHand.y);
    ctx.stroke();

    // Held Weapons
    if (pose.weapon === 'sword') {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(rHand.x, rHand.y);
        ctx.lineTo(rHand.x + 25, rHand.y - 15);
        ctx.stroke();
    } else if (pose.weapon === 'bow') {
        ctx.strokeStyle = '#f0932b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(lHand.x, lHand.y, 16, -Math.PI*0.4, Math.PI*0.4);
        ctx.stroke();
    }

    ctx.restore();
}

/* --- PLAYER CLASS --- */
class Player {
    constructor(charType) {
        this.charType = charType;
        this.x = 100;
        this.y = 300;
        this.width = 30;
        this.height = 54;
        this.vx = 0;
        this.vy = 0;
        this.speed = 8.0; // Fast & responsive
        this.jumpForce = -14;
        this.isGrounded = false;
        this.facing = 1;
        this.lastFacingDir = 1;

        this.maxHp = 100 + (gameState.upgrades.hp - 1) * 25;
        this.hp = this.maxHp;
        this.atkMultiplier = 1 + (gameState.upgrades.atk - 1) * 0.2;
        this.ultGauge = 0;

        this.isDodging = false;
        this.dodgeTimer = 0;
        this.parryWindow = false;
        this.hitStun = 0;
        this.isInvincible = false;

        this.attackState = null;
        this.attackTimer = 0;
        this.char2Charging = false;
        this.char2ChargeVal = 0;
        this.char2EnchantNextArrow = false;
    }

    update() {
        if (this.hitStun > 0) {
            this.hitStun--;
            return;
        }

        if (this.isDodging) {
            this.dodgeTimer--;
            if (this.dodgeTimer <= 0) {
                this.isDodging = false;
                this.parryWindow = false;
            }
        }

        if (this.attackState === 'ult_c1') {
            this.attackTimer--;
            this.isInvincible = true;
            if (Math.random() < 0.5) {
                let rx = this.x + (Math.random() * 500 - 250);
                let ry = this.y + (Math.random() * 300 - 150);
                createArcSlashEffect(rx, ry, 120, '#66fcf1');
                dealAreaDamage(rx, ry, 150, 12 * this.atkMultiplier, this);
            }
            if (this.attackTimer <= 0) {
                this.attackState = null;
                this.isInvincible = false;
            }
            return;
        }

        if (this.attackState) {
            this.attackTimer--;
            if (this.attackTimer <= 0) {
                this.attackState = null;
            }
        }

        // Movement Speed
        this.vx = inputState.moveDir * this.speed;
        if (inputState.moveDir !== 0) {
            this.facing = inputState.moveDir > 0 ? 1 : -1;
            this.lastFacingDir = this.facing;
        }

        if (inputState.jumpPressed && this.isGrounded) {
            this.vy = this.jumpForce;
            this.isGrounded = false;
            inputState.jumpPressed = false;
        }

        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x = 0;
        if (this.x > stageData.width - this.width) this.x = stageData.width - this.width;

        // Platform Collisions
        this.isGrounded = false;
        stageData.platforms.forEach(plat => {
            if (this.x + this.width > plat.x && this.x < plat.x + plat.w) {
                if (this.y + this.height >= plat.y && this.y + this.height - this.vy <= plat.y + 14 && this.vy >= 0) {
                    this.y = plat.y - this.height;
                    this.vy = 0;
                    this.isGrounded = true;
                }
            }
        });

        if (this.y + this.height >= 460) {
            this.y = 460 - this.height;
            this.vy = 0;
            this.isGrounded = true;
        }

        // Auto Ult Increment
        this.addUlt(0.04);

        if (this.char2Charging) {
            this.char2ChargeVal = Math.min(1.0, this.char2ChargeVal + 0.025);
        }
    }

    addUlt(val) {
        this.ultGauge = Math.min(100, this.ultGauge + val);
        document.getElementById('player-ult-bar').style.width = this.ultGauge + '%';
        document.getElementById('ult-text').innerText = Math.floor(this.ultGauge) + '%';
        const ultBtn = document.getElementById('ult-btn');
        if (this.ultGauge >= 100) ultBtn.classList.add('ready');
        else ultBtn.classList.remove('ready');
    }

    takeDamage(amount) {
        if (this.isDodging && this.parryWindow) {
            triggerParryEffect(this.x, this.y);
            this.addUlt(20);
            return;
        }
        if (this.isInvincible) return;

        this.hp = Math.max(0, this.hp - amount);
        this.hitStun = 10;
        this.attackState = null;
        createDamageNumber(this.x + 10, this.y - 10, amount, '#ff0055');

        document.getElementById('player-hp-bar').style.width = (this.hp / this.maxHp * 100) + '%';
        document.getElementById('hp-text').innerText = `${Math.ceil(this.hp)}/${this.maxHp}`;

        if (this.hp <= 0) endGame(false);
    }

    triggerDodge() {
        if (this.isDodging) return;
        this.isDodging = true;
        this.dodgeTimer = 20;
        this.parryWindow = true; // High responsive parry
        createParticles(this.x + 15, this.y + 30, '#2ecc71', 12);
    }

    executeSkill(skillType) {
        if (this.hitStun > 0) return;

        if (this.charType === 1) {
            if (skillType === 'a_short') {
                this.attackState = 'a_short';
                this.attackTimer = 12;
                createArcSlashEffect(this.x + (this.lastFacingDir > 0 ? 50 : -50), this.y + 10, 80, '#66fcf1');
                dealDamageInBox(this.x + (this.lastFacingDir > 0 ? 10 : -90), this.y - 20, 100, 80, 18 * this.atkMultiplier, 8, this);
            } 
            else if (skillType === 'b_short') {
                this.attackState = 'b_c1';
                this.attackTimer = 10;
                this.x += this.lastFacingDir * 160;
                if (this.x < 0) this.x = 0;
                if (this.x > stageData.width - this.width) this.x = stageData.width - this.width;
                dealDamageInBox(this.x - 120, this.y - 20, 240, 80, 12 * this.atkMultiplier, 5, this, true);
                createDashTrail(this.x, this.y, this.lastFacingDir);
            }
            else if (skillType === 'ab_simul') {
                let startX = this.x;
                this.x += this.lastFacingDir * 100;
                createArcSlashEffect(this.x, this.y, 110, '#f5af19');
                dealDamageInBox(this.x - 60, this.y - 30, 140, 100, 25 * this.atkMultiplier, 12, this);
                setTimeout(() => { this.x = startX; }, 120);
            }
            else if (skillType === 'a_double') {
                this.attackState = 'a_double';
                this.attackTimer = 20;
                createArcSlashEffect(this.x + (this.lastFacingDir > 0 ? 60 : -60), this.y, 130, '#ffffff');
                dealDamageInBox(this.x + (this.lastFacingDir > 0 ? 10 : -120), this.y - 30, 140, 100, 40 * this.atkMultiplier, 18, this);
            }
            else if (skillType === 'b_double') {
                stageData.enemies.forEach(e => {
                    if (e.marked && e.hp > 0) {
                        e.takeDamage(32 * this.atkMultiplier, 15);
                        e.marked = false;
                        createArcSlashEffect(e.x + 15, e.y + 20, 90, '#66fcf1');
                    }
                });
            }
            else if (skillType === 'ult') {
                if (this.ultGauge < 100) return;
                this.ultGauge = 0;
                this.addUlt(0);
                this.attackState = 'ult_c1';
                this.attackTimer = 180;
            }
        } else {
            // Character 2
            if (skillType === 'b_short') {
                this.attackState = 'b_c2';
                this.attackTimer = 16;
                createFlames(this.x + (this.lastFacingDir > 0 ? 50 : -50), this.y + 10, 12);
                dealDamageInBox(this.x + (this.lastFacingDir > 0 ? 10 : -100), this.y - 20, 110, 80, 14 * this.atkMultiplier, 8, this, false, true);
            }
            else if (skillType === 'a_double') {
                this.attackState = 'a_double_c2';
                this.attackTimer = 15;
                createBowSpinEffect(this.x, this.y);
                dealDamageInBox(this.x - 70, this.y - 30, 170, 100, 16 * this.atkMultiplier, 20, this, false, false, true);
            }
            else if (skillType === 'b_double') {
                this.char2EnchantNextArrow = true;
                createParticles(this.x + 15, this.y + 25, '#ff5050', 15);
            }
            else if (skillType === 'ab_simul') {
                createFlames(this.x, this.y, 25);
                dealAreaDamage(this.x, this.y, 180, 8 * this.atkMultiplier, this, true);
            }
            else if (skillType === 'ult') {
                if (this.ultGauge < 100) return;
                this.ultGauge = 0;
                this.addUlt(0);
                projectiles.push(new Projectile(this.x + 20, this.y + 20, this.lastFacingDir * 14, 0, 60 * this.atkMultiplier, true, true, true));
            }
        }
    }

    fireBow(chargeRatio) {
        let dmgMult = 1 + chargeRatio * 4;
        let baseDmg = 7 * this.atkMultiplier * dmgMult;
        if (this.char2EnchantNextArrow) baseDmg *= 0.8;

        projectiles.push(new Projectile(
            this.x + 15, 
            this.y + 20, 
            this.lastFacingDir * (12 + chargeRatio * 8), 
            0, 
            baseDmg, 
            true, 
            chargeRatio > 0.8, 
            false, 
            this.char2EnchantNextArrow
        ));

        this.char2EnchantNextArrow = false;
    }

    draw(ctx) {
        let poseState = 'idle';
        if (!this.isGrounded) poseState = 'jump';
        else if (Math.abs(this.vx) > 0.1) poseState = 'run';

        if (this.attackState === 'a_short' || this.attackState === 'a_double') poseState = 'attack_sword';
        if (this.attackState === 'a_double_c2') poseState = 'spin_bow';
        if (this.char2Charging) poseState = 'attack_bow';

        drawStickman(ctx, this.x + 15 - cameraX, this.y + 54, this.lastFacingDir, {
            state: poseState,
            color: this.charType === 1 ? '#66fcf1' : '#f0932b',
            weapon: this.charType === 1 ? 'sword' : 'bow',
            charge: this.char2ChargeVal
        });

        // Overhead HP & Charge Bar
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(this.x - cameraX - 5, this.y - 12, 40, 5);
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(this.x - cameraX - 5, this.y - 12, (this.hp / this.maxHp) * 40, 5);

        if (this.char2Charging) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(this.x - cameraX - 5, this.y - 20, 40, 4);
            ctx.fillStyle = '#f5af19';
            ctx.fillRect(this.x - cameraX - 5, this.y - 20, this.char2ChargeVal * 40, 4);
        }
    }
}

/* --- ENEMY CLASS --- */
class Enemy {
    constructor(x, y, type, stageLevel) {
        this.x = x; this.y = y; this.type = type;
        this.width = type === 'boss' ? 50 : 32;
        this.height = type === 'boss' ? 80 : 54;
        this.vx = 0; this.vy = 0;

        let scale = 1 + (stageLevel - 1) * 0.3;
        this.maxHp = (type === 'boss' ? 400 : 60) * scale;
        this.hp = this.maxHp;
        this.atk = (type === 'boss' ? 20 : 10) * scale;

        this.active = false;
        this.facing = -1;
        this.attackCooldown = 0;
        this.attackWindup = 0;
        this.isAttacking = false;
        this.isFlashing = false;
        this.hitStun = 0;
        this.marked = false;
        this.burnTimer = 0;
    }

    update(player) {
        if (this.burnTimer > 0) {
            if (this.burnTimer % 30 === 0) {
                this.takeDamage(5, 0);
                createFlames(this.x + 15, this.y + 20, 3);
            }
            this.burnTimer--;
        }

        if (this.hitStun > 0) {
            this.hitStun--;
            this.isAttacking = false;
            this.isFlashing = false;
            return;
        }

        if (!this.active && this.x - cameraX < CANVAS_WIDTH + 100) this.active = true;
        if (!this.active || this.hp <= 0) return;

        let dist = player.x - this.x;
        this.facing = dist > 0 ? 1 : -1;
        let absDist = Math.abs(dist);

        if (this.attackCooldown > 0) this.attackCooldown--;

        if (this.isAttacking) {
            this.attackWindup--;
            // Attack Flash Signal right before hit
            if (this.attackWindup === 12) {
                this.isFlashing = true;
            }
            if (this.attackWindup <= 0) {
                this.executeAttack(player);
                this.isAttacking = false;
                this.isFlashing = false;
                this.attackCooldown = this.type === 'boss' ? 45 : 80;
            }
            return;
        }

        if (this.type === 'melee' && absDist < 70) {
            if (this.attackCooldown <= 0) { this.isAttacking = true; this.attackWindup = 35; }
        } else if (this.type === 'ranged' && absDist < 350) {
            if (this.attackCooldown <= 0) { this.isAttacking = true; this.attackWindup = 40; }
        } else if (this.type === 'boss' && absDist < 400) {
            if (this.attackCooldown <= 0) { this.isAttacking = true; this.attackWindup = 30; }
            else { this.x += this.facing * 2.0; }
        } else {
            this.x += this.facing * 1.8;
        }

        if (this.y + this.height < 460) this.vy += GRAVITY;
        else { this.y = 460 - this.height; this.vy = 0; }
        this.y += this.vy;
    }

    executeAttack(player) {
        let absDist = Math.abs(player.x - this.x);
        if (this.type === 'melee' && absDist < 85) {
            player.takeDamage(this.atk);
        } else if (this.type === 'ranged') {
            projectiles.push(new Projectile(this.x, this.y + 20, this.facing * 8, 0, this.atk, false));
        } else if (this.type === 'boss') {
            if (absDist < 110) {
                player.takeDamage(this.atk * 1.2);
                createArcSlashEffect(player.x, player.y, 100, '#ff0055');
            } else {
                projectiles.push(new Projectile(this.x, this.y + 20, this.facing * 10, 0, this.atk, false));
            }
        }
    }

    takeDamage(amount, stun = 8) {
        this.hp -= amount;
        this.hitStun = stun;
        createDamageNumber(this.x + 15, this.y - 10, amount, '#fff');
        addCombo();

        if (this.hp <= 0) {
            createParticles(this.x + 15, this.y + 25, '#ff7979', 15);
        }
    }

    draw(ctx) {
        if (this.hp <= 0) return;

        let pose = 'idle';
        if (this.isAttacking) pose = 'attack_sword';

        let color = '#ff7979';
        if (this.type === 'ranged') color = '#3498db';
        if (this.type === 'boss') color = '#e74c3c';

        drawStickman(ctx, this.x + 15 - cameraX, this.y + this.height, this.facing, {
            state: pose,
            color: color,
            weapon: 'sword'
        });

        // ATTACK FLASH WARNING
        if (this.isFlashing) {
            ctx.save();
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#fff';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(this.x + 15 - cameraX, this.y - 15, 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff0055';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('⚡PARRY!', this.x - cameraX - 5, this.y - 28);
            ctx.restore();
        }

        // Overhead HP
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(this.x - cameraX, this.y - 10, this.width, 5);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(this.x - cameraX, this.y - 10, (Math.max(0, this.hp) / this.maxHp) * this.width, 5);
    }
}

/* --- PROJECTILE & VISUAL EFFECTS --- */
let projectiles = [];
let visualEffects = [];
let damageNumbers = [];

class Projectile {
    constructor(x, y, vx, vy, damage, isPlayer, isBig = false, isExplosive = false, isBurn = false) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.damage = damage; this.isPlayer = isPlayer;
        this.isBig = isBig; this.isExplosive = isExplosive; this.isBurn = isBurn;
        this.alive = true;
    }

    update(player, enemies) {
        this.x += this.vx; this.y += this.vy;

        if (this.isPlayer) {
            enemies.forEach(e => {
                if (e.hp > 0 && this.x > e.x && this.x < e.x + e.width && this.y > e.y && this.y < e.y + e.height) {
                    e.takeDamage(this.damage);
                    if (this.isBurn) e.burnTimer = 360;
                    if (this.isExplosive) {
                        dealAreaDamage(this.x, this.y, 220, this.damage, player, true);
                        createFlames(this.x, this.y, 30);
                    }
                    this.alive = false;
                }
            });
        } else {
            if (this.x > player.x && this.x < player.x + player.width && this.y > player.y && this.y < player.y + player.height) {
                player.takeDamage(this.damage);
                this.alive = false;
            }
        }

        if (this.x - cameraX < -100 || this.x - cameraX > CANVAS_WIDTH + 100) this.alive = false;
    }

    draw(ctx) {
        ctx.save();
        ctx.fillStyle = this.isPlayer ? (this.isBurn ? '#ff0055' : '#66fcf1') : '#ff0055';
        ctx.beginPath();
        ctx.arc(this.x - cameraX, this.y, this.isBig ? 12 : 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

/* --- ADVANCED SLASH & FLAME EFFECTS --- */
function createArcSlashEffect(x, y, radius, edgeColor) {
    visualEffects.push({ type: 'arc_slash', x, y, radius, edgeColor, life: 12 });
}

function createFlames(x, y, count) {
    for (let i = 0; i < count; i++) {
        visualEffects.push({
            type: 'flame_particle',
            x: x + (Math.random() * 40 - 20),
            y: y + (Math.random() * 40 - 20),
            vx: (Math.random() - 0.5) * 4,
            vy: -Math.random() * 5 - 2,
            size: 10 + Math.random() * 15,
            life: 20
        });
    }
}

function createBowSpinEffect(x, y) {
    visualEffects.push({ type: 'bow_spin', x, y, life: 15 });
}

function createDashTrail(x, y, dir) {
    visualEffects.push({ type: 'trail', x, y, dir, life: 10 });
}

function triggerParryEffect(x, y) {
    visualEffects.push({ type: 'parry', x, y, life: 25 });
    createDamageNumber(x, y - 20, 'PARRY!', '#2ecc71');
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        visualEffects.push({
            type: 'particle', x, y,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            color, life: 20
        });
    }
}

function dealDamageInBox(x, y, w, h, damage, stun, player, applyMark = false, applyBurn = false, knockback = false) {
    stageData.enemies.forEach(e => {
        if (e.hp > 0 && e.x + e.width > x && e.x < x + w && e.y + e.height > y && e.y < y + h) {
            e.takeDamage(damage, stun);
            if (applyMark) e.marked = true;
            if (applyBurn) e.burnTimer = 360;
            if (knockback) e.x += player.lastFacingDir * 90;
        }
    });
}

function dealAreaDamage(x, y, radius, damage, player, applyBurn = false) {
    stageData.enemies.forEach(e => {
        let dx = (e.x + e.width/2) - x;
        let dy = (e.y + e.height/2) - y;
        if (e.hp > 0 && Math.sqrt(dx*dx + dy*dy) <= radius) {
            e.takeDamage(damage);
            if (applyBurn) e.burnTimer = 360;
        }
    });
}

function addCombo() {
    comboCount++;
    comboTimer = 120;
    const el = document.getElementById('combo-display');
    el.innerText = `${comboCount} COMBO!`;
    el.style.opacity = 1;

    if (player && player.charType === 1 && comboCount % 5 === 0) {
        createArcSlashEffect(player.x + player.lastFacingDir * 70, player.y + 10, 110, '#00c6ff');
        dealDamageInBox(player.x - 60, player.y - 30, 180, 100, 22 * player.atkMultiplier, 10, player);
    }
    player.addUlt(4);
}

function createDamageNumber(x, y, num, color) {
    damageNumbers.push({ x, y, num: Math.round(num), color, life: 30 });
}

/* --- STAGE SETUP & LOOP --- */
let player = null;

function loadStage(stageNum) {
    stageData.width = 2600 + stageNum * 500;
    stageData.platforms = [
        { x: 350, y: 360, w: 200, h: 16 },
        { x: 750, y: 280, w: 220, h: 16 },
        { x: 1250, y: 340, w: 200, h: 16 },
        { x: 1750, y: 270, w: 220, h: 16 }
    ];

    stageData.enemies = [];
    let enemyCount = 6 + stageNum * 2;
    for (let i = 0; i < enemyCount; i++) {
        let ex = 600 + (i * (stageData.width - 1000) / enemyCount);
        stageData.enemies.push(new Enemy(ex, 380, i % 2 === 0 ? 'melee' : 'ranged', stageNum));
    }
    stageData.enemies.push(new Enemy(stageData.width - 250, 360, 'boss', stageNum));

    player = new Player(gameState.selectedChar);
    cameraX = 0;
    projectiles = []; visualEffects = []; damageNumbers = []; comboCount = 0;
}

function gameLoop() {
    if (inGame && !isPaused) {
        updateGame();
        renderGame();
    }
    requestAnimationFrame(gameLoop);
}

function updateGame() {
    let targetCamX = player.x - 220;
    cameraX += (targetCamX - cameraX) * 0.12;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > stageData.width - CANVAS_WIDTH) cameraX = stageData.width - CANVAS_WIDTH;

    if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) { comboCount = 0; document.getElementById('combo-display').style.opacity = 0; }
    }

    player.update();

    let bossAlive = false;
    stageData.enemies.forEach(e => {
        e.update(player);
        if (e.type === 'boss' && e.hp > 0) bossAlive = true;
    });

    if (!bossAlive) endGame(true);

    projectiles.forEach(p => p.update(player, stageData.enemies));
    projectiles = projectiles.filter(p => p.alive);

    visualEffects.forEach(fx => {
        fx.life--;
        if (fx.type === 'flame_particle') {
            fx.x += fx.vx; fx.y += fx.vy;
        } else if (fx.type === 'particle') {
            fx.x += fx.vx; fx.y += fx.vy;
        }
    });
    visualEffects = visualEffects.filter(fx => fx.life > 0);

    damageNumbers.forEach(dn => { dn.y -= 0.8; dn.life--; });
    damageNumbers = damageNumbers.filter(dn => dn.life > 0);
}

function renderGame() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Background
    ctx.fillStyle = '#12131a';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Platforms
    ctx.fillStyle = '#45a29e';
    stageData.platforms.forEach(plat => {
        ctx.fillRect(plat.x - cameraX, plat.y, plat.w, plat.h);
    });

    // Floor
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 460, CANVAS_WIDTH, 80);
    ctx.fillStyle = '#66fcf1';
    ctx.fillRect(0, 460, CANVAS_WIDTH, 4);

    // Draw Entities
    stageData.enemies.forEach(e => e.draw(ctx));
    player.draw(ctx);
    projectiles.forEach(p => p.draw(ctx));

    // Render ARC SLASH & EFFECTS
    visualEffects.forEach(fx => {
        ctx.save();
        if (fx.type === 'arc_slash') {
            // ARC SLASH (White core, cyan glow edge)
            ctx.shadowColor = fx.edgeColor;
            ctx.shadowBlur = 15;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(fx.x - cameraX, fx.y, fx.radius, -Math.PI * 0.4, Math.PI * 0.4);
            ctx.stroke();

            ctx.strokeStyle = fx.edgeColor;
            ctx.lineWidth = 3;
            ctx.stroke();
        } else if (fx.type === 'flame_particle') {
            ctx.fillStyle = '#ff5050';
            ctx.shadowColor = '#f5af19';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(fx.x - cameraX, fx.y, fx.size * (fx.life/20), 0, Math.PI * 2);
            ctx.fill();
        } else if (fx.type === 'bow_spin') {
            ctx.strokeStyle = '#f0932b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(fx.x + 15 - cameraX, fx.y + 25, 45, 0, Math.PI * 2);
            ctx.stroke();
        } else if (fx.type === 'parry') {
            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(fx.x + 15 - cameraX, fx.y + 25, 60 - fx.life * 2, 0, Math.PI * 2);
            ctx.stroke();
        } else if (fx.type === 'particle') {
            ctx.fillStyle = fx.color;
            ctx.fillRect(fx.x - cameraX, fx.y, 4, 4);
        }
        ctx.restore();
    });

    // Render Damage Text
    damageNumbers.forEach(dn => {
        ctx.save();
        ctx.fillStyle = dn.color;
        ctx.font = '900 18px Arial';
        ctx.fillText(dn.num, dn.x - cameraX, dn.y);
        ctx.restore();
    });
}

function endGame(isVictory) {
    inGame = false;
    document.getElementById('game-ui').classList.add('hidden');
    const modal = document.getElementById('result-modal');
    modal.classList.remove('hidden');

    if (isVictory) {
        let earned = 120 + gameState.selectedStage * 60;
        gameState.points += earned;
        if (gameState.selectedStage === gameState.unlockedStage) {
            gameState.unlockedStage++;
        }
        document.getElementById('result-title').innerText = "VICTORY!";
        document.getElementById('result-desc').innerText = `ステージクリア！ 獲得ポイント: +${earned}`;
    } else {
        document.getElementById('result-title').innerText = "DEFEAT...";
        document.getElementById('result-desc').innerText = "HPが0になりました。";
    }
    updateUI();
}

/* --- PRECISE INPUT CONTROLLER --- */
function setupInput() {
    const slider = document.getElementById('move-slider');
    const thumb = document.getElementById('slider-thumb');
    let sliderActive = false;

    function handleSliderMove(clientX) {
        let rect = slider.getBoundingClientRect();
        let offsetX = clientX - rect.left - 26;
        offsetX = Math.max(0, Math.min(138, offsetX));
        thumb.style.left = offsetX + 'px';
        
        let norm = (offsetX - 69) / 69;
        inputState.moveDir = Math.abs(norm) < 0.25 ? 0 : norm;
    }

    slider.addEventListener('pointerdown', e => { sliderActive = true; handleSliderMove(e.clientX); });
    window.addEventListener('pointermove', e => { if (sliderActive) handleSliderMove(e.clientX); });
    window.addEventListener('pointerup', () => {
        sliderActive = false;
        thumb.style.left = '69px';
        inputState.moveDir = 0;
    });

    const btnA = document.getElementById('btn-a');
    const btnB = document.getElementById('btn-b');
    const btnJump = document.getElementById('btn-jump');
    const btnDodge = document.getElementById('btn-dodge');

    btnJump.addEventListener('pointerdown', () => inputState.jumpPressed = true);
    btnDodge.addEventListener('pointerdown', () => player && player.triggerDodge());

    let lastAPress = 0, lastBPress = 0;
    let aTapTimer = null, bTapTimer = null;
    let aPressing = false, bPressing = false;

    btnA.addEventListener('pointerdown', () => {
        let now = Date.now();
        aPressing = true;

        if (bPressing && (now - lastBPress < 100)) {
            player.executeSkill('ab_simul');
            return;
        }
        lastAPress = now;

        if (now - lastAPress < 250) {
            clearTimeout(aTapTimer);
            player.executeSkill('a_double');
        } else {
            if (player.charType === 1) {
                aTapTimer = setTimeout(() => { player.executeSkill('a_short'); }, 160);
            } else {
                player.char2Charging = true;
                player.char2ChargeVal = 0;
            }
        }
    });

    btnA.addEventListener('pointerup', () => {
        aPressing = false;
        if (player && player.charType === 2 && player.char2Charging) {
            player.fireBow(player.char2ChargeVal);
            player.char2Charging = false;
            player.char2ChargeVal = 0;
        }
    });

    btnB.addEventListener('pointerdown', () => {
        let now = Date.now();
        bPressing = true;

        if (aPressing && (now - lastAPress < 100)) {
            player.executeSkill('ab_simul');
            return;
        }
        lastBPress = now;

        if (now - lastBPress < 250) {
            clearTimeout(bTapTimer);
            player.executeSkill('b_double');
        } else {
            bTapTimer = setTimeout(() => { player.executeSkill('b_short'); }, 160);
        }
    });

    btnB.addEventListener('pointerup', () => { bPressing = false; });

    document.getElementById('ult-btn').addEventListener('click', () => player && player.executeSkill('ult'));
}

/* --- UI EVENT HANDLERS --- */
function updateUI() {
    document.getElementById('user-points').innerText = gameState.points;
    document.getElementById('upgrade-points').innerText = gameState.points;
    document.getElementById('shop-points').innerText = gameState.points;

    document.getElementById('lvl-atk').innerText = gameState.upgrades.atk;
    document.getElementById('lvl-hp').innerText = gameState.upgrades.hp;

    const container = document.getElementById('stage-selector');
    container.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
        const card = document.createElement('div');
        card.className = `stage-card ${i <= gameState.unlockedStage ? 'unlocked' : ''} ${i === gameState.selectedStage ? 'selected' : ''}`;
        card.innerText = `STAGE ${i}`;
        if (i <= gameState.unlockedStage) {
            card.addEventListener('click', () => { gameState.selectedStage = i; updateUI(); });
        }
        container.appendChild(card);
    }
}

function setupMenuEvents() {
    document.getElementById('start-game-btn').addEventListener('click', () => {
        document.getElementById('home-modal').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        inGame = true; isPaused = false;
        loadStage(gameState.selectedStage);
    });

    document.getElementById('char-select-trigger').addEventListener('click', () => {
        document.getElementById('char-modal').classList.remove('hidden');
        updateCharDesc();
    });
    document.getElementById('close-char-btn').addEventListener('click', () => document.getElementById('char-modal').classList.add('hidden'));

    document.getElementById('select-c1').addEventListener('click', () => { gameState.selectedChar = 1; updateCharDesc(); });
    document.getElementById('select-c2').addEventListener('click', () => { gameState.selectedChar = 2; updateCharDesc(); });

    document.getElementById('upgrade-btn').addEventListener('click', () => document.getElementById('upgrade-modal').classList.remove('hidden'));
    document.getElementById('close-upgrade-btn').addEventListener('click', () => document.getElementById('upgrade-modal').classList.add('hidden'));

    document.getElementById('settings-btn').addEventListener('click', () => document.getElementById('settings-modal').classList.remove('hidden'));
    document.getElementById('close-settings-btn').addEventListener('click', () => document.getElementById('settings-modal').classList.add('hidden'));

    document.getElementById('pause-btn').addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) document.getElementById('shop-modal').classList.remove('hidden');
    });
    document.getElementById('shop-btn').addEventListener('click', () => {
        isPaused = true;
        document.getElementById('shop-modal').classList.remove('hidden');
    });
    document.getElementById('close-shop-btn').addEventListener('click', () => {
        document.getElementById('shop-modal').classList.add('hidden');
        isPaused = false;
    });

    document.getElementById('result-ok-btn').addEventListener('click', () => {
        document.getElementById('result-modal').classList.add('hidden');
        document.getElementById('home-modal').classList.remove('hidden');
    });

    document.getElementById('scale-slider').addEventListener('input', (e) => {
        userScaleMultiplier = parseFloat(e.target.value);
        fitGameToWindow();
    });

    document.getElementById('buy-atk-btn').addEventListener('click', () => {
        if (gameState.points >= 100) { gameState.points -= 100; gameState.upgrades.atk++; updateUI(); }
    });
    document.getElementById('buy-hp-btn').addEventListener('click', () => {
        if (gameState.points >= 100) { gameState.points -= 100; gameState.upgrades.hp++; updateUI(); }
    });

    document.getElementById('buy-item-heal1').addEventListener('click', () => {
        if (gameState.points >= 50 && player) {
            gameState.points -= 50;
            player.hp = Math.min(player.maxHp, player.hp + 30);
            createDamageNumber(player.x, player.y - 20, '+30 HP', '#2ecc71');
            updateUI();
        }
    });
    document.getElementById('buy-item-heal2').addEventListener('click', () => {
        if (gameState.points >= 120 && player) {
            gameState.points -= 120;
            player.hp = Math.min(player.maxHp, player.hp + 80);
            createDamageNumber(player.x, player.y - 20, '+80 HP', '#2ecc71');
            updateUI();
        }
    });
}

function updateCharDesc() {
    const nameEl = document.getElementById('char-name');
    const avatarEl = document.getElementById('char-avatar');
    const descEl = document.getElementById('char-desc');

    if (gameState.selectedChar === 1) {
        nameEl.innerText = "キャラクター1 (剣士)";
        avatarEl.innerText = "⚔️";
        descEl.innerHTML = `
            <b>【操作・コマンド】</b><br>
            ・<b>A短押し:</b> 水色縁の美しい円形斬撃をシュッと放つ<br>
            ・<b>B短押し:</b> 前方へ超高速ダッシュ＋マーキング<br>
            ・<b>A+B同時押し:</b> 前方へ攻撃後に元の位置へバックステップ<br>
            ・<b>Aダブルタップ:</b> 超威力の特大白光斬撃<br>
            ・<b>Bダブルタップ:</b> マーク中の全敵へ連続一閃<br>
            ・<b>必殺技:</b> 画面全域を無敵状態で無限連撃
        `;
    } else {
        nameEl.innerText = "キャラクター2 (弓＆炎)";
        avatarEl.innerText = "🏹";
        descEl.innerHTML = `
            <b>【操作・コマンド】</b><br>
            ・<b>A長押し:</b> 弓チャージショット (長押しで威力最大5倍)<br>
            ・<b>B短押し:</b> 前方に激しい炎放出 (持続燃焼ダメージ)<br>
            ・<b>Aダブルタップ:</b> 弓を回して敵を強力ノックバック<br>
            ・<b>Bダブルタップ:</b> 次の矢に炎効果追加 (威力20%減/燃焼付与)<br>
            ・<b>A+B同時押し:</b> 全方位に炎散布<br>
            ・<b>必殺技:</b> 巨大炎矢＋画面全体の広域爆発＆燃焼
        `;
    }
}

/* --- INIT --- */
window.onload = () => {
    fitGameToWindow();
    setupInput();
    setupMenuEvents();
    updateUI();
    gameLoop();
};
</script>
