    },
    
    draw(ctx, cam) {
        ctx.fillStyle = '#1e272e'; ctx.fillRect(-cam.x, -cam.y, this.mapW, this.mapH);
        ctx.save(); ctx.translate(-cam.x, -cam.y);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 2;
        ctx.beginPath();
        for(let x=0; x<this.mapW; x+=100) { ctx.moveTo(x,0); ctx.lineTo(x,this.mapH); }
        for(let y=0; y<this.mapH; y+=100) { ctx.moveTo(0,y); ctx.lineTo(this.mapW,y); }
        ctx.stroke();

        if(this.mode === 'showdown') {
            ctx.fillStyle = 'rgba(46, 204, 113, 0.4)';
            ctx.beginPath(); ctx.rect(0, 0, this.mapW, this.mapH);
            ctx.arc(this.mapW/2, this.mapH/2, this.poisonRadius, 0, Math.PI*2, true); ctx.fill();
        }

        this.map.forEach(w => {
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(w.x, w.y+w.h, w.w, 15); 
            ctx.fillStyle = '#95a5a6'; ctx.fillRect(w.x, w.y, w.w, w.h); 
            ctx.strokeStyle = '#34495e'; ctx.lineWidth = 4; ctx.strokeRect(w.x, w.y, w.w, w.h);
        });

        let draws = [...this.items, ...this.entities, ...this.ghosts, ...this.particles, ...this.areaEffects];
        draws.sort((a,b) => a.y - b.y);
        draws.forEach(d => d.draw(ctx));
        
        this.bullets.forEach(b => b.draw(ctx)); 
        this.uiEffects.forEach(u => u.draw(ctx)); 
        
        if(player && player.hp > 0) {
            for(let key in Input.btns) {
                let b = Input.btns[key];
                if(b.id !== null && !b.tapOnly && b.dragged && b.mag >= 0.35) {
                    ctx.save();
                    let range = player.data.range;
                    if(key === 'super' && player.type === 'shelly') range *= 1.3;
                    if(key === 'gadget' && player.gadget === 'sharp') range *= 1.5;

                    let isNormalEmpty = (player.ammo === 0 && key === 'attack');
                    if (player.type === 'pius') isNormalEmpty = (player.ammo === 0 && key === 'attack' || player.piusReloading);

                    ctx.fillStyle = key==='attack' ? 'rgba(255,255,255,0.22)' : 'rgba(241,196,15,0.3)';
                    ctx.strokeStyle = key==='attack' ? 'rgba(255,255,255,0.5)' : 'rgba(241,196,15,0.7)';
                    if(isNormalEmpty) { ctx.fillStyle = 'rgba(231,76,60,0.2)'; ctx.strokeStyle = 'rgba(231,76,60,0.5)'; }
                    ctx.lineWidth = 2; ctx.translate(player.x, player.y);
                    
                    if (player.type === 'shelly') {
                        if (key === 'attack') {
                            ctx.rotate(btn.angle); let w = player.data.attackWidth;
                            ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, range, -w, w); ctx.closePath();
                            ctx.fill(); ctx.stroke();
                        } else if (key === 'super') {
                            ctx.rotate(btn.angle); let w = 0.8; 
                            ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, range, -w, w); ctx.closePath();
                            ctx.fill(); ctx.stroke();
                        } else if (key === 'gadget' && player.gadget === 'dash') {
                            ctx.rotate(btn.angle); ctx.strokeStyle = 'rgba(46, 204, 113, 0.6)'; ctx.lineWidth = 8;
                            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(195, 0); ctx.stroke();
                        }
                    } else if (player.type === 'colt') {
                        ctx.rotate(btn.angle);
                        if (key === 'attack') { ctx.fillRect(0, -12, range, 24); ctx.strokeRect(0, -12, range, 24); }
                        else if (key === 'super') { ctx.fillRect(0, -20, range, 40); ctx.strokeRect(0, -20, range, 40); }
                    } else if (player.type === 'primo') {
                        if (key === 'attack') {
                            ctx.rotate(btn.angle); let w = player.data.attackWidth;
                            ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, range, -w, w); ctx.closePath(); ctx.fill(); ctx.stroke();
                        } else if (key === 'super') {
                            let landingSpot = getSafeLandingSpot(player.x, player.y, btn.angle, btn.mag * 350, player.r);
                            let tx = landingSpot.x - player.x, ty = landingSpot.y - player.y;
                            ctx.strokeStyle = 'rgba(241, 196, 15, 0.6)'; ctx.lineWidth = 4;
                            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(tx, ty); ctx.stroke();
                            ctx.fillStyle = 'rgba(241, 196, 15, 0.2)'; ctx.beginPath(); ctx.arc(tx, ty, player.sp === 'shock' ? 140 : 100, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                        }
                    } else if (player.type === 'gus') {
                        ctx.rotate(btn.angle);
                        if (key === 'attack') { ctx.fillRect(0, -9, range, 18); ctx.strokeRect(0, -9, range, 18); }
                    } else if (player.type === 'mortis') {
                        ctx.rotate(btn.angle);
                        if (key === 'attack') {
                            let currentRange = range * (1 + player.longDashGauge * 2);
                            ctx.fillRect(0, -20, currentRange, 40); ctx.strokeRect(0, -20, currentRange, 40);
                        }
                    } else if (player.type === 'kit') {
                        if (key === 'attack') {
                            ctx.rotate(btn.angle); let w = player.data.attackWidth;
                            ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, range, -w, w); ctx.closePath(); ctx.fill(); ctx.stroke();
                        }
                    } else if (player.type === 'chester') {
                        ctx.rotate(btn.angle);
                        if (key === 'attack') {
                            let activeG = player.hcActive ? 3 : player.chesterGauge;
                            if (activeG === 0) {
                                ctx.fillRect(0, -8, range, 16); ctx.strokeRect(0, -8, range, 16);
                            } else {
                                // チェスターの通常攻撃エイム線：一発目以外は角度が正確な扇形に
                                let numBullets = activeG + 1;
                                let w = 0.08 * (numBullets - 1) + 0.12;
                                ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, range, -w/2, w/2); ctx.closePath();
                                ctx.fill(); ctx.stroke();
                            }
                        }
                    } else if (player.type === 'pius') {
                        ctx.rotate(btn.angle);
                        if (key === 'attack') { ctx.fillRect(0, -8, range, 16); ctx.strokeRect(0, -8, range, 16); }
                    }
                    ctx.restore();
                }
            }
        }
        ctx.restore();
    },
    
    addLog(k, v, team) {
        let log = document.getElementById('kill-log');
        let div = document.createElement('div');
        div.className = 'log-item';
        let color = team === 1 ? '#3498db' : '#e74c3c';
        div.innerHTML = `<span style="color:${color}">${k}</span> 💥 <span>${v}</span>`;
        log.appendChild(div);
        setTimeout(() => { if(div.parentNode) div.parentNode.removeChild(div); }, 4000);
    },
    updateHUD(html) { document.getElementById('hud-top').innerHTML = html; },
    
    end(winTeam) {
        this.state = 'end';
        this.entities.forEach(e => {
            if (!this.globalStats[e.name]) this.globalStats[e.name] = { kills: e.kills, deaths: e.deaths, brawler: e.data.name, team: e.team };
            else { this.globalStats[e.name].kills = e.kills; this.globalStats[e.name].deaths = e.deaths; }
        });

        let isT1Win = winTeam === 1;
        let isMyTeam = player ? player.team === winTeam : isT1Win;
        let msg = isMyTeam ? "🎉 VICTORY!" : (winTeam === 0 ? "➖ DRAW" : "💀 DEFEAT");
        if(this.mode === 'showdown') msg = (player && winTeam === player.team) ? "👑 #1 ドン勝！" : "💀 GAME OVER";
        
        let hud = document.getElementById('hud-top');
        hud.innerHTML = msg; hud.style.fontSize = '2.5rem'; hud.style.color = (isMyTeam || (player && winTeam===player.team)) ? '#f1c40f' : '#e74c3c';
        
        setTimeout(() => {
            hud.style.fontSize = '1.2rem'; hud.style.color = '#fff';
            this.showScoreboard(winTeam);
        }, 3000);
    },

    showScoreboard(winTeam) {
        document.getElementById('gameCanvas').style.display = 'none';
        document.getElementById('uiLayer').style.display = 'none';
        let resultsScreen = document.getElementById('resultsScreen');
        resultsScreen.style.display = 'flex';
        
        let title = document.getElementById('resultsTitle');
        let isT1Win = winTeam === 1;
        let isMyTeam = player ? player.team === winTeam : isT1Win;
        if (this.mode === 'showdown') title.textContent = (player && winTeam === player.team) ? "🏆 ROYAL VICTORY! (1位)" : "💀 BATTLE OVER";
        else title.textContent = isMyTeam ? "🎉 VICTORY (チーム勝利!)" : "💀 DEFEAT (敗北...)";

        let tableBody = document.getElementById('resultsTableBody');
        tableBody.innerHTML = '';

        let statsArray = Object.keys(this.globalStats).map(name => ({
            name: name, kills: this.globalStats[name].kills, deaths: this.globalStats[name].deaths,
            brawler: this.globalStats[name].brawler, team: this.globalStats[name].team
        }));

        statsArray.sort((a, b) => {
            if (b.kills !== a.kills) return b.kills - a.kills;
            return a.deaths - b.deaths;
        });

        statsArray.forEach(data => {
            let tr = document.createElement('tr');
            if (data.name === "YOU") tr.className = 'highlight';
            let teamText = this.mode === 'showdown' ? (data.name === "YOU" ? "プレイヤー" : "ボット") : (data.team === 1 ? "🟢 味方チーム" : "🔴 敵チーム");
            tr.innerHTML = `
                <td>${data.name} (${data.brawler})</td>
                <td>${teamText}</td>
                <td><strong style="color: #2ecc71;">${data.kills}</strong></td>
                <td><strong style="color: #e74c3c;">${data.deaths}</strong></td>
            `;
            tableBody.appendChild(tr);
        });
    }
};

const cam = {
    x: 0, y: 0, zoom: 0.45,
    update(tgt) {
        if (tgt && tgt.hp > 0) {
            Game.spectateX = tgt.x; Game.spectateY = tgt.y;
        } else {
            if (Input.leftJoy.active) {
                Game.spectateX += Input.leftJoy.nx * 8 * Input.leftJoy.mag * Game.timeScale;
                Game.spectateY += Input.leftJoy.ny * 8 * Input.leftJoy.mag * Game.timeScale;
            } else {
                let aliveFriend = Game.entities.find(e => e.team === 1 && e.hp > 0);
                if (aliveFriend) {
                    Game.spectateX += (aliveFriend.x - Game.spectateX) * 0.05 * Game.timeScale;
                    Game.spectateY += (aliveFriend.y - Game.spectateY) * 0.05 * Game.timeScale;
                }
            }
        }
        let targetCamX = Game.spectateX - (cw / 2) / this.zoom;
        let targetCamY = Game.spectateY - (ch / 2) / this.zoom;
        this.x += (targetCamX - this.x) * 0.15 * Game.timeScale;
        this.y += (targetCamY - this.y) * 0.15 * Game.timeScale;
        this.x = Math.max(0, Math.min(this.x, Game.mapW - cw / this.zoom));
        this.y = Math.max(0, Math.min(this.y, Game.mapH - ch / this.zoom));
    }
};

function drawUI() {
    ctx.lineWidth = 3;
    if(Input.leftJoy.active) {
        ctx.beginPath(); ctx.arc(Input.leftJoy.ox, Input.leftJoy.oy, 60, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(52, 152, 219, 0.2)'; ctx.fill(); ctx.strokeStyle='rgba(52, 152, 219, 0.5)'; ctx.stroke();
        ctx.beginPath(); ctx.arc(Input.leftJoy.x, Input.leftJoy.y, 25, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(52, 152, 219, 0.8)'; ctx.fill();
    }
    
    if (!player || player.hp <= 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(20, 20, 310, 45);
        ctx.strokeStyle = '#f1c40f'; ctx.strokeRect(20, 20, 310, 45);
        ctx.fillStyle = '#fff'; ctx.font = '900 13px Nunito'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText("📷 観戦中: 左ジョイスティックでカメラ移動", 28, 42.5);
    }
    
    if (player && player.hp > 0) {
        for(let key in Input.btns) {
            let b = Input.btns[key];
            ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI*2);
            ctx.fillStyle = (key === 'gadget' && player.gadgetCooldown > 0) ? 'rgba(120, 120, 120, 0.3)' : b.color + '66';
            ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();
            
            let currentIcon = b.icon;
            if (key === 'super' && player.type === 'chester') {
                let revealEnabled = (player.sp === 'reveal' || player.superCharge >= player.maxSuperCharge);
                if (revealEnabled) {
                    let sT = player.chesterSuperType;
                    if (sT === 'explode') currentIcon = '💣';
                    else if (sT === 'stun') currentIcon = '⚡';
                    else if (sT === 'heal') currentIcon = '💖';
                    else if (sT === 'poison') currentIcon = '🤢';
                    else if (sT === 'ice') currentIcon = '❄️';
                } else { currentIcon = '❓'; }
            }

            ctx.fillStyle = '#ffffff'; ctx.font = `bold ${Math.floor(b.r * 0.9)}px system-ui`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(currentIcon, b.cx, b.cy);

            if (b.id !== null && !b.tapOnly) {
                let nx = b.cx + Math.cos(b.angle)*b.mag*b.r, ny = b.cy + Math.sin(b.angle)*b.mag*b.r;
                ctx.beginPath(); ctx.arc(nx, ny, b.r*0.5, 0, Math.PI*2);
                ctx.fillStyle = (key === 'gadget' && player.gadgetCooldown > 0) ? '#7f8c8d' : b.color;
                ctx.fill(); ctx.stroke();
            }

            ctx.lineWidth = 6;
            if(key === 'super') {
                let ratio = player.superCharge / player.maxSuperCharge;
                ctx.strokeStyle = ratio >= 1 ? '#f1c40f' : 'rgba(241, 196, 15, 0.3)';
                ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r+5, -Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(ratio, 1)); ctx.stroke();
            } else if (key === 'hc') {
                let ratio = player.hcCharge / player.maxHcCharge;
                ctx.strokeStyle = ratio >= 1 ? '#9b59b6' : 'rgba(155, 89, 182, 0.3)';
                ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r+5, -Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(ratio, 1)); ctx.stroke();
            } else if (key === 'gadget' && player.gadgetCooldown > 0) {
                ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(30, 30, 30, 0.75)'; ctx.fill();
                let ratio = player.gadgetCooldown / 600;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath(); ctx.moveTo(b.cx, b.cy); ctx.arc(b.cx, b.cy, b.r, -Math.PI/2, -Math.PI/2 + Math.PI*2*ratio); ctx.fill();
                let remainingSec = (player.gadgetCooldown / 60).toFixed(1);
                ctx.fillStyle = '#ffffff'; ctx.font = '900 18px Nunito'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(remainingSec + "s", b.cx, b.cy);
            }
        }
    }
    
    // ご要望：画面下側の体力バーとリロード表示を完全に削除
}

function loop(now) {
    requestAnimationFrame(loop);
    if (!Game.lastTime) Game.lastTime = now;
    let elapsed = now - Game.lastTime; Game.lastTime = now;
    if (elapsed > 160) elapsed = 160; 
    Game.timeScale = elapsed / (1000 / 60);

    if(Game.state !== 'playing') return;
    Game.update();
    cam.update(player);
    
    ctx.clearRect(0,0,cw,ch);
    ctx.save();
    ctx.scale(cam.zoom, cam.zoom);
    Game.draw(ctx, cam);
    ctx.restore();
    drawUI();
}

document.getElementById('btnStart').addEventListener('click', () => {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameCanvas').style.display = 'block';
    Input.initLayout();
    const selfSlot = SlotsManager.slots[0];
    Game.init(document.getElementById('selMode').value, selfSlot.brawler);
});

document.getElementById('btnCloseResults').addEventListener('click', () => {
    document.getElementById('resultsScreen').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    SlotsManager.render();
});

Input.initLayout();
requestAnimationFrame((now) => { Game.lastTime = now; loop(now); });
</script>
</body>
