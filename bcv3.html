class Character extends Entity {
    constructor(type, isPlayer, team, x, y, customSlot = null) {
        super(x, y, 22);
        this.type = type; this.isPlayer = isPlayer; this.team = team;
        this.data = CHAR_DATA[type];
        this.hp = this.maxHp = this.data.hp;
        this.baseSpeed = this.data.speed;
        this.maxAmmo = this.data.ammo; this.ammo = this.maxAmmo;
        this.reloadTime = this.data.reload; this.reloadTimer = 0;
        
        this.superCharge = 0; this.maxSuperCharge = 100;
        this.hcCharge = 0; this.maxHcCharge = 250;
        
        this.gadgetCooldown = 0; this.hcActive = false; this.hcTimer = 0;
        this.effects = []; this.fireQueue = [];
        this.dashTimer = 0; this.dashVx = 0; this.dashVy = 0;
        this.invincible = false; this.z = 0;
        this.gems = 0; this.cubes = 0;
        this.kills = 0; this.deaths = 0;
        this.facing = 0; this.lastDamagedTimer = 0;
        this.autoAimTargetDist = null;
        this.ghostGauge = 0; this.shield = 0; this.longDashGauge = 0;
        this.attackIntervalTimer = 0;
        this.pushVx = 0; this.pushVy = 0; this.pushTimer = 0;
        this.bountyStars = 2;

        this.invisibleTimer = 0;
        this.ridingTarget = null;
        this.ridingTimer = 0;
        this.kitStunCooldown = 0;

        this.chesterGauge = 0;
        this.chesterSuperTypes = ['explode', 'stun', 'heal', 'poison', 'ice'];
        this.chesterSuperType = this.chesterSuperTypes[Math.floor(Math.random() * this.chesterSuperTypes.length)];
        this.candyBuffTimer = 0; this.candyBuffType = '';
        
        if (this.type === 'pius') {
            this.piusReloading = false;
            this.piusHCDelayTimer = 0;
        }

        if (customSlot) {
            this.name = customSlot.isPlayer ? "YOU" : customSlot.name;
            this.gadget = customSlot.gadget === 'random' ? this.data.gadgets[Math.floor(Math.random() * this.data.gadgets.length)].id : customSlot.gadget;
            this.sp = customSlot.sp === 'random' ? this.data.sps[Math.floor(Math.random() * this.data.sps.length)].id : customSlot.sp;
        } else {
            if(isPlayer) {
                const selGadget = document.getElementById('selGadget');
                const selSp = document.getElementById('selSp');
                this.gadget = selGadget ? selGadget.value : 'dash';
                this.sp = selSp ? selSp.value : 'hyper';
                this.name = "YOU";
            } else {
                this.gadget = this.data.gadgets[Math.floor(Math.random()*this.data.gadgets.length)].id;
                this.sp = this.data.sps[Math.floor(Math.random()*this.data.sps.length)].id;
                this.name = "Bot " + Math.floor(Math.random()*99);
            }
        }

        if (this.sp === 'combo' && this.type === 'shelly') this.maxAmmo = 4;
        if (this.sp === 'speedcat' && this.type === 'kit') this.baseSpeed = CHAR_DATA.kit.speed * 1.1;
        
        this.aiState = 'fight'; this.aiTarget = null;
        this.moveAng = 0; this.aiTimer = 0; this.stuckTimer = 0; 
        this.lastX = x; this.lastY = y;
    }
    
    getSpeed() {
        if (this.ridingTarget) return 0;
        if (this.effects.some(e => e.type === 'stun')) return 0;
        let s = this.baseSpeed;
        if(this.hcActive) s *= 1.25;
        if(this.effects.some(e=>e.type==='speed')) s *= 1.3;
        if(this.effects.some(e=>e.type==='slow')) s *= 0.6;
        if(this.candyBuffTimer > 0 && this.candyBuffType === 'speed') s *= 1.35;
        return s;
    }
    
    takeDamage(dmg, attacker) {
        if(this.invincible || this.hp <= 0) return;
        if(this.hcActive && this.type === 'shelly') dmg *= 0.5; 
        if(this.cubes > 0) dmg = dmg * (1 - Math.min(this.cubes*0.05, 0.5));
        
        if (this.shield && this.shield > 0) {
            if (this.shield >= dmg) { this.shield -= dmg; dmg = 0; }
            else { dmg -= this.shield; this.shield = 0; }
            Game.uiEffects.push(new FloatingText(this.x, this.y - 60, "BLOCKED", '#f1c40f', 16));
        }

        if (dmg <= 0) return;

        let finalDmg = Math.floor(dmg);
        this.hp -= finalDmg;
        this.lastDamagedTimer = 0; 
        
        if (this.type === 'kit' && this.invisibleTimer > 0) {
            this.invisibleTimer = 0;
            Game.uiEffects.push(new FloatingText(this.x, this.y - 60, "REVEALED", '#ff4757', 16));
        }
        
        if (this.isPlayer && navigator.vibrate) navigator.vibrate(100);
        
        Game.uiEffects.push(new FloatingText(this.x + (Math.random()-0.5)*20, this.y - 30, finalDmg, '#ff4757', 22));
        
        if(this.hp <= 0) this.die(attacker);
        else this.chargeSuper(finalDmg * 0.015);
    }
    
    chargeSuper(amt) {
        let rate = this.data.superChargeRate || 1;
        this.superCharge = Math.min(this.maxSuperCharge, this.superCharge + amt * rate);
        this.hcCharge = Math.min(this.maxHcCharge, this.hcCharge + amt * rate * 0.6);
    }
    
    die(attacker) {
        this.hp = 0; this.deaths++; this.effects = [];
        
        if (this.ridingTarget) {
            this.ridingTarget.effects = this.ridingTarget.effects.filter(e => e.type !== 'stun');
            this.ridingTarget = null;
        }

        Game.entities.forEach(e => {
            if (e.type === 'kit' && e.ridingTarget === this) {
                e.ridingTarget = null;
                e.effects = e.effects.filter(eff => eff.type !== 'stun');
                e.z = 0;
            }
        });
        
        if (attacker) {
            attacker.kills++;
            if (!Game.globalStats[attacker.name]) Game.globalStats[attacker.name] = { kills: 0, deaths: 0, brawler: attacker.data.name, team: attacker.team };
            Game.globalStats[attacker.name].kills++;
        }
        
        if (!Game.globalStats[this.name]) Game.globalStats[this.name] = { kills: 0, deaths: 0, brawler: this.data.name, team: this.team };
        Game.globalStats[this.name].deaths++;
        
        Game.addLog(attacker ? attacker.name : "System", this.name, this.team);
        
        for(let i=0; i<15; i++) Game.particles.push(new Particle(this.x, this.y, this.team===1?'#3498db':'#e74c3c', Math.random()*6+2, (Math.random()-0.5)*10, (Math.random()-0.5)*10, 30));
        
        if(Game.mode === 'gemgrab' && this.gems > 0) {
            for(let i=0; i<this.gems; i++) Game.items.push(new Item(this.x+(Math.random()-0.5)*50, this.y+(Math.random()-0.5)*50, 'gem'));
            this.gems = 0;
        } else if (Game.mode === 'showdown') {
            let dropCount = 1 + Math.floor(this.cubes/2);
            for(let i=0; i<dropCount; i++) Game.items.push(new Item(this.x+(Math.random()-0.5)*30, this.y+(Math.random()-0.5)*30, 'cube'));
        } else if (Game.mode === 'bounty') {
            if (attacker) {
                let starsGained = this.bountyStars;
                if (attacker.team === 1) Game.score.t1 += starsGained;
                else Game.score.t2 += starsGained;
                attacker.bountyStars = (attacker.bountyStars || 2) + 1;
                Game.uiEffects.push(new FloatingText(attacker.x, attacker.y - 60, `+${starsGained} ⭐`, '#f1c40f', 24));
            }
            this.bountyStars = 2;
        }
        
        if(Game.mode === 'wipeout' && attacker) {
            if(attacker.team === 1) Game.score.t1++; else Game.score.t2++;
        }
        
        if(Game.mode === 'knockout' || Game.mode === 'showdown') {
            this.remove = true;
        } else {
            setTimeout(() => {
                if(Game.state === 'playing' && !this.remove) {
                    this.hp = this.maxHp;
                    let sp = Game.getSpawn(this.team);
                    this.x = sp.x; this.y = sp.y; this.ammo = this.maxAmmo;
                    this.pushTimer = 0; this.bountyStars = 2;
                    this.invincible = true; setTimeout(()=>this.invincible=false, 3000);
                    if(this.type === 'pius') this.piusReloading = false;
                }
            }, 3000);
        }
    }

    activateHC() {
        if (this.hcCharge >= this.maxHcCharge) {
            this.hcCharge = 0; this.hcActive = true; this.hcTimer = 300; 
            Game.uiEffects.push(new FloatingText(this.x, this.y-50, "HYPER CHARGE!", '#9b59b6', 26));
        }
    }

    requestAttack(angle, btnType) {
        if(this.dashTimer > 0 || this.z > 0) return;
        if (this.ridingTarget) return;
        if (this.effects.some(e => e.type === 'stun')) return;
        
        this.facing = angle; this.lastDamagedTimer = 0; 
        
        if(btnType === 'normal') {
            if (this.attackIntervalTimer > 0) return;
            if (this.type === 'pius') {
                if (this.ammo >= 1 && !this.piusReloading) {
                    this.ammo--; this.executeAttack(angle, 'normal'); this.attackIntervalTimer = 12;
                }
            } else if (this.ammo >= 1) {
                this.ammo--; this.executeAttack(angle, 'normal'); this.attackIntervalTimer = 12;
            }
        } else if (btnType === 'super' && this.superCharge >= this.maxSuperCharge) {
            this.superCharge = 0; this.executeAttack(angle, 'super');
        } else if (btnType === 'gadget' && this.gadgetCooldown <= 0) {
            this.gadgetCooldown = 600; this.executeAttack(angle, 'gadget');
        }
    }
    
    collectPiusAmmo(ammoObj, fireBullet) {
        if (this.ammo < this.maxAmmo) this.ammo++;
        if (this.piusReloading) { this.piusReloading = false; this.reloadTimer = 0; }
        
        Game.uiEffects.push(new FloatingText(this.x, this.y - 30, "+AMMO", '#3498db', 16));
        
        if (fireBullet) {
            let target = Game.findClosestEnemy(this, 600);
            let angle = this.facing;
            if (target) angle = Math.atan2(target.y - this.y, target.x - this.x);
            let dmgMult = this.hcActive ? 1.25 : 1;
            if(this.cubes > 0) dmgMult *= (1 + this.cubes*0.1); 
            
            let b = new Bullet(this, angle, 18, 550, 1200 * dmgMult, 14, 'normal');
            b.pierce = true; b.isPiusAutoBullet = true;
            if (this.sp === 'auto_aim') b.homing = true;
            Game.bullets.push(b);
        }
    }
    
    executePiusSuper(targetX, targetY, radius, dmgMult) {
        Game.areaEffects.push(new AreaEffect(targetX, targetY, radius, this, 'pius_super_flash'));

        Game.entities.forEach(e => {
            if (e.hp > 0 && e.team !== this.team && dist(targetX, targetY, e.x, e.y) < radius + e.r) {
                e.takeDamage(2800 * dmgMult, this);
                let spawnAng = Math.atan2(this.y - e.y, this.x - e.x) + (Math.random()-0.5)*0.5;
                let spawnDist = 75;
                let ax = this.x + Math.cos(spawnAng) * spawnDist;
                let ay = this.y + Math.sin(spawnAng) * spawnDist;
                Game.areaEffects.push(new PiusAmmo(ax, ay, this));
                
                let angToEne = Math.atan2(e.y - this.y, e.x - this.x);
                let b = new Bullet(this, angToEne, 18, 550, 1900 * dmgMult, 14, 'super');
                b.pierce = true; b.isPiusAutoBullet = true;
                if (this.sp === 'auto_aim') b.homing = true;
                Game.bullets.push(b);
            }
        });
        
        for(let i=0; i<15; i++) Game.particles.push(new Particle(targetX, targetY, '#1abc9c', Math.random()*8+4, (Math.random()-0.5)*12, (Math.random()-0.5)*12, 20));
        Game.uiEffects.push(new FloatingText(targetX, targetY, "STRIKE!", '#1abc9c', 22));
    }

    executeAttack(angle, type) {
        let dmgMult = this.hcActive ? 1.25 : 1;
        if(this.cubes > 0) dmgMult *= (1 + this.cubes*0.1); 
        if(this.candyBuffTimer > 0 && this.candyBuffType === 'dmg_up') dmgMult *= 1.35;

        if (this.type === 'kit' && type !== 'gadget' && this.invisibleTimer > 0) this.invisibleTimer = 0;
        
        if(this.type === 'shelly') {
            let rangeMult = 1;
            if(type === 'normal') {
                if(this.sp === 'hyper' && this.ammo === this.maxAmmo -1) rangeMult = 1.3;
                for(let i=0; i<5; i++) {
                    let a = angle + (i - 2) * 0.12;
                    Game.bullets.push(new Bullet(this, a, 13, this.data.range*rangeMult, 450*dmgMult, 8, 'normal')); 
                }
            } else if (type === 'super') {
                for(let i=0; i<9; i++) {
                    let a = angle + (i - 4) * 0.15;
                    let b = new Bullet(this, a, 15, this.data.range*1.3, 480*dmgMult, 12, 'super'); 
                    b.knockback = 15; b.wallBreak = true; Game.bullets.push(b);
                }
            } else if (type === 'gadget') {
                if(this.gadget === 'dash') {
                    this.dashTimer = 15; this.dashVx = Math.cos(angle)*13; this.dashVy = Math.sin(angle)*13; 
                } else if(this.gadget === 'sharp') {
                    let b = new Bullet(this, angle, 17, this.data.range*1.5, 600*dmgMult, 7, 'gadget'); 
                    b.effects.push({type:'slow', time:150}); Game.bullets.push(b);
                }
            }
        }
        else if (this.type === 'colt') {
            if(type === 'normal') {
                let count = this.sp === 'million' ? 8 : 6;
                let sizeMult = this.sp === 'big' ? 1.5 : 1;
                for(let i=0; i<count; i++) {
                    this.fireQueue.push({ delay: i*4, angle: angle+(Math.random()-0.5)*0.06, speed: 15, range: this.data.range, dmg: 480*dmgMult, size: 7*sizeMult, type:'normal', hcColt: this.hcActive }); 
                }
            } else if (type === 'super') {
                for(let i=0; i<12; i++) {
                    this.fireQueue.push({ delay: i*3, angle: angle+(Math.random()-0.5)*0.08, speed: 17, range: this.data.range*1.2, dmg: 400*dmgMult, size: 14, type:'super', pierce: true, wallBreak: true }); 
                }
            } else if (type === 'gadget') {
                if(this.gadget === 'one') {
                    Game.bullets.push(new Bullet(this, angle, 20, this.data.range*1.5, 1200 * dmgMult, 25, 'gadget')); 
                } else if (this.gadget === 'slow') {
                    let b = new Bullet(this, angle, 20, this.data.range, 600, 25, 'gadget'); 
                    b.textDmg = false; b.pierce = true; b.effects.push({type:'slow', time:180}); Game.bullets.push(b);
                }
            }
        }
        else if (this.type === 'primo') {
            if(type === 'normal') {
                let rMult = this.hcActive ? 1.5 : 1; let sMult = this.hcActive ? 1.5 : 1;
                for(let i=0; i<4; i++) {
                    this.fireQueue.push({ delay: i*4, angle: angle, speed: 12, range: this.data.range*rMult, dmg: 550*dmgMult, size: 20*sMult, type:'normal', spSpeed: this.sp==='speed' }); 
                }
            } else if (type === 'super') {
                let maxJumpDist = 350; let jumpDist = maxJumpDist;
                if (this.isPlayer) {
                    if (this.autoAimTargetDist !== null && this.autoAimTargetDist !== undefined) {
                        jumpDist = Math.min(this.autoAimTargetDist, maxJumpDist);
                        this.autoAimTargetDist = null;
                    } else {
                        let btn = Input.btns.super;
                        jumpDist = btn.mag * maxJumpDist;
                    }
                } else {
                    let target = Game.findClosestEnemy(this, maxJumpDist * 1.5);
                    if (target) jumpDist = Math.min(dist(this.x, this.y, target.x, target.y), maxJumpDist);
                }
                let landingSpot = getSafeLandingSpot(this.x, this.y, angle, jumpDist, this.r);
                this.targetX = landingSpot.x; this.targetY = landingSpot.y;
                this.dashTimer = 40; this.invincible = true; this.z = 1;
            } else if (type === 'gadget') {
                if(this.gadget === 'lariat') {
                    this.dashTimer = 15; this.dashVx = Math.cos(angle)*15; this.dashVy = Math.sin(angle)*15; this.lariatDmg = 650 * dmgMult; 
                } else if (this.gadget === 'catch') {
                    let b = new Bullet(this, angle, 16, 300, 150, 20, 'gadget'); 
                    b.pull = true; Game.bullets.push(b);
                }
            }
        }
        else if (this.type === 'gus') {
            if (type === 'normal') {
                let b = new Bullet(this, angle, 16, this.data.range, 2500 * dmgMult, 18, 'normal');
                b.isGusAttack = true;
                let maxGauge = this.sp === 'master' ? 1 : 2;
                if (this.hcActive) this.ghostGauge = maxGauge;
                if (this.ghostGauge >= maxGauge) { b.spawnGhost = true; this.ghostGauge = 0; }
                Game.bullets.push(b);
            } else if (type === 'super') {
                this.shield = 6000;
                Game.entities.forEach(e => {
                    if (e !== this && e.hp > 0 && e.team !== this.team && dist(this.x, this.y, e.x, e.y) < 150) {
                        let ang = Math.atan2(e.y - this.y, e.x - this.x);
                        e.pushVx = Math.cos(ang) * 12; e.pushVy = Math.sin(ang) * 12; e.pushTimer = 10;
                        for(let i=0; i<8; i++) Game.particles.push(new Particle(e.x, e.y, '#f1c40f', 4, (Math.random()-0.5)*8, (Math.random()-0.5)*8, 12));
                    }
                });
                Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "SHIELD!", '#f1c40f', 22));
            } else if (type === 'gadget') {
                if (this.gadget === 'cracker') {
                    Game.ghosts.forEach(g => {
                        if (g.owner === this) {
                            g.remove = true;
                            Game.entities.forEach(e => {
                                if (e.team !== this.team && e.hp > 0 && dist(g.x, g.y, e.x, e.y) < e.r + 110) e.takeDamage(2500 * dmgMult, this);
                            });
                            for(let i=0; i<15; i++) Game.particles.push(new Particle(g.x, g.y, '#f1c40f', 5, (Math.random()-0.5)*10, (Math.random()-0.5)*10, 20));
                        }
                    });
                } else if (this.gadget === 'summoner') {
                    this.ghostGauge = this.sp === 'master' ? 1 : 2;
                    Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "GAUGE MAX!", '#2ecc71', 18));
                }
            }
        }
        else if (this.type === 'mortis') {
            if (type === 'normal') {
                let rangeMult = 1 + this.longDashGauge * 2; 
                this.longDashGauge = 0;
                let dashDist = 150 * rangeMult;
                this.dashTimer = dashDist / 15;
                this.dashVx = Math.cos(angle) * 15;
                this.dashVy = Math.sin(angle) * 15;
                this.mortisNormalDmg = 2000 * dmgMult;
                this.mortisHitTargets = new Set();
                this.isMortisHCInvincible = this.hcActive;
            } else if (type === 'super') {
                let b = new Bullet(this, angle, 16, 500, 1800 * dmgMult, 30, 'super');
                b.pierce = true; b.isMortisSuper = true; Game.bullets.push(b);
            } else if (type === 'gadget') {
                if (this.gadget === 'spinner') {
                    Game.entities.forEach(e => {
                        if (e !== this && e.team !== this.team && e.hp > 0 && dist(this.x, this.y, e.x, e.y) < this.r * 4 + e.r) e.takeDamage(3000 * dmgMult, this);
                    });
                    for (let i = 0; i < Math.PI * 2; i += Math.PI / 4) {
                        Game.particles.push(new Particle(this.x + Math.cos(i)*this.r*2, this.y + Math.sin(i)*this.r*2, '#2c3e50', 8, 0, 0, 15));
                    }
                } else if (this.gadget === 'batmove') {
                    // 移動距離を通常攻撃と同じ長さに（距離150、移動時間120フレーム）
                    this.dashTimer = 120;
                    let speed = 150 / 120;
                    this.dashVx = Math.cos(angle) * speed;
                    this.dashVy = Math.sin(angle) * speed;
                    this.invincible = true; this.isBatMove = true;
                }
            }
        }
        else if (this.type === 'kit') {
            if (type === 'normal') {
                Game.entities.forEach(e => {
                    if (e !== this && e.team !== this.team && e.hp > 0 && e.z === 0) {
                        let d = dist(this.x, this.y, e.x, e.y);
                        if (d < this.data.range + e.r) {
                            let angToEne = Math.atan2(e.y - this.y, e.x - this.x);
                            let diff = Math.abs(angToEne - angle);
                            if (diff > Math.PI) diff = Math.PI * 2 - diff;
                            if (diff <= this.data.attackWidth) {
                                e.takeDamage(1200 * dmgMult, this); 
                                this.chargeSuper(34);
                                for(let k=0; k<6; k++) Game.particles.push(new Particle(e.x, e.y, '#f39c12', 4, (Math.random()-0.5)*8, (Math.random()-0.5)*8, 15));
                            }
                        }
                    }
                });
            } else if (type === 'super') {
                let maxJumpDist = 350; let jumpDist = maxJumpDist;
                if (this.isPlayer) {
                    if (this.autoAimTargetDist !== null && this.autoAimTargetDist !== undefined) {
                        jumpDist = Math.min(this.autoAimTargetDist, maxJumpDist);
                        this.autoAimTargetDist = null;
                    } else {
                        let btn = Input.btns.super;
                        jumpDist = btn.mag * maxJumpDist;
                    }
                } else {
                    let target = Game.findClosestEnemy(this, maxJumpDist * 1.5);
                    if (target) jumpDist = Math.min(dist(this.x, this.y, target.x, target.y), maxJumpDist);
                }
                let landingSpot = getSafeLandingSpot(this.x, this.y, angle, jumpDist, this.r);
                this.targetX = landingSpot.x; this.targetY = landingSpot.y;
                this.dashTimer = 25; this.invincible = true; this.z = 1;
            } else if (type === 'gadget') {
                if (this.gadget === 'cardboard') {
                    this.invisibleTimer = 180;
                    Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "INVISIBLE", '#fff', 20));
                } else if (this.gadget === 'fastfood') {
                    this.hp = Math.min(this.maxHp, this.hp + 3000);
                    Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "+3000", '#2ecc71', 20));
                }
            }
        }
        else if (this.type === 'chester') {
            if (type === 'normal') {
                let activeGauge = this.hcActive ? 3 : this.chesterGauge;
                let numBullets = activeGauge + 1;
                let baseDmg = 1000, baseSize = 8, baseSpeed = 15;
                if (activeGauge === 0 && this.sp === 'firststrike') { baseDmg = 1500; baseSize = 14; baseSpeed = 20; }

                let spread = 0.08;
                for (let i = 0; i < numBullets; i++) {
                    let a = angle;
                    if (numBullets > 1) a = angle + (i - (numBullets - 1) / 2) * spread;
                    Game.bullets.push(new Bullet(this, a, baseSpeed, this.data.range, baseDmg * dmgMult, baseSize, 'normal'));
                }
                if (!this.hcActive) this.chesterGauge = (this.chesterGauge + 1) % 4;
            } else if (type === 'super') {
                let currentSuper = this.chesterSuperType;
                if (currentSuper === 'explode') {
                    let maxJumpDist = 380; let jumpDist = maxJumpDist;
                    if (this.isPlayer) {
                        if (this.autoAimTargetDist !== null && this.autoAimTargetDist !== undefined) {
                            jumpDist = Math.min(this.autoAimTargetDist, maxJumpDist);
                            this.autoAimTargetDist = null;
                        } else {
                            let btn = Input.btns.super;
                            jumpDist = btn.mag * maxJumpDist;
                        }
                    } else {
                        let target = Game.findClosestEnemy(this, maxJumpDist * 1.5);
                        if (target) jumpDist = Math.min(dist(this.x, this.y, target.x, target.y), maxJumpDist);
                    }
                    let bombX = this.x + Math.cos(angle) * jumpDist;
                    let bombY = this.y + Math.sin(angle) * jumpDist;
                    
                    Game.entities.forEach(e => {
                        if (e.hp > 0 && e.team !== this.team && dist(bombX, bombY, e.x, e.y) < 140) e.takeDamage(2200 * dmgMult, this);
                    });
                    for(let i=Game.map.length-1; i>=0; i--) {
                        let w = Game.map[i];
                        if (circleRectCollide(bombX, bombY, 120, w.x, w.y, w.w, w.h)) Game.map.splice(i, 1);
                    }
                    for(let i=0; i<15; i++) Game.particles.push(new Particle(bombX, bombY, '#d35400', Math.random()*8+4, (Math.random()-0.5)*12, (Math.random()-0.5)*12, 20));
                    Game.uiEffects.push(new FloatingText(bombX, bombY, "BOOM!", '#d35400', 22));
                } else if (currentSuper === 'stun') {
                    let b = new Bullet(this, angle, 18, 500, 1600 * dmgMult, 18, 'super');
                    b.effects.push({ type: 'stun', time: 60 }); Game.bullets.push(b);
                } else if (currentSuper === 'heal') {
                    let healAmt = 3000 * (this.cubes > 0 ? (1 + this.cubes*0.1) : 1);
                    this.hp = Math.min(this.maxHp, this.hp + healAmt);
                    Game.uiEffects.push(new FloatingText(this.x, this.y - 50, `+${Math.floor(healAmt)}`, '#2ecc71', 24));
                } else if (currentSuper === 'poison') {
                    for (let i = -1; i <= 1; i++) {
                        let b = new Bullet(this, angle + i * 0.2, 12, 350, 400 * dmgMult, 16, 'super');
                        b.pierce = true; b.effects.push({ type: 'poison', time: 90 }); Game.bullets.push(b);
                    }
                } else if (currentSuper === 'ice') {
                    Game.areaEffects.push(new AreaEffect(this.x, this.y, 130, this, 'ice_zone'));
                    Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "ICE ZONE!", '#74b9ff', 22));
                }
                this.chesterSuperType = this.chesterSuperTypes[Math.floor(Math.random() * this.chesterSuperTypes.length)];
            } else if (type === 'gadget') {
                if (this.gadget === 'candy') {
                    let r = Math.random();
                    if (r < 0.33) { this.candyBuffType = 'speed'; Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "SPEED UP!", '#f1c40f', 20)); }
                    else if (r < 0.66) { this.candyBuffType = 'dmg_up'; Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "POWER UP!", '#ff4757', 20)); }
                    else { this.candyBuffType = 'heal_regen'; Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "REGEN!", '#2ecc71', 20)); }
                    this.candyBuffTimer = 180;
                } else if (this.gadget === 'redraw') {
                    this.chesterSuperType = this.chesterSuperTypes[Math.floor(Math.random() * this.chesterSuperTypes.length)];
                    Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "REDRAW!", '#9b59b6', 20));
                }
            }
        }
        else if (this.type === 'pius') {
            if (type === 'normal') {
                let isLast = (this.ammo === 0);
                let b = new Bullet(this, angle, 20, this.data.range, 1900 * dmgMult, 14, 'normal');
                b.isPiusNormal = true; b.isLastAmmo = isLast; Game.bullets.push(b);
            } else if (type === 'super') {
                let maxJumpDist = 380; let jumpDist = maxJumpDist;
                if (this.isPlayer) {
                    if (this.autoAimTargetDist !== null && this.autoAimTargetDist !== undefined) {
                        jumpDist = Math.min(this.autoAimTargetDist, maxJumpDist);
                        this.autoAimTargetDist = null;
                    } else {
                        let btn = Input.btns.super;
                        jumpDist = btn.mag * maxJumpDist;
                    }
                } else {
                    let target = Game.findClosestEnemy(this, maxJumpDist * 1.5);
                    if (target) jumpDist = Math.min(dist(this.x, this.y, target.x, target.y), maxJumpDist);
                }
                let targetX = this.x + Math.cos(angle) * jumpDist;
                let targetY = this.y + Math.sin(angle) * jumpDist;
                let superRadius = this.hcActive ? 200 : 150;
                
                this.executePiusSuper(targetX, targetY, superRadius, dmgMult);
                if (this.hcActive) {
                    this.piusHCDelayTimer = 30; this.piusHCTargetX = targetX; this.piusHCTargetY = targetY; this.piusHCDmgMult = dmgMult;
                }
            } else if (type === 'gadget') {
                if (this.gadget === 'shield_absorb') {
                    let count = 0;
                    Game.areaEffects.forEach(ae => {
                        if (ae instanceof PiusAmmo && ae.owner === this) { ae.remove = true; this.collectPiusAmmo(ae, false); count++; }
                    });
                    if (count > 0) {
                        this.shield += count * 1200;
                        Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "+SHIELD", '#f1c40f', 20));
                    }
                } else if (this.gadget === 'remote_shoot') {
                    Game.areaEffects.forEach(ae => {
                        if (ae instanceof PiusAmmo && ae.owner === this) { ae.remove = true; this.collectPiusAmmo(ae, true); }
                    });
                    Game.uiEffects.push(new FloatingText(this.x, this.y - 50, "REMOTE SHOOT", '#e74c3c', 20));
                }
            }
        }
    }

    update() {
        if(this.hp <= 0 && this.z === 0) return;

        if (this.attackIntervalTimer > 0) this.attackIntervalTimer = Math.max(0, this.attackIntervalTimer - Game.timeScale);

        if (this.candyBuffTimer > 0) {
            this.candyBuffTimer -= Game.timeScale;
            if (this.candyBuffType === 'heal_regen') {
                let prevSec = Math.floor((this.candyBuffTimer + Game.timeScale) / 60);
                let currSec = Math.floor(this.candyBuffTimer / 60);
                if (currSec < prevSec) {
                    this.hp = Math.min(this.maxHp, this.hp + 500);
                    Game.uiEffects.push(new FloatingText(this.x, this.y - 45, "+500", '#2ecc71', 16));
                }
            }
            if (this.candyBuffTimer <= 0) this.candyBuffType = '';
        }

        this.effects.forEach(e => {
            if (e.type === 'poison') {
                let prevSec = Math.floor((e.time + Game.timeScale) / 30);
                let currSec = Math.floor(e.time / 30);
                if (currSec < prevSec) this.takeDamage(400, null);
            }
        });

        if (this.type === 'kit') {
            if (this.kitStunCooldown > 0) this.kitStunCooldown -= Game.timeScale;
            
            if (this.superCharge < this.maxSuperCharge) {
                // 自動チャージ速度を1/3に変更
                let fillRate = (this.sp === 'fastcharge' ? 0.25 : 0.167) / 3;
                this.chargeSuper(fillRate * Game.timeScale);
            }

            if (this.ridingTarget) {
                if (this.ridingTarget.hp <= 0 || this.ridingTarget.remove) {
                    this.ridingTarget = null; this.effects = this.effects.filter(eff => eff.type !== 'stun'); this.z = 0;
                } else {
                    this.ridingTimer -= Game.timeScale;
                    this.x = this.ridingTarget.x; this.y = this.ridingTarget.y; this.z = 32;
                    if (!this.ridingTarget.effects.some(eff => eff.type === 'stun')) this.ridingTarget.effects.push({ type: 'stun', time: 10 });

                    let prevTick = Math.floor((this.ridingTimer + Game.timeScale) / 15);
                    let currTick = Math.floor(this.ridingTimer / 15);
                    if (currTick < prevTick) {
                        let dmgMult = this.hcActive ? 1.25 : 1;
                        if (this.cubes > 0) dmgMult *= (1 + this.cubes * 0.1);
                        this.ridingTarget.takeDamage(350 * dmgMult, this);
                    }

                    if (this.ridingTimer <= 0) {
                        let enemy = this.ridingTarget;
                        this.ridingTarget = null; this.effects = this.effects.filter(eff => eff.type !== 'stun'); this.z = 0;
                        this.kitStunCooldown = 120;

                        enemy.effects = enemy.effects.filter(eff => eff.type !== 'stun');
                        // キットの通常必殺技ではキットが気絶する時間と乗られたキャラクターが気絶する時間を同じに設定（両方30）
                        enemy.effects.push({ type: 'stun', time: 30 });
                        this.effects.push({ type: 'stun', time: 30 });

                        this.x += (Math.random() - 0.5) * 50; this.y += (Math.random() - 0.5) * 50;
                    }
                }
            }
        }

        if (this.invisibleTimer > 0) this.invisibleTimer -= Game.timeScale;

        this.lastDamagedTimer += Game.timeScale;
        if(this.lastDamagedTimer > 240 && this.hp < this.maxHp) { 
            let prevSeconds = Math.floor((this.lastDamagedTimer - Game.timeScale) / 60);
            let currSeconds = Math.floor(this.lastDamagedTimer / 60);
            if(currSeconds > prevSeconds) {
                let healAmt = Math.floor(this.maxHp * 0.1);
                this.hp = Math.min(this.maxHp, this.hp + healAmt);
                Game.uiEffects.push(new FloatingText(this.x, this.y - 45, `+${healAmt}`, '#2ecc71', 16));
            }
        }

        if (this.shield > 0) {
            this.shield -= (600 / 60) * Game.timeScale;
            if (this.shield < 0) this.shield = 0;
        }

        if (this.type === 'mortis') {
            if (this.ammo >= this.maxAmmo) {
                let chargeTime = this.sp === 'longdash' ? 90 : 180;
                this.longDashGauge = Math.min(1, this.longDashGauge + Game.timeScale / chargeTime);
            } else {
                this.longDashGauge = 0;
            }
        }

        if (this.type === 'pius' && this.piusHCDelayTimer > 0) {
            this.piusHCDelayTimer -= Game.timeScale;
            if (this.piusHCDelayTimer <= 0) {
                this.executePiusSuper(this.piusHCTargetX, this.piusHCTargetY, 200, this.piusHCDmgMult);
            }
        }

        for(let i=this.effects.length-1; i>=0; i--) {
            this.effects[i].time -= Game.timeScale;
            if(this.effects[i].time <= 0) this.effects.splice(i, 1);
        }
        if(this.gadgetCooldown > 0) this.gadgetCooldown = Math.max(0, this.gadgetCooldown - Game.timeScale);
        if(this.hcTimer > 0) { 
            this.hcTimer = Math.max(0, this.hcTimer - Game.timeScale); 
            if(this.hcTimer <= 0) this.hcActive = false; 
        }

        let stunActive = this.effects.some(e => e.type === 'stun');
        let shouldReload = !(stunActive && !this.ridingTarget);

        if (this.type === 'pius') {
            if (shouldReload) {
                if (this.ammo === 0 && !this.piusReloading) { this.piusReloading = true; this.reloadTimer = 0; }
                if (this.piusReloading) {
                    let curReload = this.reloadTime;
                    if (this.sp === 'no_gap') curReload /= 1.2;
                    this.reloadTimer += Game.timeScale;
                    if (this.reloadTimer >= curReload * this.maxAmmo) {
                        this.ammo = this.maxAmmo; this.reloadTimer = 0; this.piusReloading = false;
                    }
                } else { this.reloadTimer = 0; }
            }
        } else {
            let curReload = this.reloadTime;
            if(this.type === 'shelly' && this.hcActive) curReload /= 3;
            // モーティスはハイパーチャージ中リロード速度が3倍に
            if(this.type === 'mortis' && this.hcActive) curReload /= 3;
            
            if(shouldReload && this.ammo < this.maxAmmo) {
                this.reloadTimer += Game.timeScale;
                if(this.reloadTimer >= curReload) { this.ammo++; this.reloadTimer = 0; }
            } else { this.reloadTimer = 0; }
        }

        for(let i=this.fireQueue.length-1; i>=0; i--) {
            let f = this.fireQueue[i];
            f.delay -= Game.timeScale;
            if(f.delay <= 0) {
                let b = new Bullet(this, f.angle, f.speed, f.range, f.dmg, f.size, f.type);
                if(f.pierce) b.pierce = true; if(f.wallBreak) b.wallBreak = true;
                if(f.spSpeed) b.onHit = () => { this.effects.push({type:'speed', time:180}); };
                if(f.hcColt) b.hcColt = true;
                Game.bullets.push(b); this.fireQueue.splice(i, 1);
            }
        }

        let dx=0, dy=0;
        let pushDx = 0, pushDy = 0;
        if (this.pushTimer > 0) {
            pushDx = this.pushVx * Game.timeScale; pushDy = this.pushVy * Game.timeScale;
            this.pushTimer = Math.max(0, this.pushTimer - Game.timeScale);
            this.pushVx *= Math.pow(0.85, Game.timeScale); this.pushVy *= Math.pow(0.85, Game.timeScale);
        }

        if(this.dashTimer > 0) {
            this.dashTimer = Math.max(0, this.dashTimer - Game.timeScale);
            if(this.z > 0) { 
                this.x += ((this.targetX - this.x) / (this.dashTimer+1)) * Game.timeScale;
                this.y += ((this.targetY - this.y) / (this.dashTimer+1)) * Game.timeScale;
                let totalJumpF = this.type === 'kit' ? 25 : 40;
                this.z = Math.sin((1 - this.dashTimer/totalJumpF) * Math.PI) * 120; 
                
                if(this.dashTimer <= 0) {
                    this.z = 0; this.invincible = false;
                    if (this.type === 'kit') {
                        if (this.hcActive) {
                            Game.entities.forEach(e => {
                                if (e !== this && e.hp > 0 && e.team !== this.team && dist(this.x, this.y, e.x, e.y) < 140) {
                                    e.takeDamage(1200 * 1.25, this); e.effects.push({ type: 'stun', time: 60 });
                                }
                            });
                        } else {
                            let target = Game.findClosestEnemy(this, 120);
                            if (target && this.kitStunCooldown <= 0) {
                                target.takeDamage(1200, this);
                                this.ridingTarget = target; this.ridingTimer = 90;
                                this.effects.push({ type: 'stun', time: 90 });
                                target.effects.push({ type: 'stun', time: 90 });
                                Game.uiEffects.push(new FloatingText(target.x, target.y - 60, "CLING!", '#f1c40f', 22));
                            }
                        }
                    } else {
                        let r = this.sp === 'shock' ? 140 : 100;
                        Game.entities.forEach(e => {
                            if(e !== this && e.hp > 0 && e.team !== this.team && dist(this.x, this.y, e.x, e.y) < r) {
                                e.takeDamage(1000 * (this.hcActive?1.25:1), this); 
                            }
                        });
                    }
                }
            } else { 
                dx = this.dashVx * Game.timeScale; dy = this.dashVy * Game.timeScale;
                if(this.gadget === 'lariat' && this.lariatDmg) {
                    Game.entities.forEach(e => {
                        if(e !== this && e.hp > 0 && e.team !== this.team && dist(this.x, this.y, e.x, e.y) < this.r + e.r) {
                            e.takeDamage(this.lariatDmg, this); this.lariatDmg = 0;
                        }
                    });
                }
                
                if (this.type === 'mortis' && this.mortisNormalDmg) {
                    if (this.isMortisHCInvincible) this.invincible = true;
                    Game.entities.forEach(e => {
                        if (e !== this && e.team !== this.team && e.hp > 0 && !this.mortisHitTargets.has(e)) {
                            if (dist(this.x, this.y, e.x, e.y) < this.r + e.r + 30) {
                                e.takeDamage(this.mortisNormalDmg, this);
                                this.mortisHitTargets.add(e);
                                if (this.sp === 'vampire') {
                                    this.hp = Math.min(this.maxHp, this.hp + 500);
                                    Game.uiEffects.push(new FloatingText(this.x, this.y - 45, "+500", '#2ecc71', 16));
                                }
                                this.chargeSuper(this.mortisNormalDmg * 0.05);
                            }
                        }
                    });
                }
                if(this.dashTimer <= 0 && this.type === 'mortis') {
                    this.mortisNormalDmg = 0;
                    if (this.isMortisHCInvincible || this.isBatMove) this.invincible = false;
                    this.isBatMove = false;
                }
            }
        } else {
            if(this.isPlayer) {
                if(Input.leftJoy.active) {
                    let speed = this.getSpeed() * Input.leftJoy.mag;
                    dx = Input.leftJoy.nx * speed * Game.timeScale; dy = Input.leftJoy.ny * speed * Game.timeScale;
                    if(Input.leftJoy.mag > 0.1) this.facing = Math.atan2(dy, dx);
                }
            } else {
                this.updateBotAI();
                if(this.aiMoving) {
                    let speed = this.getSpeed();
                    dx = Math.cos(this.moveAng) * speed * Game.timeScale; dy = Math.sin(this.moveAng) * speed * Game.timeScale;
                    this.facing = this.moveAng;
                }
            }
        }

        if(this.z === 0) {
            let finalDx = dx + pushDx, finalDy = dy + pushDy;
            let newX = this.x + finalDx, newY = this.y + finalDy;
            let colX = false, colY = false;
            
            for(let w of Game.map) {
                if(circleRectCollide(newX, this.y, this.r, w.x, w.y, w.w, w.h)) colX = true;
                if(circleRectCollide(this.x, newY, this.r, w.x, w.y, w.w, w.h)) colY = true;
            }

            const margin = 25;
            if(newX - this.r < margin || newX + this.r > Game.mapW - margin) colX = true;
            if(newY - this.r < margin || newY + this.r > Game.mapH - margin) colY = true;

            if(!colX) this.x = newX; if(!colY) this.y = newY;
            this.x = Math.max(margin + this.r, Math.min(this.x, Game.mapW - margin - this.r));
            this.y = Math.max(margin + this.r, Math.min(this.y, Game.mapH - margin - this.r));
        }

        for(let i=Game.items.length-1; i>=0; i--) {
            let it = Game.items[i];
            if(dist(this.x, this.y, it.x, it.y) < this.r + it.r) {
                if(it.type === 'gem') { this.gems++; Game.items.splice(i, 1); }
                else if(it.type === 'cube') {
                    this.cubes++; this.maxHp += 400; this.hp += 400; Game.items.splice(i, 1);
                    Game.uiEffects.push(new FloatingText(this.x, this.y-30, "+Power", '#2ecc71', 18));
                }
            }
        }
    }

    updateBotAI() {
        this.aiTimer -= Game.timeScale;
        if(dist(this.x, this.y, this.lastX, this.lastY) < 0.2 && this.aiMoving) this.stuckTimer += Game.timeScale;
        else this.stuckTimer = 0;
        this.lastX = this.x; this.lastY = this.y;

        let closestEnemy = null, minDistEnemy = Infinity;
        Game.entities.forEach(e => {
            if (e !== this && e.hp > 0 && e.team !== this.team) {
                if (e.type === 'kit' && e.invisibleTimer > 0) return;
                let d = dist(this.x, this.y, e.x, e.y);
                if (d < minDistEnemy) { minDistEnemy = d; closestEnemy = e; }
            }
        });

        let closestItem = null, minDistItem = Infinity;
        if(Game.mode === 'gemgrab' || Game.mode === 'showdown') {
            Game.items.forEach(it => {
                let d = dist(this.x, this.y, it.x, it.y);
                if(d < minDistItem) { minDistItem = d; closestItem = it; }
            });
        }

        if (this.type === 'pius') {
            let closestPiusAmmo = null, minDistPiusAmmo = Infinity;
            Game.areaEffects.forEach(ae => {
                if (ae instanceof PiusAmmo && ae.owner === this && ae.pickupDelay <= 0) {
                    let d = dist(this.x, this.y, ae.x, ae.y);
                    if (d < minDistPiusAmmo) { minDistPiusAmmo = d; closestPiusAmmo = ae; }
                }
            });
            if (closestPiusAmmo && (minDistPiusAmmo < 350 || !closestEnemy)) { closestItem = closestPiusAmmo; minDistItem = minDistPiusAmmo; }
        }

        let distToEne = closestEnemy ? dist(this.x, this.y, closestEnemy.x, closestEnemy.y) : Infinity;
        let distToCenter = dist(this.x, this.y, Game.mapW / 2, Game.mapH / 2);
        let nearPoison = (Game.mode === 'showdown' && distToCenter > Game.poisonRadius - 220);

        if (nearPoison) this.aiState = 'escape_poison';
        else if (this.hp < this.maxHp * 0.45) this.aiState = 'heal';
        else this.aiState = 'fight'; 

        // ボット(CPU)の弾除けのうまさを少し下げる（判定マージンを35から20に減少）
        let dodgeDx = 0, dodgeDy = 0, incomingBulletCount = 0;
        Game.bullets.forEach(b => {
            if (b.owner && b.owner.team !== this.team) {
                let dToBullet = dist(this.x, this.y, b.x, b.y);
                if (dToBullet < 250) {
                    let bVelMag = Math.hypot(b.vx, b.vy);
                    if (bVelMag > 0) {
                        let bDirX = b.vx / bVelMag, bDirY = b.vy / bVelMag;
                        let dot = (this.x - b.x) * bDirX + (this.y - b.y) * bDirY;
                        if (dot > 0) {
                            let projX = b.x + bDirX * dot, projY = b.y + bDirY * dot;
                            if (dist(this.x, this.y, projX, projY) < (this.r + b.r + 20)) {
                                dodgeDx += -bDirY; dodgeDy += bDirX; incomingBulletCount++;
                            }
                        }
                    }
                }
            }
        });

        Game.areaEffects.forEach(ae => {
            if (ae.type === 'ice_zone' && ae.owner && ae.owner.team !== this.team) {
                if (dist(this.x, this.y, ae.x, ae.y) < ae.r + 60) {
                    let escapeAng = Math.atan2(this.y - ae.y, this.x - ae.x);
                    dodgeDx += Math.cos(escapeAng) * 2; dodgeDy += Math.sin(escapeAng) * 2; incomingBulletCount++;
                }
            }
        });

        let needToDodge = false, dodgeAng = 0;
        if (incomingBulletCount > 0) {
            let len = Math.hypot(dodgeDx, dodgeDy);
            if (len > 0) { dodgeAng = Math.atan2(dodgeDy, dodgeDx); needToDodge = true; }
        }

        let targetAng = 0, hasTarget = false;
        if(this.stuckTimer > 15) {
            this.moveAng = this.facing + Math.PI/2 + (Math.random()-0.5);
            this.aiMoving = true; this.aiTimer = 30; this.stuckTimer = 0; return;
        }

        if (needToDodge) { targetAng = dodgeAng; hasTarget = true; this.aiTimer = 5; } 
        else if (this.aiTimer <= 0) {
            this.aiTimer = 10; 
            if (this.aiState === 'escape_poison') {
                targetAng = Math.atan2(Game.mapH/2 - this.y, Game.mapW/2 - this.x); hasTarget = true;
            } else {
                let centerStar = Game.areaEffects.find(ae => ae instanceof BountyCenterStar);
                if (Game.mode === 'bounty' && centerStar && dist(this.x, this.y, centerStar.x, centerStar.y) < 400) {
                    targetAng = Math.atan2(centerStar.y - this.y, centerStar.x - this.x); hasTarget = true;
                } else if(closestItem && (minDistItem < 300 || !closestEnemy)) {
                    targetAng = Math.atan2(closestItem.y - this.y, closestItem.x - this.x); hasTarget = true;
                } else if (closestEnemy) {
                    let idealDist = 330;
                    if (this.type === 'primo' || this.type === 'mortis' || this.type === 'kit') idealDist = 60;
                    else if (this.type === 'shelly') idealDist = 180;
                    let angToEne = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
                    if(distToEne > idealDist + 40) targetAng = angToEne; 
                    else if(distToEne < idealDist - 40 && this.type !== 'primo' && this.type !== 'mortis' && this.type !== 'kit') targetAng = angToEne + Math.PI; 
                    else targetAng = angToEne + (Math.random() > 0.5 ? Math.PI/2 : -Math.PI/2); 
                    hasTarget = true;
                }
            }
            if (hasTarget) {
                this.moveAng = targetAng; this.aiMoving = true;
            } else {
                this.moveAng = Math.atan2(Game.mapH/2 - this.y, Game.mapW/2 - this.x); this.aiMoving = true;
            }
        }
        if (needToDodge) { this.moveAng = dodgeAng; this.aiMoving = true; }

        let detectionRange = this.data.range * (this.type === 'gus' ? 1.25 : 1.15);
        if(closestEnemy && distToEne <= detectionRange) {
            let angToEne = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
            let wallInWay = false;
            for(let w of Game.map) {
                if(lineRectCollide(this.x, this.y, closestEnemy.x, closestEnemy.y, w.x, w.y, w.w, w.h)) { wallInWay = true; break; }
            }
            if(!wallInWay || this.type === 'primo' || this.type === 'mortis' || this.type === 'kit' || this.superCharge >= this.maxSuperCharge || (this.type === 'gus' && Math.random() < 0.35)) {
                if(this.ammo >= 1) {
                    this.facing = angToEne;
                    if(this.hcCharge >= this.maxHcCharge && distToEne < this.data.range * 0.9) this.activateHC();
                    else if(this.superCharge >= this.maxSuperCharge) {
                        this.requestAttack(angToEne, 'super');
                    } else if(Math.random() < (this.type === 'gus' ? 0.95 : 0.7)) {
                        this.requestAttack(angToEne, 'normal');
                    }
                }
            }
        }
    }

    draw(ctx) {
        if(this.hp <= 0 && this.z === 0) return;
        ctx.save(); ctx.translate(this.x, this.y - this.z);
        
        if (this.type === 'kit' && this.invisibleTimer > 0) {
            if (this.isPlayer) ctx.globalAlpha = 0.4; else ctx.globalAlpha = 0;
        }

        if(this.z === 0) {
            ctx.beginPath(); ctx.ellipse(0, 20, 25, 10, 0, 0, Math.PI*2);
            ctx.fillStyle = this.isPlayer ? 'rgba(46, 204, 113, 0.4)' : (Game.mode !== 'showdown' && this.team === 1 ? 'rgba(52, 152, 219, 0.4)' : 'rgba(231, 76, 60, 0.4)');
            ctx.fill();
        }

        if (this.invincible) {
            ctx.save(); ctx.beginPath(); ctx.arc(0, 0, this.r + 10, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)'; ctx.lineWidth = 3.5; ctx.stroke();
            ctx.restore();
        }

        if(this.hcActive) {
            ctx.beginPath(); ctx.arc(0, 0, this.r+10, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(155, 89, 182, 0.4)'; ctx.fill();
        }

        ctx.save();
        ctx.rotate(this.facing);
        ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI*2);
        ctx.fillStyle = this.data.color; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#1e272e'; ctx.stroke();
        
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(8, -6, 5, 0, Math.PI*2); ctx.arc(8, 6, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(10, -6, 2, 0, Math.PI*2); ctx.arc(10, 6, 2, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        ctx.globalAlpha = 1.0;
        let barW = 70; // 体力バー・リロード表示を大きくわかりやすく拡大
        
        ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Nunito'; ctx.textAlign = 'center';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.strokeText(this.name, 0, -40); ctx.fillText(this.name, 0, -40);
        
        // 体力バー背景
        ctx.fillStyle = '#1e272e'; ctx.fillRect(-barW/2, -32, barW, 10);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(-barW/2, -32, barW, 10);
        // 体力バー本体
        ctx.fillStyle = (this.isPlayer || (Game.mode !== 'showdown' && this.team === 1)) ? '#2ecc71' : '#e74c3c';
        ctx.fillRect(-barW/2, -32, barW * Math.max(0, Math.min(1, this.hp/this.maxHp)), 10);

        // 体力バーにHPの数値を表示
        ctx.fillStyle = '#fff'; ctx.font = '900 10px Nunito'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
        ctx.strokeText(`${Math.ceil(this.hp)} / ${this.maxHp}`, 0, -27);
        ctx.fillText(`${Math.ceil(this.hp)} / ${this.maxHp}`, 0, -27);
        
        // リロードバー（枠を追加してわかりやすく）
        let aRatio = this.ammo / this.maxAmmo;
        if(this.ammo < this.maxAmmo) aRatio += (this.reloadTimer / (this.type==='shelly'&&this.hcActive ? this.reloadTime/3 : this.reloadTime)) * (1/this.maxAmmo);
        ctx.fillStyle = '#1e272e'; ctx.fillRect(-barW/2, -20, barW, 6);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(-barW/2, -20, barW, 6);
        
        if (this.type !== 'pius') {
            ctx.fillStyle = '#f39c12'; ctx.fillRect(-barW/2, -20, barW * Math.max(0, Math.min(1, aRatio)), 6);
        } else {
            if (this.piusReloading) {
                let maxTimer = this.reloadTime * this.maxAmmo;
                if (this.sp === 'no_gap') maxTimer /= 1.2;
                let r = this.reloadTimer / maxTimer;
                ctx.fillStyle = '#e67e22'; ctx.fillRect(-barW/2, -20, barW * Math.max(0, Math.min(1, r)), 6);
            } else {
                ctx.fillStyle = '#f39c12'; ctx.fillRect(-barW/2, -20, barW * (this.ammo / this.maxAmmo), 6);
            }
        }

        if (Game.mode === 'bounty') {
            let stars = this.bountyStars || 2;
            let starSize = 10;
            let startX = -((stars - 1) * (starSize + 2)) / 2;
            ctx.fillStyle = '#f1c40f'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
            for (let i = 0; i < stars; i++) {
                let sx = startX + i * (starSize + 2), sy = -50;
                ctx.beginPath();
                for (let k = 0; k < 5; k++) {
                    ctx.lineTo(sx + Math.cos((18 + k * 72) * Math.PI / 180) * (starSize/2), sy + Math.sin((18 + k * 72) * Math.PI / 180) * (starSize/2));
                    ctx.lineTo(sx + Math.cos((54 + k * 72) * Math.PI / 180) * (starSize/4), sy + Math.sin((54 + k * 72) * Math.PI / 180) * (starSize/4));
                }
                ctx.closePath(); ctx.fill(); ctx.stroke();
            }
        }

        if (this.type === 'gus') {
            let maxGauge = this.sp === 'master' ? 1 : 2;
            ctx.fillStyle = '#1e272e'; ctx.fillRect(-barW/2, -13, barW, 4);
            ctx.fillStyle = '#bdc3c7'; ctx.fillRect(-barW/2, -13, barW * (this.ghostGauge / maxGauge), 4);
            if (this.shield > 0) {
                ctx.fillStyle = '#1e272e'; ctx.fillRect(-barW/2, -37, barW, 4);
                ctx.fillStyle = '#f1c40f'; ctx.fillRect(-barW/2, -37, barW * (this.shield / 6000), 4);
            }
        } else if (this.type === 'mortis') {
            ctx.fillStyle = '#1e272e'; ctx.fillRect(-barW/2, -13, barW, 4);
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(-barW/2, -13, barW * this.longDashGauge, 4);
        } else if (this.type === 'chester') {
            let maxG = this.chesterGauge;
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-22, -58, 44, 12);
            ctx.strokeStyle = '#fff'; ctx.strokeRect(-22, -58, 44, 12);
            ctx.fillStyle = '#e67e22'; ctx.font = '900 10px Nunito';
            ctx.strokeText(`弾数: ${maxG+1}`, 0, -52); ctx.fillText(`弾数: ${maxG+1}`, 0, -52);
        } else if (this.type === 'kit' && this.invisibleTimer > 0) {
            ctx.fillStyle = '#9b59b6'; ctx.font = '900 12px Nunito';
            ctx.strokeText(`透明中`, 0, -55); ctx.fillText(`透明中`, 0, -55);
        } else if (this.type === 'pius' && this.shield > 0) {
            ctx.fillStyle = '#1e272e'; ctx.fillRect(-barW/2, -37, barW, 4);
            ctx.fillStyle = '#f1c40f'; ctx.fillRect(-barW/2, -37, barW * Math.min(1, this.shield / 6000), 4);
        }

        if(this.gems > 0 || this.cubes > 0) {
            ctx.fillStyle = this.gems > 0 ? '#9b59b6' : '#2ecc71';
            ctx.font = '900 16px Nunito';
            let txt = this.gems > 0 ? `💎${this.gems}` : `🟩${this.cubes}`;
            ctx.strokeText(txt, 0, -52); ctx.fillText(txt, 0, -52);
        }
        ctx.restore();
    }
}

class Bullet extends Entity {
    constructor(owner, angle, speed, range, dmg, size, type) {
        super(owner.x, owner.y, size);
        this.owner = owner; this.angle = angle;
        this.vx = Math.cos(angle)*speed; this.vy = Math.sin(angle)*speed;
        this.range = range; this.dmg = dmg; this.type = type;
        this.traveled = 0; this.pierce = false; this.wallBreak = false;
        this.pull = false; this.knockback = 0; this.effects = [];
        this.hcColt = false; this.hitTargets = new Set();
        this.textDmg = true;
        this.isPiusNormal = false; this.isPiusAutoBullet = false; this.isLastAmmo = false; this.homing = false;
    }
    update() {
        if (this.homing && this.owner && this.owner.hp > 0) {
            let target = Game.findClosestEnemy(this, 200);
            if (target) {
                let targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                let currentAngle = Math.atan2(this.vy, this.vx);
                let angleDiff = targetAngle - currentAngle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                let turnRate = 0.05 * Game.timeScale;
                if (Math.abs(angleDiff) > turnRate) currentAngle += Math.sign(angleDiff) * turnRate;
                else currentAngle = targetAngle;
                let speed = Math.hypot(this.vx, this.vy);
                this.vx = Math.cos(currentAngle) * speed; this.vy = Math.sin(currentAngle) * speed;
            }
        }

        let dx = this.vx * Game.timeScale, dy = this.vy * Game.timeScale;
        this.x += dx; this.y += dy;
        this.traveled += Math.hypot(dx, dy);
        
        if(this.hcColt) this.r += 0.3 * Game.timeScale;
        let pColor = this.type==='super'?'#f1c40f':'#ff7675';
        if (this.isPiusNormal || this.isPiusAutoBullet) pColor = '#3498db';
        if(Math.random()<0.5 * Game.timeScale) Game.particles.push(new Particle(this.x, this.y, pColor, this.r*0.5, 0,0, 10));

        if(this.traveled >= this.range) this.remove = true;
        
        if(!this.pierce) {
            for(let i=Game.map.length-1; i>=0; i--) {
                let w = Game.map[i];
                if(circleRectCollide(this.x, this.y, this.r, w.x, w.y, w.w, w.h)) {
                    if(this.wallBreak) {
                        Game.map.splice(i, 1);
                        for(let k=0; k<10; k++) Game.particles.push(new Particle(this.x, this.y, '#7f8c8d', 5, (Math.random()-0.5)*5, (Math.random()-0.5)*5, 20));
                    } else {
                        this.remove = true; break;
                    }
                }
            }
        }
        
        if(!this.remove) {
            Game.entities.forEach(e => {
                if(e !== this.owner && e.hp > 0 && e.team !== this.owner.team && e.z === 0) {
                    if (this.owner.type === 'kit' && this.owner.ridingTarget === e) return;
                    if(!this.hitTargets.has(e) && dist(this.x, this.y, e.x, e.y) < this.r + e.r) {
                        let finalDmg = this.dmg;
                        if (this.isPiusNormal) {
                            if (this.isLastAmmo) { finalDmg += 1100 * (this.owner.hcActive ? 1.25 : 1); this.isLastAmmo = false; }
                            let spawnAng = Math.random() * Math.PI * 2;
                            Game.areaEffects.push(new PiusAmmo(this.owner.x + Math.cos(spawnAng) * 75, this.owner.y + Math.sin(spawnAng) * 75, this.owner));
                        }

                        if (this.textDmg) e.takeDamage(finalDmg, this.owner);
                        if (!this.isGhostAttack) this.owner.chargeSuper(finalDmg * 0.05);
                        
                        if (this.isGusAttack && !this.isGhostAttack) {
                            if (this.spawnGhost) Game.ghosts.push(new Ghost(e.x, e.y, this.owner));
                            else {
                                let maxGauge = this.owner.sp === 'master' ? 1 : 2;
                                this.owner.ghostGauge = Math.min(maxGauge, this.owner.ghostGauge + 1);
                            }
                        }

                        if (this.isMortisSuper) {
                            this.owner.hp = Math.min(this.owner.maxHp, this.owner.hp + finalDmg);
                            Game.uiEffects.push(new FloatingText(this.owner.x, this.owner.y - 45, `+${Math.floor(finalDmg)}`, '#2ecc71', 16));
                        }
                        
                        if (this.owner.isPlayer && navigator.vibrate) navigator.vibrate(30);
                        for(let k=0; k<8; k++) Game.particles.push(new Particle(e.x, e.y, '#f39c12', 4, (Math.random()-0.5)*8, (Math.random()-0.5)*8, 15));

                        if(this.onHit) this.onHit();
                        this.effects.forEach(eff => {
                            if (!e.effects.some(existing => existing.type === eff.type)) e.effects.push({...eff});
                            else {
                                e.effects.forEach(existing => { if (existing.type === eff.type) existing.time = Math.max(existing.time, eff.time); });
                            }
                        });
                        
                        if(this.knockback > 0) { 
                            let ang = Math.atan2(e.y - this.owner.y, e.x - this.owner.x);
                            e.pushVx = Math.cos(ang) * (this.knockback * 0.8); e.pushVy = Math.sin(ang) * (this.knockback * 0.8); e.pushTimer = 8;
                        }
                        if(this.pull) { 
                            let ang = Math.atan2(this.owner.y - e.y, this.owner.x - e.x);
                            let d = dist(this.owner.x, this.owner.y, e.x, e.y);
                            let pullSpeed = Math.min(18, d / 6);
                            e.pushVx = Math.cos(ang) * pullSpeed; e.pushVy = Math.sin(ang) * pullSpeed; e.pushTimer = 10;
                        }
                        
                        if(!this.pierce) this.remove = true; else this.hitTargets.add(e);
                    }
                }
            });
        }
    }
    draw(ctx) {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
        if(this.type === 'super' && !this.isPiusAutoBullet) ctx.fillStyle = '#f1c40f';
        else if(this.type === 'gadget') ctx.fillStyle = '#2ecc71';
        else if(this.isPiusNormal || this.isPiusAutoBullet) ctx.fillStyle = '#3498db';
        else ctx.fillStyle = (this.owner.isPlayer || (Game.mode !== 'showdown' && this.owner.team === 1)) ? '#3498db' : '#e74c3c';
        ctx.fill();
    }
}

class Item extends Entity {
    constructor(x, y, type) { super(x, y, 15); this.type = type; this.anim = Math.random()*Math.PI; }
    update() { 
        this.anim += 0.08 * Game.timeScale; 
        for (let w of Game.map) {
            if (circleRectCollide(this.x, this.y, this.r, w.x, w.y, w.w, w.h)) {
                let leftDist = this.x - w.x, rightDist = (w.x + w.w) - this.x;
                let topDist = this.y - w.y, bottomDist = (w.y + w.h) - this.y;
                let minDist = Math.min(leftDist, rightDist, topDist, bottomDist);
                if (minDist === leftDist) this.x = w.x - this.r - 2;
                else if (minDist === rightDist) this.x = w.x + w.w + this.r + 2;
                else if (minDist === topDist) this.y = w.y - this.r - 2;
                else this.y = w.y + w.h + this.r + 2;
            }
        }
        const margin = 25;
        this.x = Math.max(margin + this.r, Math.min(this.x, Game.mapW - margin - this.r));
        this.y = Math.max(margin + this.r, Math.min(this.y, Game.mapH - margin - this.r));
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y + Math.sin(this.anim)*8);
        if(this.type === 'gem') {
            ctx.fillStyle = '#9b59b6'; ctx.beginPath();
            ctx.moveTo(0, -15); ctx.lineTo(15, 0); ctx.lineTo(0, 15); ctx.lineTo(-15, 0); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth=2; ctx.stroke();
        } else {
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(-12, -12, 24, 24);
            ctx.strokeStyle = '#fff'; ctx.lineWidth=3; ctx.strokeRect(-12, -12, 24, 24);
            ctx.fillStyle='#fff'; ctx.fillRect(-4,-4,8,8);
        }
        ctx.restore();
    }
}

let player = null;
const Game = {
    state: 'menu', mode: 'gemgrab', mapW: 1333, mapH: 1067, // ステージ広さを約2/3に縮小

    score: { t1: 0, t2: 0, cd: -1 }, gemTimer: 0, poisonRadius: 1600,

    init(mode, charType) {

        this.map.push({x: mw*3/4 - bs*1.5, y: mh*3/4 - bs*3, w: bs*1.5, h: bs*3});
        this.map.push({x: mw/2 - bs, y: bs*2, w: bs*2, h: bs});
        this.map.push({x: mw/2 - bs, y: mh - bs*3, w: bs*2, h: bs});
        this.map.push({x: mw/2 - bs*2, y: mh/2 - bs*3.5, w: bs*4, h: bs*1.5});

    findClosestEnemy(source, maxDist) {
        let closest = null, minDist = maxDist;
        this.entities.forEach(e => {
            if(e !== source && e.hp > 0 && e.team !== source.team) {
                if (e.type === 'kit' && e.invisibleTimer > 0) return;
                let d = dist(source.x, source.y, e.x, e.y);
                if(d < minDist) { minDist = d; closest = e; }

    update() {
        if(this.state !== 'playing') return;

            }

            if(t1g >= 10 || t2g >= 10) {

        }
        else if (this.mode === 'wipeout') {
            if(this.score.t1 >= 10) this.end(1); else if(this.score.t2 >= 10) this.end(2);
            this.updateHUD(`🔵 ${this.score.t1} - 🔴 ${this.score.t2} <span style="font-size:1rem;">/ 10</span>`);
        }
        else if (this.mode === 'bounty') {
            if (this.score.t1 >= 20) this.end(1);

            let starExists = this.areaEffects.some(ae => ae instanceof BountyCenterStar);

        }
        else if (this.mode === 'knockout') {
            let t1Alive = this.entities.filter(e=>e.team===1 && e.hp>0);
            let t2Alive = this.entities.filter(e=>e.team===2 && e.hp>0);
            let t1Icons = t1Alive.map(e => e.isPlayer ? '⭐' : '🔵').join(' ');
            let t2Icons = t2Alive.map(e => '🔴').join(' ');
            if (t1Alive.length === 0) t1Icons = '❌全滅';
            if (t2Alive.length === 0) t2Icons = '❌全滅';
            
            this.updateHUD(
                `<div style="font-size:0.9rem; color:#aaa; margin-bottom:2px;">ラウンド ${this.koRound} / 3</div>` +
                `<div style="display:flex; justify-content:space-between; gap:20px; font-size:1.05rem;">` +
                `<span>味方: ${t1Icons} (${t1Alive.length})</span>` +
                `<span style="color:#f1c40f;">${this.koWinsT1} 🏆 ${this.koWinsT2}</span>` +
                `<span>敵: (${t2Alive.length}) ${t2Icons}</span>` +
                `</div>`
            );
            
            if (!this.koRestarting) {
                if (t1Alive.length === 0 || t2Alive.length === 0) {
                    this.koRestarting = true; this.koRoundOverTimer = 180; 
                    let roundWinner = t1Alive.length > 0 ? 1 : 2;
                    if (roundWinner === 1) this.koWinsT1++; else this.koWinsT2++;
                }
            } else {
                this.koRoundOverTimer -= this.timeScale;
                if (this.koRoundOverTimer <= 0) {
                    this.koRestarting = false;
                    if (this.koWinsT1 >= 2) this.end(1);
                    else if (this.koWinsT2 >= 2) this.end(2);
                    else {
                        this.koRound++; this.setupRound(); 
                        Game.uiEffects.push(new FloatingText(this.mapW/2, this.mapH/2, `ラウンド ${this.koRound}!`, '#f1c40f', 32));
                    }
                }
            }
        }
        else if (this.mode === 'showdown') {
            this.poisonRadius -= 0.25 * this.timeScale;
            let alive = 0, last = null;
            this.entities.forEach(e => {
                if(e.hp>0) {
                    alive++; last = e;
                    if(dist(e.x, e.y, this.mapW/2, this.mapH/2) > this.poisonRadius) {
                        if(Math.random()<0.05 * this.timeScale) {
                            e.takeDamage(1000, null);

        this.particles.forEach(p => p.update());
        this.uiEffects.forEach(u => u.update());
        
        this.entities = this.entities.filter(e => !e.remove || e.hp > 0);
        this.bullets = this.bullets.filter(b => !b.remove);
        this.ghosts = this.ghosts.filter(g => !g.remove);
        this.areaEffects = this.areaEffects.filter(ae => !ae.remove);
        this.particles = this.particles.filter(p => p.life > 0);
