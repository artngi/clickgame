<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>チェーン・オーバードライブ：ミニ試作版</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b16;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 10px #0ff;
        }
        h1 { margin: 0; font-size: 20px; color: #ff007f; text-shadow: 0 0 10px #ff007f; }
        p { margin: 5px 0; font-size: 14px; }
        canvas {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            border: 2px solid #333;
            background: radial-gradient(circle, #15152b 0%, #050510 100%);
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>CHAIN OVERDRIVE [PROTOTYPE]</h1>
        <p>SCORE: <span id="score">0</span> | COMBO: <span id="combo">0</span>x</p>
        <p style="font-size: 11px; color: #888;">マウス移動で自機操作 / 敵を倒して連鎖爆発を狙え！</p>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ゲーム状態
        let score = 0;
        let combo = 0;
        let comboTimer = 0;

        // プレイヤー
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 12,
            color: '#00ffff',
            speed: 0.1 // マウスへの追従係数
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let damageTexts = [];

        // マウス位置の追跡
        let mouseX = player.x;
        let mouseY = player.y;
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // 敵クラス
        class Enemy {
            constructor(x, y, type = 'normal') {
                this.x = x;
                this.y = y;
                this.radius = type === 'tank' ? 20 : 10;
                this.speed = type === 'tank' ? 1.2 : 2.2;
                this.hp = type === 'tank' ? 5 : 1;
                this.color = type === 'tank' ? '#ff3366' : '#ff9900';
                this.type = type;
            }
            update() {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 弾（オートビット弾）
        class Bullet {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.speed = 10;
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
                this.radius = 4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00ffff';
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // パーティクル（爆発・スパーク）
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.radius = Math.random() * 3 + 1;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ダメージポップアップ文字
        class DamageText {
            constructor(x, y, text, color) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.color = color;
                this.alpha = 1;
                this.vy = -1.5;
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 16px Courier New';
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // 爆発生成（チェーン・インフェルノ効果）
        function createExplosion(x, y, color = '#ff0055', count = 15) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // スポーンタイマー
        let spawnCounter = 0;

        function spawnEnemy() {
            const side = Math.floor(Math.random() * 4);
            let x, y;
            if (side === 0) { x = Math.random() * canvas.width; y = -20; }
            else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 20; }
            else if (side === 2) { x = -20; y = Math.random() * canvas.height; }
            else { x = canvas.width + 20; y = Math.random() * canvas.height; }

            const type = Math.random() < 0.2 ? 'tank' : 'normal';
            enemies.push(new Enemy(x, y, type));
        }

        // 自動射撃タイマー
        let shootTimer = 0;

        // メインゲームループ
        function loop() {
            // 画面クリア
            ctx.fillStyle = 'rgba(5, 5, 16, 0.3)'; // 残像効果
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // プレイヤー移動（なめらか追従）
            player.x += (mouseX - player.x) * player.speed;
            player.y += (mouseY - player.y) * player.speed;

            // プレイヤー描画
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff';
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // オート射撃（0.15秒ごと）
            shootTimer++;
            if (shootTimer >= 10 && enemies.length > 0) {
                shootTimer = 0;
                // 最も近い敵を狙う
                let closest = enemies[0];
                let minDist = Math.hypot(closest.x - player.x, closest.y - player.y);
                for (let e of enemies) {
                    let dist = Math.hypot(e.x - player.x, e.y - player.y);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = e;
                    }
                }
                const angle = Math.atan2(closest.y - player.y, closest.x - player.x);
                bullets.push(new Bullet(player.x, player.y, angle));
                // 2連射ビット風
                bullets.push(new Bullet(player.x, player.y, angle + 0.2));
                bullets.push(new Bullet(player.x, player.y, angle - 0.2));
            }

            // 敵スポーン
            spawnCounter++;
            if (spawnCounter > 25) {
                spawnEnemy();
                spawnCounter = 0;
            }

            // コンボ減衰
            if (comboTimer > 0) {
                comboTimer--;
            } else if (combo > 0) {
                combo = 0;
            }

            // 弾の更新・描画
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.update();
                b.draw();

                // 画面外削除
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // 敵との当たり判定
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let dist = Math.hypot(b.x - e.x, b.y - e.y);
                    if (dist < b.radius + e.radius) {
                        // ヒット！
                        bullets.splice(i, 1);
                        e.hp--;
                        createExplosion(b.x, b.y, '#00ffff', 4);

                        if (e.hp <= 0) {
                            // 撃破！爆発シナジー演出
                            createExplosion(e.x, e.y, '#ff007f', 20);
                            combo++;
                            comboTimer = 120; // コンボ持続時間（約2秒）
                            score += 100 * (1 + Math.floor(combo / 5));

                            damageTexts.push(new DamageText(e.x, e.y, `+${100 * (1 + Math.floor(combo / 5))}`, '#ffff00'));

                            enemies.splice(j, 1);
                        }
                        break;
                    }
                }
            }

            // 敵の更新・描画
            for (let e of enemies) {
                e.update();
                e.draw();
            }

            // パーティクル更新
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // ダメージテキスト更新
            for (let i = damageTexts.length - 1; i >= 0; i--) {
                let dt = damageTexts[i];
                dt.update();
                dt.draw();
                if (dt.alpha <= 0) damageTexts.splice(i, 1);
            }

            // UI更新
            document.getElementById('score').innerText = score;
            document.getElementById('combo').innerText = combo;

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
