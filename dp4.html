
<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dopamine Clicker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 0.6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-short': 'bounce 0.5s ease-in-out 1',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow-x: hidden;
        }

        /* Floating Numbers Animation */
        @keyframes floatUpAndFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.8) translateY(0);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3) translateY(-30px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) translateY(-60px);
            }
        }
        .float-text {
            position: absolute;
            pointer-events: none;
            animation: floatUpAndFade 0.8s ease-out forwards;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.6);
            z-index: 50;
        }

        /* Particle effect */
        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(0.2);
            }
        }
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: particleFly 0.6s ease-out forwards;
            z-index: 45;
        }

        /* Screen Shake */
        .shake {
            animation: shakeAnim 0.15s ease-in-out infinite;
        }
        @keyframes shakeAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-3px, 3px) rotate(-1deg); }
            50% { transform: translate(3px, -2px) rotate(1deg); }
            75% { transform: translate(-2px, -3px) rotate(0.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Fever Glow Effect */
        .fever-active {
            box-shadow: 0 0 50px rgba(236, 72, 153, 0.8), inset 0 0 30px rgba(245, 158, 11, 0.6);
        }

        /* Skill Tree Connections & Node styling */
        .tree-connector {
            position: absolute;
            background: rgba(51, 65, 85, 0.5);
            z-index: 0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(236, 72, 153, 0.7);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between select-none overflow-x-hidden">

    <!-- TOP BAR / DASHBOARD -->
    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-amber-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-pink-500/20">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="text-xs uppercase tracking-widest text-slate-400 font-bold">Dopamine Clicker</h1>
                    <div class="flex items-baseline gap-2">
                        <span id="score" class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-amber-300 to-pink-500">0</span>
                        <span class="text-xs font-bold text-pink-400">DP</span>
                    </div>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="flex items-center gap-4 text-xs font-semibold bg-slate-950/60 py-2 px-4 rounded-xl border border-slate-800/80">
                <div class="text-center">
                    <div class="text-slate-400">Per Click</div>
                    <div id="dpc" class="text-amber-400 font-bold">+1</div>

                    <div id="dps" class="text-emerald-400 font-bold">0 /s</div>

                <div class="w-px h-6 bg-slate-800"></div>

    <!-- MAIN CONTAINER -->
    <main class="max-w-5xl w-full mx-auto p-4 flex-1 grid grid-cols-1 md:grid-cols-12 gap-6 items-start my-auto">
        
        <!-- LEFT COLUMN: CLICK ZONE & FEVER BAR -->
        <section class="md:col-span-5 flex flex-col items-center justify-center gap-6 py-4">
            
            <!-- Fever Progress Bar -->
            <div class="w-full max-w-sm">
                <div class="flex justify-between items-center text-xs font-bold mb-1.5 px-1">

            <!-- Main Orb / Click Target -->
            <div id="click-area" class="relative my-4 flex items-center justify-center cursor-pointer group">
                <!-- Outer Pulse Rings -->
                <div class="absolute w-72 h-72 rounded-full bg-pink-500/10 group-hover:bg-pink-500/20 transition-all duration-300 blur-xl"></div>
                <div class="absolute w-60 h-60 rounded-full bg-amber-400/10 group-hover:bg-amber-400/20 transition-all duration-300 blur-lg"></div>

                <!-- Core Button -->
                <button id="core-button" class="relative w-52 h-52 rounded-full bg-gradient-to-tr from-pink-600 via-rose-500 to-amber-400 p-1 shadow-2xl shadow-pink-500/30 active:scale-95 transition-transform duration-100 flex items-center justify-center outline-none focus:outline-none">
                    <div class="w-full h-full rounded-full bg-slate-950 flex flex-col items-center justify-center gap-2 relative overflow-hidden group-hover:bg-slate-900/90 transition-colors">
                        <!-- Internal Glow -->
                        <div class="absolute inset-0 bg-gradient-to-t from-pink-500/20 to-transparent opacity-50"></div>
                        
                        <!-- Icon -->

        <!-- RIGHT COLUMN: EVOLUTION SKILL TREE & SHOP -->
        <section class="md:col-span-7 bg-slate-900/50 border border-slate-800 rounded-2xl p-4 backdrop-blur-sm flex flex-col max-h-[580px]">
            
            <!-- Tab Headers -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">

                </h2>
                <!-- Buy Quantity Toggle -->
                <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-bold">

                </div>
            </div>

            <!-- Tree View Container -->
            <div id="upgrade-list" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- Dynamic Evolution Skill Tree Nodes injected here -->
            </div>

            <!-- Prestige / Ascension Banner -->
            <div class="mt-3 pt-3 border-t border-slate-800">
                <button id="prestige-btn" class="w-full bg-gradient-to-r from-purple-900/40 via-indigo-900/40 to-slate-900 border border-purple-500/30 hover:border-purple-500/60 p-3 rounded-xl flex items-center justify-between transition-all opacity-60 cursor-not-allowed" disabled>
                    <div class="flex items-center gap-3">

    <!-- FOOTER & QUICK ACTIONS -->
    <footer class="w-full bg-slate-950 border-t border-slate-900 py-3 px-4 text-xs text-slate-500">
        <div class="max-w-4xl mx-auto flex justify-between items-center">

                <span>Dopamine Level: </span>
                <span id="dopamine-title" class="text-slate-300 font-bold">Beginner</span>
            </div>
            <div class="flex gap-4">
                <button id="save-btn" class="hover:text-slate-300 transition-colors"><i class="fa-solid fa-floppy-disk mr-1"></i> Save</button>
                <button id="reset-btn" class="hover:text-rose-400 transition-colors"><i class="fa-solid fa-trash-can mr-1"></i> Reset</button>
            </div>
        </div>
    </footer>

    <!-- AUDIO EFFECTS (Synthesized via Web Audio API) -->
    <script>
        // --- Web Audio API Synth (No external audio files needed) ---
        class AudioSynth {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playClickSound(freq = 440, type = 'sine', duration = 0.08) {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(freq * 0.5, this.ctx.currentTime + duration);
                    
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }
            playFeverSound() {
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.3);
                    
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(now + 0.3);
                } catch(e) {}
            }
        }

        const audio = new AudioSynth();

        // --- GAME STATE ---
        let gameState = {
            dp: 0,
            totalDpEarned: 0,
            dpc: 1, // DP per click
            dps: 0, // DP per second
            multiplier: 1.0,
            prestigeMultiplier: 1.0,
            feverGauge: 0, // 0 to 100
            isFever: false,
            feverTimer: 0,
            feverDuration: 10, // Default 10s
            feverMultiplier: 10, // Default 10x
            critChance: 0.10, // 10%
            critMultiplier: 3.0, // 3x
            comboCount: 0,
            comboTimer: null,
            buyMultiplierMode: 1, // 1, 10, 'max'

            // --- EVOLUTION TREE NODES (Unified & Diverse Effects) ---
            upgrades: [
                // ROOT NODE
                { id: 'root_click', name: '基本神経シグナル', category: 'click', baseCost: 15, cost: 15, count: 0, maxCount: -1, icon: 'fa-hand-pointer', desc: 'タップ時の獲得DP +1', requires: [] },

                // BRANCH 1: TAP & CRITICAL EVOLUTION TREE
                { id: 'crit_chance', name: '反射神経研ぎ澄まし', category: 'crit', baseCost: 100, cost: 100, count: 0, maxCount: 15, icon: 'fa-bullseye', desc: 'クリティカル発動率 +2%', requires: ['root_click'] },
                { id: 'crit_damage', name: '過剰スパイクシナプス', category: 'crit', baseCost: 500, cost: 500, count: 0, maxCount: 10, icon: 'fa-bolt-lightning', desc: 'クリティカル時のダメージ倍率 +0.5x', requires: ['crit_chance'] },
                { id: 'tap_percent_auto', name: 'シークレット同期タップ', category: 'synergy', baseCost: 2500, cost: 2500, count: 0, maxCount: 10, icon: 'fa-network-wired', desc: 'タップ時に自動生成(DPS)の 2% を追加獲得', requires: ['crit_damage'] },

                // BRANCH 2: AUTONOMOUS & OFFLINE FLOW
                { id: 'auto_core', name: '自動ニューロン発生器', category: 'auto', baseCost: 50, cost: 50, count: 0, maxCount: -1, icon: 'fa-robot', desc: '秒間自動獲得(DPS) +3', requires: ['root_click'] },
                { id: 'auto_mult', name: '脳内神経ネットワーク', category: 'auto', baseCost: 400, cost: 400, count: 0, maxCount: 20, icon: 'fa-diagram-project', desc: '全体の自動獲得DP(DPS) +10%', requires: ['auto_core'] },
                { id: 'passive_synergy', name: 'バックグラウンド最適化', category: 'auto', baseCost: 3500, cost: 3500, count: 0, maxCount: 5, icon: 'fa-mug-hot', desc: '「ながら放置」時の放置獲得量を倍率強化 (+20%)', requires: ['auto_mult'] },

                // BRANCH 3: FEVER & COMBO RUSH
                { id: 'fever_extend', name: 'アドレナリンブースター', category: 'fever', baseCost: 300, cost: 300, count: 0, maxCount: 5, icon: 'fa-fire-flame-curved', desc: 'FEVERモードの持続時間 +2秒', requires: ['root_click'] },
                { id: 'fever_power', name: 'セロトニンオーバードライブ', category: 'fever', baseCost: 1500, cost: 1500, count: 0, maxCount: 5, icon: 'fa-explosion', desc: 'FEVER中の倍率がさらに +5x 増加', requires: ['fever_extend'] },
                { id: 'combo_master', name: 'ゾーン状態（連打コンボ）', category: 'combo', baseCost: 8000, cost: 8000, count: 0, maxCount: 5, icon: 'fa-stopwatch-20', desc: '連続タップでコンボ発生。1コンボにつき獲得DP +1%', requires: ['fever_power'] },

                // BRANCH 4: MASTER SYNERGY & OVERLOAD
                { id: 'overload', name: '全脳覚醒（マスターマインド）', category: 'master', baseCost: 50000, cost: 50000, count: 0, maxCount: 10, icon: 'fa-brain', desc: '全DP獲得量(DPC/DPS)が恒久的に +25% 増加', requires: ['tap_percent_auto', 'passive_synergy', 'combo_master'] }
            ]
        };

        // --- DOM ELEMENTS ---
        const scoreEl = document.getElementById('score');
        const dpcEl = document.getElementById('dpc');
        const dpsEl = document.getElementById('dps');
        const multiplierStatEl = document.getElementById('multiplier-stat');
        const clickArea = document.getElementById('click-area');
        const coreButton = document.getElementById('core-button');
        const coreIcon = document.getElementById('core-icon');
        const upgradeListEl = document.getElementById('upgrade-list');
        const feverBar = document.getElementById('fever-bar');
        const feverPercent = document.getElementById('fever-percent');
        const feverLabel = document.getElementById('fever-label');
        const prestigeBtn = document.getElementById('prestige-btn');
        const prestigeDesc = document.getElementById('prestige-desc');
        const prestigeReward = document.getElementById('prestige-reward');
        const dopamineTitleEl = document.getElementById('dopamine-title');
        const buy1Btn = document.getElementById('buy-1');
        const buy10Btn = document.getElementById('buy-10');
        const buyMaxBtn = document.getElementById('buy-max');
        const comboDisplayEl = document.getElementById('combo-display');
        const comboCountEl = document.getElementById('combo-count');
        const comboBoostEl = document.getElementById('combo-boost');

        // --- NUMBER FORMATTER ---
        function formatNumber(num) {
            if (num < 1000) return Math.floor(num).toLocaleString();
            const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
            const i = Math.floor(Math.log10(num) / 3);
            if (i >= suffixes.length) return num.toExponential(2);
            const formatted = (num / Math.pow(10, i * 3)).toFixed(2);
            return `${formatted} ${suffixes[i]}`;
        }

        // --- GAME LOGIC ---

        // Recalculate Stats based on Skill Tree
        function recalculateStats() {
            let baseClick = 1;
            let baseAuto = 0;

            // Skill Tree variables
            let critChanceAdd = 0;
            let critMultAdd = 0;
            let dpsPercentToClick = 0;
            let autoMultiplier = 1.0;
            let feverExt = 0;
            let feverPowerAdd = 0;
            let comboPower = 0;
            let masterMultiplier = 1.0;

            gameState.upgrades.forEach(u => {
                if (u.id === 'root_click') baseClick += u.count * 1;
                if (u.id === 'crit_chance') critChanceAdd += u.count * 0.02;
                if (u.id === 'crit_damage') critMultAdd += u.count * 0.5;
                if (u.id === 'tap_percent_auto') dpsPercentToClick += u.count * 0.02;

                if (u.id === 'auto_core') baseAuto += u.count * 3;
                if (u.id === 'auto_mult') autoMultiplier += u.count * 0.10;
                if (u.id === 'passive_synergy') autoMultiplier += u.count * 0.20;

                if (u.id === 'fever_extend') feverExt += u.count * 2;
                if (u.id === 'fever_power') feverPowerAdd += u.count * 5;
                if (u.id === 'combo_master') comboPower += u.count * 0.01;

                if (u.id === 'overload') masterMultiplier += u.count * 0.25;
            });

            // Set dynamic stats
            gameState.critChance = 0.10 + critChanceAdd;
            gameState.critMultiplier = 3.0 + critMultAdd;
            gameState.feverDuration = 10 + feverExt;
            gameState.feverMultiplier = 10 + feverPowerAdd;

            const comboBoostPct = gameState.comboCount * comboPower;
            const comboMultiplier = 1 + comboBoostPct;

            const feverMult = gameState.isFever ? gameState.feverMultiplier : 1;
            const currentTotalMult = gameState.multiplier * gameState.prestigeMultiplier * masterMultiplier * feverMult * comboMultiplier;

            gameState.dps = (baseAuto * autoMultiplier) * currentTotalMult;
            
            // DPC gets base click + bonus from current DPS
            const bonusFromDps = gameState.dps * dpsPercentToClick;
            gameState.dpc = (baseClick * currentTotalMult) + bonusFromDps;

            // Update UI elements
            scoreEl.textContent = formatNumber(gameState.dp);
            dpcEl.textContent = `+${formatNumber(gameState.dpc)}`;
            dpsEl.textContent = `${formatNumber(gameState.dps)} /s`;
            multiplierStatEl.textContent = `x${currentTotalMult.toFixed(1)}`;

            if (gameState.comboCount > 0 && comboPower > 0) {
                comboDisplayEl.classList.remove('opacity-0');
                comboCountEl.textContent = gameState.comboCount;
                comboBoostEl.textContent = `+${(comboBoostPct * 100).toFixed(0)}%`;
            } else {
                comboDisplayEl.classList.add('opacity-0');
            }

            updateDopamineTitle();
            updatePrestigeStatus();
        }

        // Title rank update
        function updateDopamineTitle() {
            const total = gameState.totalDpEarned;
            if (total < 1000) dopamineTitleEl.textContent = 'ビギナー (Beginner)';
            else if (total < 50000) dopamineTitleEl.textContent = 'プチプチマニア (Bubble Popper)';
            else if (total < 1000000) dopamineTitleEl.textContent = '快感ハンター (Thrill Seeker)';
            else if (total < 50000000) dopamineTitleEl.textContent = 'ドーパミン依存 (Dopamine Junkie)';
            else dopamineTitleEl.textContent = '全知全能の脳内神 (Brain Deity)';
        }

        // Handle Click
        function handleClick(e) {
            audio.init();

            // Combo system update
            const comboNode = gameState.upgrades.find(u => u.id === 'combo_master');
            if (comboNode && comboNode.count > 0) {
                gameState.comboCount++;
                clearTimeout(gameState.comboTimer);
                gameState.comboTimer = setTimeout(() => {
                    gameState.comboCount = 0;
                    recalculateStats();
                }, 1500); // 1.5s timeout for combo
            }

            // Critical hit calculation
            const isCrit = Math.random() < gameState.critChance;
            const critMult = isCrit ? gameState.critMultiplier : 1;
            const earned = gameState.dpc * critMult;

            gameState.dp += earned;
            gameState.totalDpEarned += earned;

            // Sound
            const soundFreq = isCrit ? 880 : 350 + Math.random() * 200;
            audio.playClickSound(soundFreq, isCrit ? 'square' : 'sine');

            // Floating Text & Particles
            createFloatingText(e, `+${formatNumber(earned)}`, isCrit);
            createParticles(e, isCrit ? 12 : 6);

            // Screen Shake on Critical
            if (isCrit) {
                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 150);
            }

            // Fever Gauge Charge
            if (!gameState.isFever) {
                gameState.feverGauge = Math.min(100, gameState.feverGauge + 2);
                if (gameState.feverGauge >= 100) {
                    triggerFever();
                }
            }

            recalculateStats();
        }

        // Floating Number Animation
        function createFloatingText(e, text, isCrit) {
            const rect = clickArea.getBoundingClientRect();
            let x = e ? e.clientX : rect.left + rect.width / 2;
            let y = e ? e.clientY : rect.top + rect.height / 2;

            x += (Math.random() - 0.5) * 40;
            y += (Math.random() - 0.5) * 40;

            const el = document.createElement('div');
            el.className = `float-text ${isCrit ? 'text-amber-300 text-2xl font-black' : 'text-pink-400 text-lg'}`;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.textContent = isCrit ? `CRITICAL! ${text}` : text;

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // Particles
        function createParticles(e, count) {
            const rect = clickArea.getBoundingClientRect();
            const originX = e ? e.clientX : rect.left + rect.width / 2;
            const originY = e ? e.clientY : rect.top + rect.height / 2;

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 8 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                const colors = ['#ec4899', '#f59e0b', '#a855f7', '#3b82f6'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                particle.style.left = `${originX}px`;
                particle.style.top = `${originY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 80 + 30;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                particle.style.setProperty('--tw-translate-x', `${tx}px`);
                particle.style.setProperty('--tw-translate-y', `${ty}px`);

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        }

        // Trigger Fever
        function triggerFever() {
            gameState.isFever = true;
            gameState.feverGauge = 100;
            audio.playFeverSound();

            document.body.classList.add('fever-active');
            feverLabel.innerHTML = `<i class="fa-solid fa-fire text-pink-400 animate-bounce"></i> FEVER TIME (${gameState.feverMultiplier}x)!`;
            feverLabel.className = 'text-pink-400 font-black animate-pulse';

            let duration = gameState.feverDuration;
            const totalDur = duration;
            const interval = setInterval(() => {
                duration -= 0.1;
                gameState.feverGauge = (duration / totalDur) * 100;
                feverBar.style.width = `${gameState.feverGauge}%`;
                feverPercent.textContent = `${Math.ceil(gameState.feverGauge)}%`;

                if (duration <= 0) {
                    clearInterval(interval);
                    gameState.isFever = false;
                    gameState.feverGauge = 0;
                    feverBar.style.width = '0%';
                    feverPercent.textContent = '0%';
                    feverLabel.innerHTML = '<i class="fa-solid fa-fire"></i> FEVER GAUGE';
                    feverLabel.className = 'text-amber-400 font-bold';
                    document.body.classList.remove('fever-active');
                    recalculateStats();
                }
            }, 100);

            recalculateStats();
        }

        // --- SKILL TREE & UPGRADES RENDER ---
        function isNodeUnlocked(upgrade) {
            if (!upgrade.requires || upgrade.requires.length === 0) return true;
            // Check if all required nodes have at least 1 point
            return upgrade.requires.every(reqId => {
                const reqNode = gameState.upgrades.find(u => u.id === reqId);
                return reqNode && reqNode.count > 0;
            });
        }

        function calculateUpgradeCost(upgrade, amount) {
            let cost = 0;
            let currentCost = upgrade.cost;
            for (let i = 0; i < amount; i++) {
                cost += currentCost;
                currentCost = Math.floor(currentCost * 1.25);
            }
            return cost;
        }

        function calculateMaxAfford(upgrade) {
            let count = 0;
            let tempDp = gameState.dp;
            let currentCost = upgrade.cost;
            const availableSpace = upgrade.maxCount === -1 ? 999999 : (upgrade.maxCount - upgrade.count);

            while (tempDp >= currentCost && count < availableSpace) {
                tempDp -= currentCost;
                count++;
                currentCost = Math.floor(currentCost * 1.25);
            }
            return count;
        }

        function renderUpgrades() {
            upgradeListEl.innerHTML = '';

            gameState.upgrades.forEach(u => {
                const unlocked = isNodeUnlocked(u);
                const isMaxed = u.maxCount !== -1 && u.count >= u.maxCount;

                let qtyToBuy = 1;
                if (gameState.buyMultiplierMode === 10) qtyToBuy = 10;
                else if (gameState.buyMultiplierMode === 'max') {
                    qtyToBuy = Math.max(1, calculateMaxAfford(u));
                }

                if (u.maxCount !== -1) {
                    qtyToBuy = Math.min(qtyToBuy, u.maxCount - u.count);
                }

                const totalCost = calculateUpgradeCost(u, qtyToBuy);
                const canAfford = unlocked && !isMaxed && gameState.dp >= totalCost && qtyToBuy > 0;

                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border flex items-center justify-between transition-all relative overflow-hidden ${
                    !unlocked
                    ? 'bg-slate-950/40 border-slate-900 opacity-40 grayscale'
                    : isMaxed 
                    ? 'bg-purple-950/20 border-purple-800/40 opacity-90'
                    : canAfford 
                    ? 'bg-slate-800/80 border-slate-700 hover:border-pink-500/50 cursor-pointer' 
                    : 'bg-slate-900/40 border-slate-800/60 opacity-60'
                }`;

                // Requirement badge text
                let reqText = '';
                if (!unlocked) {
                    const reqNames = u.requires.map(rId => {
                        const r = gameState.upgrades.find(item => item.id === rId);
                        return r ? r.name : rId;
                    }).join(', ');
                    reqText = `<span class="text-[9px] text-amber-500 font-bold block mt-0.5"><i class="fa-solid fa-lock"></i> 解放条件: ${reqNames}</span>`;
                }

                const countBadge = u.maxCount === -1 
                    ? `x${u.count}` 
                    : `${u.count}/${u.maxCount}`;

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-slate-950 border border-slate-800 flex items-center justify-center ${unlocked ? 'text-pink-400' : 'text-slate-600'} font-bold text-lg flex-shrink-0">
                            <i class="fa-solid ${u.icon}"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold ${unlocked ? 'text-slate-200' : 'text-slate-500'}">${u.name}</span>
                                <span class="text-[10px] bg-slate-950 text-pink-400 font-extrabold px-1.5 py-0.5 rounded-md border border-slate-800">${countBadge}</span>
                            </div>
                            <div class="text-[11px] text-slate-400 mt-0.5">${u.desc}</div>
                            ${reqText}
                        </div>
                    </div>
                    <button class="buy-btn px-3 py-1.5 rounded-lg font-bold text-xs flex flex-col items-end flex-shrink-0 ${
                        isMaxed 
                        ? 'bg-purple-900/50 text-purple-300 border border-purple-500/30 cursor-default'
                        : canAfford 
                        ? 'bg-pink-600 hover:bg-pink-500 text-white shadow-md shadow-pink-600/20' 
                        : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                    }" ${!canAfford || isMaxed ? 'disabled' : ''}>
                        <span>${isMaxed ? 'MAX' : '+' + qtyToBuy}</span>
                        <span class="text-[10px] opacity-90">${isMaxed ? 'COMPLETED' : formatNumber(totalCost) + ' DP'}</span>
                    </button>
                `;

                if (canAfford && !isMaxed) {
                    card.addEventListener('click', () => {
                        buyUpgrade(u.id, qtyToBuy, totalCost);
                    });
                }

                upgradeListEl.appendChild(card);
            });
        }

        function buyUpgrade(id, amount, cost) {
            const upgrade = gameState.upgrades.find(u => u.id === id);
            if (upgrade && gameState.dp >= cost) {
                gameState.dp -= cost;
                for (let i = 0; i < amount; i++) {
                    upgrade.count++;
                    upgrade.cost = Math.floor(upgrade.cost * 1.25);
                }
                audio.playClickSound(600, 'triangle');
                recalculateStats();
                renderUpgrades();
            }
        }

        // Set Buy Multiplier Mode
        function setBuyMode(mode) {
            gameState.buyMultiplierMode = mode;
            [buy1Btn, buy10Btn, buyMaxBtn].forEach(btn => {
                btn.className = 'px-2.5 py-1 rounded-md text-slate-400 hover:text-white transition-colors';
            });

            if (mode === 1) buy1Btn.className = 'px-2.5 py-1 rounded-md bg-pink-600 text-white font-bold';
            if (mode === 10) buy10Btn.className = 'px-2.5 py-1 rounded-md bg-pink-600 text-white font-bold';
            if (mode === 'max') buyMaxBtn.className = 'px-2.5 py-1 rounded-md bg-pink-600 text-white font-bold';

            renderUpgrades();
        }

        // --- PRESTAGE LOGIC ---
        function updatePrestigeStatus() {
            const req = 1000000; // 1M DP
            const canPrestige = gameState.totalDpEarned >= req;

            if (canPrestige) {
                prestigeBtn.disabled = false;
                prestigeBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                prestigeBtn.classList.add('hover:bg-purple-950/60', 'cursor-pointer');
                
                const rewardPct = Math.floor((gameState.totalDpEarned / req) * 50);
                prestigeReward.textContent = `+${rewardPct}% Permanent Boost`;
            } else {
                prestigeBtn.disabled = true;
                prestigeBtn.classList.add('opacity-60', 'cursor-not-allowed');
            }
        }

        prestigeBtn.addEventListener('click', () => {
            const req = 1000000;
            if (gameState.totalDpEarned < req) return;

            const boost = 1 + Math.floor((gameState.totalDpEarned / req) * 0.5);
            if (confirm(`Neural Resetを実行して転生しますか？\n全てのDPとツリー進行状況がリセットされますが、永久倍率が x${boost.toFixed(1)} に向上します！`)) {
                gameState.prestigeMultiplier *= boost;
                gameState.dp = 0;
                gameState.comboCount = 0;
                gameState.upgrades.forEach(u => {
                    u.count = 0;
                    u.cost = u.baseCost;
                });
                recalculateStats();
                renderUpgrades();
            }
        });

        // --- GAME LOOP (Auto Generation) ---
        let lastTime = Date.now();
        function gameLoop() {
            const now = Date.now();
            const delta = (now - lastTime) / 1000;
            lastTime = now;

            if (gameState.dps > 0) {
                const autoDp = gameState.dps * delta;
                gameState.dp += autoDp;
                gameState.totalDpEarned += autoDp;
                scoreEl.textContent = formatNumber(gameState.dp);
                updateDopamineTitle();
                updatePrestigeStatus();
            }

            renderUpgrades();
            requestAnimationFrame(gameLoop);
        }

        // --- EVENT LISTENERS ---
        clickArea.addEventListener('click', handleClick);

        buy1Btn.addEventListener('click', () => setBuyMode(1));
        buy10Btn.addEventListener('click', () => setBuyMode(10));
        buyMaxBtn.addEventListener('click', () => setBuyMode('max'));

        // Save & Reset
        document.getElementById('save-btn').addEventListener('click', () => {
            localStorage.setItem('dopamine_clicker_save', JSON.stringify(gameState));
            alert('ゲームデータを保存しました！');
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm('本当に最初からやり直しますか？')) {
                localStorage.removeItem('dopamine_clicker_save');
                location.reload();
            }
        });

        // Load Game
        function loadGame() {
            const saved = localStorage.getItem('dopamine_clicker_save');
            if (saved) {
                try {
                    const loadedState = JSON.parse(saved);
                    gameState.dp = loadedState.dp || 0;
                    gameState.totalDpEarned = loadedState.totalDpEarned || 0;
                    gameState.prestigeMultiplier = loadedState.prestigeMultiplier || 1.0;
                    
                    if (loadedState.upgrades) {
                        loadedState.upgrades.forEach(savedU => {
                            const u = gameState.upgrades.find(item => item.id === savedU.id);
                            if (u) {
                                u.count = savedU.count || 0;
                                u.cost = savedU.cost || u.baseCost;
                            }
                        });
                    }
                } catch(e) {
                    console.error('Failed to load save', e);
                }
            }
            recalculateStats();
            renderUpgrades();
        }

        // Init on Window Load
        window.onload = function () {
            loadGame();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
