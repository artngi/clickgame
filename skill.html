
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>フルーツクラッシュ - 爽快パズルゲーム</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Matter.js (2D Physics Engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'fruit-crush-game';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

    let db = null;
    let auth = null;
    let userDocRef = null;

    if (firebaseConfig) {
      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        const initAuth = async () => {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
          const user = auth.currentUser;
          if (user) {
            userDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'saveData', 'playerState');
            const docSnap = await getDoc(userDocRef);
            if (docSnap.exists()) {
              const cloudData = docSnap.data();
              if (cloudData && cloudData.state) {
                if (window.syncSaveData) {
                  window.syncSaveData(cloudData.state);
                }
              }
            }
          }
        };
        initAuth().catch(console.error);
      } catch (e) {
        console.error("Firebase Cloud Save initialization:", e);
      }
    }

    window.saveSaveDataToCloud = async function(stateData) {
      if (userDocRef && db) {
        try {
          await setDoc(userDocRef, { state: stateData, updatedAt: new Date().toISOString() }, { merge: true });
        } catch(e) {
          console.error("Cloud Save failed:", e);
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0f172a;
      overflow: hidden;
    }
    
    .mobile-container {
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      background: linear-gradient(180deg, #1e1b4b 0%, #311042 100%);
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Custom Animations */
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(234, 179, 8, 0.6)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.9)); }
    }
    .pulse-glow { animation: pulse-glow 2s infinite; }

    @keyframes slice-flash {
      0% { opacity: 1; transform: scaleY(1); }
      100% { opacity: 0; transform: scaleY(0.1); }
    }
    .slice-effect {
      position: absolute;
      background: linear-gradient(90deg, transparent, #ffffff, #60a5fa, #ffffff, transparent);
      height: 8px;
      transform-origin: center;
      pointer-events: none;
      z-index: 50;
      animation: slice-flash 0.25s forwards;
    }

    /* Floating absorption particle */
    .absorb-particle {
      position: absolute;
      pointer-events: none;
      z-index: 60;
      transition: all 0.5s cubic-bezier(0.1, 0.8, 0.3, 1);
      border-radius: 50%;
      font-weight: bold;
    }

    /* Canvas overlay for slash drawing */
    #slashCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }
  </style>
</head>

  <script>
    /* ============================================================
       1. GAME DATA & MASTER DEFINITIONS
       ============================================================ */
    const FRUITS = {
      watermelon: { id: 'watermelon', name: 'スイカ', color: '#10b981', stroke: '#047857', emoji: '🍉', radius: 34 },
      orange:     { id: 'orange',     name: 'オレンジ', color: '#f97316', stroke: '#c2410c', emoji: '🍊', radius: 31 },
      apple:      { id: 'apple',      name: 'りんご',   color: '#ef4444', stroke: '#b91c1c', emoji: '🍎', radius: 31 },
      grape:      { id: 'grape',      name: 'ぶどう',   color: '#a855f7', stroke: '#6b21a8', emoji: '🍇', radius: 28 }
    };

    const SKILL_MASTERS = {
      bomber: {
        id: 'bomber',
        name: 'フルーツボンバー',
        icon: 'fa-bomb',
        bg: 'from-red-600 to-orange-600',
        desc: 'ペア果物を爆弾化！消すと周りも連鎖爆発！',
        maxCharge: 12
      },
      chain: {
        id: 'chain',
        name: 'フルーツチェーン',
        icon: 'fa-link',
        bg: 'from-blue-600 to-cyan-600',
        desc: '隣接したペア果物をチェーンで繋ぎ、1タップで一括消去！',
        maxCharge: 10
      },
      time: {
        id: 'time',
        name: 'タイムフルーツ',
        icon: 'fa-hourglass-half',
        bg: 'from-emerald-600 to-teal-600',
        desc: '制限時間を5秒回復！（最大60秒）',
        maxCharge: 15
      },
      sword: {
        id: 'sword',
        name: 'ソードフルーツ',
        icon: 'fa-bolt',
        bg: 'from-amber-600 to-yellow-600',
        desc: '画面の中央を一刀両断！横一列のフルーツを消去！',
        maxCharge: 14
      },
      small_bomb: {
        id: 'small_bomb',
        name: 'スモールフルーツボム',
        icon: 'fa-asterisk',
        bg: 'from-purple-600 to-indigo-600',
        desc: '爆発する小さなボムを5個ランダムに降らせる！',
        maxCharge: 12
      },
      samurai: {
        id: 'samurai',
        name: 'フルーツサムライ',
        icon: 'fa-cut',
        bg: 'from-rose-600 to-pink-600',
        desc: '3秒間サムライタイム！指でなぞったフルーツを斬る！',
        maxCharge: 18
      },
      roulette: {
        id: 'roulette',
        name: 'フルーツルーレット',
        icon: 'fa-dharmachakra',
        bg: 'from-fuchsia-600 to-pink-600',
        desc: 'ルーレットで[消去数]×[スコア倍率]を決定！',
        maxCharge: 20
      },
      charge: {
        id: 'charge',
        name: 'チャージフルーツ',
        icon: 'fa-charging-station',
        bg: 'from-cyan-600 to-blue-700',
        desc: '5秒間果物の消去数をカウントし、その分まとめて自動爆破！',
        maxCharge: 16
      }
    };

    // Default Save State
    let state = {
      coins: 0,
      highScore: 0,
      scoreHistory: [],
      ownedSkills: {
        bomber: { level: 1 }
      },
      pairAssignments: {
        watermelon: 'bomber',
        orange: null,
        apple: null,
        grape: null
      }
    };
    window.state = state;

    function mergeStateData(incoming) {
      if (!incoming) return;
      if (typeof incoming.coins === 'number') {
        state.coins = Math.max(state.coins, incoming.coins);
      }
      if (typeof incoming.highScore === 'number') {
        state.highScore = Math.max(state.highScore, incoming.highScore);
      }
      if (Array.isArray(incoming.scoreHistory) && incoming.scoreHistory.length > 0) {
        const existingKeys = new Set(state.scoreHistory.map(h => h.date + '_' + h.score));
        incoming.scoreHistory.forEach(h => {
          const key = h.date + '_' + h.score;
          if (!existingKeys.has(key)) {
            state.scoreHistory.push(h);
            existingKeys.add(key);
          }
        });
      }
      if (incoming.ownedSkills && typeof incoming.ownedSkills === 'object') {
        Object.keys(incoming.ownedSkills).forEach(sId => {
          if (!state.ownedSkills[sId] || state.ownedSkills[sId].level < incoming.ownedSkills[sId].level) {
            state.ownedSkills[sId] = { ...incoming.ownedSkills[sId] };
          }
        });
      }
      if (incoming.pairAssignments && typeof incoming.pairAssignments === 'object') {
        Object.keys(incoming.pairAssignments).forEach(fKey => {
          if (incoming.pairAssignments[fKey] !== undefined) {
            state.pairAssignments[fKey] = incoming.pairAssignments[fKey];
          }
        });
      }
    }

    function loadSaveData() {
      try {
        const saved = localStorage.getItem('fruit_crush_save_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          mergeStateData(parsed);
        }
      } catch (e) {
        console.error('Failed to load save data', e);
      }
    }

    window.syncSaveData = function(cloudState) {
      mergeStateData(cloudState);
      saveSaveData();
      if (window.updateUI) window.updateUI();
    };

    function saveSaveData() {
      try {
        localStorage.setItem('fruit_crush_save_v1', JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save data', e);
      }
      if (window.saveSaveDataToCloud) {
        window.saveSaveDataToCloud(state);
      }
    }

    let engine, world, runner;
    let canvasContainer = document.getElementById('canvasContainer');
    let slashCanvas = document.getElementById('slashCanvas');
    let slashCtx = slashCanvas.getContext('2d');

    let gameActive = false;
    let gameTimer = 60;
    let timerInterval = null;
    let currentScore = 0;
    let currentCoins = 0;

    // Skill status in-game
    let skillCharges = { watermelon: 0, orange: 0, apple: 0, grape: 0 };
    let activeSamuraiMode = false;
    let samuraiTimer = null;
    let chargeFruitActive = false;
    let chargeCount = 0;

    // Matter.js Bounds
    let width = 360;
    let height = 500;
    let fruitBodies = [];
    const MAX_FRUITS = 40;

    function updateUI() {
      document.getElementById('uiCoins').innerText = state.coins;
      document.getElementById('uiHighScore').innerText = state.highScore;

      // Home Pairs Display
      const homeSkillGrid = document.getElementById('homeSkillGrid');
      homeSkillGrid.innerHTML = '';
      Object.keys(FRUITS).forEach(fKey => {
        const fruit = FRUITS[fKey];
        const skillId = state.pairAssignments[fKey];
        const skill = skillId ? SKILL_MASTERS[skillId] : null;

        const card = document.createElement('div');
        card.className = "bg-slate-900/90 border border-slate-700 rounded-xl p-2 flex items-center space-x-2";
        card.innerHTML = `
          <div class="text-2xl">${fruit.emoji}</div>
          <div class="flex-1 overflow-hidden">
            <div class="text-[10px] text-slate-400 font-bold">${fruit.name}</div>
            <div class="text-xs font-black text-amber-300 truncate">${skill ? skill.name : '未設定'}</div>
          </div>
        `;
        homeSkillGrid.appendChild(card);
      });
    }

    function spawnAbsorbEffect(startX, startY, isCoin = false) {
      // In-game coin absorption target set to in-game coins display
      const targetId = isCoin ? 'gameCoinsContainer' : 'scoreContainer';
      const targetEl = document.getElementById(targetId) || document.getElementById(isCoin ? 'coinContainer' : 'scoreContainer');
      if (!targetEl) return;

      const targetRect = targetEl.getBoundingClientRect();
      const containerRect = document.querySelector('.mobile-container').getBoundingClientRect();

      const particle = document.createElement('div');
      particle.className = 'absorb-particle';
      particle.innerText = isCoin ? '🪙' : '✨';
      particle.style.left = (startX - containerRect.left) + 'px';
      particle.style.top = (startY - containerRect.top) + 'px';
      particle.style.fontSize = isCoin ? '16px' : '14px';

      document.querySelector('.mobile-container').appendChild(particle);

      requestAnimationFrame(() => {
        particle.style.left = (targetRect.left - containerRect.left + targetRect.width / 2) + 'px';
        particle.style.top = (targetRect.top - containerRect.top + targetRect.height / 2) + 'px';
        particle.style.opacity = '0.4';
        particle.style.transform = 'scale(0.5)';
      });

      setTimeout(() => {
        particle.remove();
      }, 500);
    }

    // Helper for precise coordinate mapping regardless of CSS scaling
    function getCanvasCoordinates(e) {
      const rect = canvasContainer.getBoundingClientRect();
      const scaleX = width / rect.width;
      const scaleY = height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function initPhysics() {
      const { Engine, World, Bodies, Events } = Matter;

      if (engine) {
        World.clear(world);
        Engine.clear(engine);
      }

      engine = Engine.create({
        gravity: { x: 0, y: 1.5 }
      });
      world = engine.world;

      const rect = canvasContainer.getBoundingClientRect();
      width = rect.width || 360;
      height = rect.height || 480;

      // Adjust slash canvas
      slashCanvas.width = width;
      slashCanvas.height = height;

      // Create Boundaries
      const wallThickness = 60;
      const ground = Bodies.rectangle(width / 2, height + wallThickness / 2 - 5, width * 2, wallThickness, { isStatic: true, label: 'ground' });
      const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 4, { isStatic: true });
      const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 4, { isStatic: true });

      World.add(world, [ground, leftWall, rightWall]);

      // Custom Render Loop
      let canvas = document.getElementById('physicsCanvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = 'physicsCanvas';
        canvas.className = 'absolute inset-0 w-full h-full';
        canvasContainer.appendChild(canvas);
      }
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');

      function renderLoop() {
        if (!gameActive) return;

        Engine.update(engine, 1000 / 60);

        ctx.clearRect(0, 0, width, height);

        // Render bodies
        const bodies = Matter.Composite.allBodies(world);
        bodies.forEach(body => {
          if (body.customFruit) {
            drawFruitBody(ctx, body);
          } else if (body.customBomb) {
            drawSmallBombBody(ctx, body);
          }
        });

        // Draw Chain connections if Fruit Chain active
        drawChainLines(ctx);

        requestAnimationFrame(renderLoop);
      }

      requestAnimationFrame(renderLoop);
    }

    function spawnFruit(x, y, forcedType = null) {
      const fruitKeys = Object.keys(FRUITS);
      const typeKey = forcedType || fruitKeys[Math.floor(Math.random() * fruitKeys.length)];
      const fruitDef = FRUITS[typeKey];

      const body = Matter.Bodies.circle(
        x || Math.random() * (width - 60) + 30,
        y || -30,
        fruitDef.radius,
        {
          restitution: 0.3,
          friction: 0.1,
          density: 0.002
        }
      );

      body.customFruit = {
        type: typeKey,
        isBomb: false,
        isChained: false
      };

      Matter.World.add(world, body);
      fruitBodies.push(body);
      return body;
    }

    function refillFruits() {
      if (!gameActive) return;
      const currentCount = fruitBodies.filter(b => b.customFruit).length;
      const needed = MAX_FRUITS - currentCount;
      for (let i = 0; i < needed; i++) {
        setTimeout(() => {
          if (gameActive && fruitBodies.filter(b => b.customFruit).length < MAX_FRUITS) {
            spawnFruit(Math.random() * (width - 60) + 30, -30 - (i * 35));
          }
        }, i * 60);
      }
    }

    function drawFruitBody(ctx, body) {
      const { x, y } = body.position;
      const fruit = FRUITS[body.customFruit.type];
      const radius = fruit.radius;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(body.angle);

      // Base Circle
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = fruit.color;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = body.customFruit.isBomb ? '#f59e0b' : fruit.stroke;
      ctx.stroke();

      // Bomb aura glow
      if (body.customFruit.isBomb) {
        ctx.beginPath();
        ctx.arc(0, 0, radius + 4, 0, Math.PI * 2);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Emoji / Icon
      ctx.font = `${radius * 1.2}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(body.customFruit.isBomb ? '💣' : fruit.emoji, 0, 2);

      ctx.restore();
    }

    function drawSmallBombBody(ctx, body) {
      const { x, y } = body.position;
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ef4444';
      ctx.stroke();

      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💣', 0, 1);
      ctx.restore();
    }

    function drawChainLines(ctx) {
      // Find connected same-type fruits
      ctx.save();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.setLineDash([6, 6]);

      for (let i = 0; i < fruitBodies.length; i++) {
        const b1 = fruitBodies[i];
        if (!b1.customFruit || !b1.customFruit.isChained) continue;

        for (let j = i + 1; j < fruitBodies.length; j++) {
          const b2 = fruitBodies[j];
          if (!b2.customFruit || !b2.customFruit.isChained) continue;
          if (b1.customFruit.type !== b2.customFruit.type) continue;

          const dist = Math.hypot(b1.position.x - b2.position.x, b1.position.y - b2.position.y);
          if (dist < 75) {
            ctx.beginPath();
            ctx.moveTo(b1.position.x, b1.position.y);
            ctx.lineTo(b2.position.x, b2.position.y);
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    function startGame() {
      currentScore = 0;
      currentCoins = 0;
      gameTimer = 60;
      gameActive = true;

      // Hide top header during gameplay
      document.getElementById('mainHeader').classList.add('hidden');

      // Charge Reset
      skillCharges = { watermelon: 0, orange: 0, apple: 0, grape: 0 };
      chargeFruitActive = false;
      chargeCount = 0;

      document.getElementById('gameScore').innerText = '0';
      document.getElementById('gameCoins').innerText = '0';
      document.getElementById('gameTimer').innerText = '60';

      document.getElementById('screenHome').classList.add('hidden');
      document.getElementById('screenGame').classList.remove('hidden');

      initPhysics();
      renderInGameSkillButtons();

      // Initial Fruit Fill
      fruitBodies = [];
      refillFruits();

      // Timer Loop
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!gameActive) return;
        gameTimer--;
        document.getElementById('gameTimer').innerText = gameTimer;
        if (gameTimer <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);

      // Save Data Update
      state.coins += currentCoins;
      if (currentScore > state.highScore) {
        state.highScore = currentScore;
      }

      state.scoreHistory.unshift({
        score: currentScore,
        coins: currentCoins,
        date: new Date().toLocaleDateString('ja-JP') + ' ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
      });
      if (state.scoreHistory.length > 20) state.scoreHistory.pop();

      saveSaveData();
      updateUI();

      // Result Display
      document.getElementById('resultScore').innerText = currentScore.toLocaleString();
      document.getElementById('resultCoinsText').innerText = currentCoins.toLocaleString();
      document.getElementById('modalGameOver').classList.remove('hidden');
    }

    function removeFruitBodies(bodiesToRemove, multiplier = 1, isSkillSource = false) {
      if (!bodiesToRemove || bodiesToRemove.length === 0) return;

      const canvasRect = canvasContainer.getBoundingClientRect();
      const scaleX = canvasRect.width / width;
      const scaleY = canvasRect.height / height;

      bodiesToRemove.forEach(b => {
        if (!b.customFruit) return;

        const fType = b.customFruit.type;
        const skillId = state.pairAssignments[fType];
        const skillInfo = skillId ? state.ownedSkills[skillId] : null;
        const skillLv = skillInfo ? skillInfo.level : 1;

        // Base reward formula (LV scaling)
        const earnedCoins = Math.round(1 * (1 + (skillLv - 1) * 0.5) * multiplier);
        const earnedScore = Math.round(100 * (1 + (skillLv - 1) * 0.25) * multiplier);

        currentCoins += earnedCoins;
        currentScore += earnedScore;

        // Visual Absorption (Scaled screen positions)
        const screenX = canvasRect.left + (b.position.x * scaleX);
        const screenY = canvasRect.top + (b.position.y * scaleY);
        spawnAbsorbEffect(screenX, screenY, false);
        spawnAbsorbEffect(screenX, screenY, true);

        // Skill Charge Increment (If not during Charge Fruit auto-clear)
        if (!isSkillSource && skillId && SKILL_MASTERS[skillId]) {
          const maxCharge = SKILL_MASTERS[skillId].maxCharge;
          if (skillCharges[fType] < maxCharge) {
            skillCharges[fType] = Math.min(maxCharge, skillCharges[fType] + 1);
            updateSkillButtonUI(fType);
          }
        }

        // Charge Fruit Skill Counter
        if (chargeFruitActive) {
          chargeCount++;
          const badge = document.getElementById('chargeCountBadge');
          if (badge) badge.innerText = chargeCount;
        }

        // Physics World Removal
        Matter.World.remove(world, b);
        const idx = fruitBodies.indexOf(b);
        if (idx !== -1) fruitBodies.splice(idx, 1);
      });

      document.getElementById('gameScore').innerText = currentScore.toLocaleString();
      document.getElementById('gameCoins').innerText = currentCoins.toLocaleString();
      refillFruits();
    }

    canvasContainer.addEventListener('pointerdown', (e) => {
      if (!gameActive) return;

      const { x: clickX, y: clickY } = getCanvasCoordinates(e);

      // Samurai slash mode interaction
      if (activeSamuraiMode) {
        handleSamuraiSlash(clickX, clickY);
        return;
      }

      // Find tapped body with generous radius padding (+12px) for easy touch
      const tappedBody = fruitBodies.find(b => {
        if (!b.customFruit) return false;
        const dist = Math.hypot(b.position.x - clickX, b.position.y - clickY);
        return dist <= FRUITS[b.customFruit.type].radius + 12;
      });

      if (!tappedBody) return;

      // Check if Bomb Fruit
      if (tappedBody.customFruit.isBomb) {
        triggerBombExplosion(tappedBody);
        return;
      }

      // Check if Chained Fruit
      if (tappedBody.customFruit.isChained) {
        const chainedGroup = fruitBodies.filter(b => b.customFruit && b.customFruit.isChained && b.customFruit.type === tappedBody.customFruit.type);
        removeFruitBodies(chainedGroup);
        return;
      }

      // Normal Tap Clear
      removeFruitBodies([tappedBody]);
    });

    // Pointer Drag for Samurai Time
    let isDragging = false;
    let lastPoint = null;

    canvasContainer.addEventListener('pointerdown', () => { isDragging = true; lastPoint = null; });
    window.addEventListener('pointerup', () => { isDragging = false; lastPoint = null; });

    canvasContainer.addEventListener('pointermove', (e) => {
      if (!gameActive || !activeSamuraiMode || !isDragging) return;
      const currentPoint = getCanvasCoordinates(e);

      if (lastPoint) {
        drawSlashLine(lastPoint.x, lastPoint.y, currentPoint.x, currentPoint.y);
        sliceFruitsAlongLine(lastPoint, currentPoint);
      }
      lastPoint = currentPoint;
    });

    function drawSlashLine(x1, y1, x2, y2) {
      slashCtx.strokeStyle = '#f43f5e';
      slashCtx.lineWidth = 6;
      slashCtx.lineCap = 'round';
      slashCtx.beginPath();
      slashCtx.moveTo(x1, y1);
      slashCtx.lineTo(x2, y2);
      slashCtx.stroke();

      setTimeout(() => {
        slashCtx.clearRect(0, 0, width, height);
      }, 150);
    }

    function sliceFruitsAlongLine(p1, p2) {
      const sliced = fruitBodies.filter(b => {
        if (!b.customFruit) return false;
        return lineIntersectsCircle(p1, p2, b.position, FRUITS[b.customFruit.type].radius + 5);
      });
      removeFruitBodies(sliced);
    }

    function lineIntersectsCircle(p1, p2, c, r) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy);
      if (len === 0) return false;
      const u = ((c.x - p1.x) * dx + (c.y - p1.y) * dy) / (len * len);
      const clampedU = Math.max(0, Math.min(1, u));
      const nearestX = p1.x + clampedU * dx;
      const nearestY = p1.y + clampedU * dy;
      return Math.hypot(c.x - nearestX, c.y - nearestY) <= r;
    }

    function renderInGameSkillButtons() {
      const deck = document.getElementById('inGameSkillButtons');
      deck.innerHTML = '';

      Object.keys(FRUITS).forEach(fKey => {
        const fruit = FRUITS[fKey];
        const skillId = state.pairAssignments[fKey];
        const skill = skillId ? SKILL_MASTERS[skillId] : null;

        const btn = document.createElement('button');
        btn.id = `skillBtn_${fKey}`;
        btn.className = "relative bg-slate-900 border-2 border-slate-700 rounded-xl p-2 flex flex-col items-center justify-center transition disabled:opacity-50 overflow-hidden";
        btn.disabled = true;

        if (skill) {
          btn.innerHTML = `
            <div class="text-xs text-purple-300 font-bold truncate max-w-full mb-1">${skill.name}</div>
            <div class="relative w-10 h-10 rounded-xl bg-gradient-to-br ${skill.bg} flex items-center justify-center text-white text-lg shadow">
              <i class="fas ${skill.icon}"></i>
              <span class="absolute -bottom-1 -right-1 text-xs">${fruit.emoji}</span>
            </div>
            <!-- Progress Overlay -->
            <div id="chargeBar_${fKey}" class="absolute bottom-0 left-0 right-0 bg-amber-500/30 h-1 transition-all"></div>
            <div id="chargeBadge_${fKey}" class="text-[10px] text-amber-300 font-bold mt-1">0/${skill.maxCharge}</div>

          btn.innerHTML = `

              ${fruit.emoji}
            </div>

    function updateSkillButtonUI(fKey) {
      const skillId = state.pairAssignments[fKey];
      if (!skillId) return;
      const skill = SKILL_MASTERS[skillId];
      const cur = skillCharges[fKey];
      const max = skill.maxCharge;

      const btn = document.getElementById(`skillBtn_${fKey}`);
      const bar = document.getElementById(`chargeBar_${fKey}`);
      const badge = document.getElementById(`chargeBadge_${fKey}`);

      if (bar) bar.style.height = `${Math.min(100, (cur / max) * 100)}%`;
      if (badge) badge.innerText = `${cur}/${max}`;

      if (cur >= max) {
        btn.disabled = false;
        btn.classList.add('border-amber-400', 'pulse-glow');
      } else {
        btn.disabled = true;
        btn.classList.remove('border-amber-400', 'pulse-glow');
      }
    }

    function useSkill(fKey, skillId) {
      if (!gameActive || skillCharges[fKey] < SKILL_MASTERS[skillId].maxCharge) return;

      // Consume Charge
      skillCharges[fKey] = 0;
      updateSkillButtonUI(fKey);

      switch (skillId) {
        case 'bomber':
          // Convert matching fruit pair into bombs
          fruitBodies.forEach(b => {
            if (b.customFruit && b.customFruit.type === fKey) {
              b.customFruit.isBomb = true;
            }
          });
          break;

        case 'chain':
          // Mark matching fruit pair as chained
          fruitBodies.forEach(b => {
            if (b.customFruit && b.customFruit.type === fKey) {
              b.customFruit.isChained = true;
            }
          });
          break;

        case 'time':
          // +5 seconds timer
          gameTimer = Math.min(60, gameTimer + 5);
          document.getElementById('gameTimer').innerText = gameTimer;
          showFlashMessage('+5 SECONDS!');
          break;

        case 'sword':
          // Cut horizontal middle
          triggerSwordCut();
          break;

        case 'small_bomb':
          // Spawn 5 small falling bombs
          spawnSmallBombs();
          break;

        case 'samurai':
          // 3s Samurai Mode
          activateSamuraiMode();
          break;

        case 'roulette':
          // Open Roulette Modal
          openRouletteModal();
          break;

        case 'charge':
          // Charge Fruit 5s accumulator
          activateChargeFruitSkill(fKey);
          break;
      }
    }

    // ① Bomber Explosion Chain Logic
    function triggerBombExplosion(bombBody) {
      const bombPos = { ...bombBody.position };
      const radius = 110;

      // Find all fruits in radius
      const explodedGroup = fruitBodies.filter(b => {
        if (!b.customFruit) return false;
        const dist = Math.hypot(b.position.x - bombPos.x, b.position.y - bombPos.y);
        return dist <= radius;
      });

      // Visual Shockwave
      createExplosionVisual(bombPos.x, bombPos.y);

      // Recursive Bomb Chain Check
      const chainedBombs = explodedGroup.filter(b => b.customFruit.isBomb && b !== bombBody);

      removeFruitBodies(explodedGroup);

      // Trigger recursive explosions
      chainedBombs.forEach(cb => {
        setTimeout(() => triggerBombExplosion(cb), 100);
      });
    }

    function createExplosionVisual(x, y) {
      const el = document.createElement('div');
      el.className = 'absolute rounded-full pointer-events-none z-40 border-4 border-amber-400 bg-orange-500/40 animate-ping';
      el.style.width = '160px';
      el.style.height = '160px';
      el.style.left = (x - 80) + 'px';
      el.style.top = (y - 80) + 'px';
      canvasContainer.appendChild(el);
      setTimeout(() => el.remove(), 400);
    }

    // ④ Sword Cut Skill
    function triggerSwordCut() {
      const cutY = height / 2;
      const el = document.createElement('div');
      el.className = 'slice-effect w-full';
      el.style.top = (cutY - 4) + 'px';
      canvasContainer.appendChild(el);

      const hitFruits = fruitBodies.filter(b => {
        if (!b.customFruit) return false;
        return Math.abs(b.position.y - cutY) < 40;
      });

      setTimeout(() => {
        el.remove();
        removeFruitBodies(hitFruits, 1.2);
      }, 150);
    }

    // ⑤ Small Bomb Skill
    function spawnSmallBombs() {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          if (!gameActive) return;
          const bomb = Matter.Bodies.circle(
            Math.random() * (width - 60) + 30,
            -20,
            16,
            { restitution: 0.6, density: 0.005 }
          );
          bomb.customBomb = true;
          Matter.World.add(world, bomb);

          // Collision event to explode
          const checkCollision = setInterval(() => {
            if (!gameActive) { clearInterval(checkCollision); return; }
            const fruitsNear = fruitBodies.filter(fb => {
              if (!fb.customFruit) return false;
              return Math.hypot(fb.position.x - bomb.position.x, fb.position.y - bomb.position.y) < 35;
            });

            if (fruitsNear.length > 0 || bomb.position.y > height - 30) {
              clearInterval(checkCollision);
              createExplosionVisual(bomb.position.x, bomb.position.y);
              Matter.World.remove(world, bomb);
              removeFruitBodies(fruitsNear);
            }
          }, 50);

        }, i * 120);
      }
    }

    // ⑥ Samurai Mode
    function activateSamuraiMode() {
      activeSamuraiMode = true;
      showFlashMessage('SAMURAI TIME!');
      canvasContainer.classList.add('cursor-crosshair');

      if (samuraiTimer) clearTimeout(samuraiTimer);
      samuraiTimer = setTimeout(() => {
        activeSamuraiMode = false;
        canvasContainer.classList.remove('cursor-crosshair');
      }, 3000);
    }

    // ⑦ Roulette Skill
    function openRouletteModal() {
      const modal = document.getElementById('modalRoulette');
      modal.classList.remove('hidden');

      const countDisp = document.getElementById('rouletteCountDisplay');
      const multDisp = document.getElementById('rouletteMultDisplay');
      const btn = document.getElementById('btnStartRoulette');

      countDisp.innerText = '?';
      multDisp.innerText = '?';
      btn.disabled = false;

      btn.onclick = () => {
        btn.disabled = true;

        const counts = [5, 10, 15, 20, 30, 40];
        const mults = [1, 1.2, 1.5, 2, 5, 10];

        // Animate Step 1: Count
        let cTicks = 0;
        const cInterval = setInterval(() => {
          countDisp.innerText = counts[Math.floor(Math.random() * counts.length)] + '個';
          cTicks++;
          if (cTicks > 15) {
            clearInterval(cInterval);
            const finalCount = counts[Math.floor(Math.random() * counts.length)];
            countDisp.innerText = finalCount + '個';

            // Animate Step 2: Multiplier
            let mTicks = 0;
            const mInterval = setInterval(() => {
              multDisp.innerText = 'x' + mults[Math.floor(Math.random() * mults.length)];
              mTicks++;
              if (mTicks > 15) {
                clearInterval(mInterval);
                const finalMult = mults[Math.floor(Math.random() * mults.length)];
                multDisp.innerText = 'x' + finalMult;

                // Perform Elimination after 1 second delay
                setTimeout(() => {
                  modal.classList.add('hidden');
                  const targetFruits = [...fruitBodies].sort(() => 0.5 - Math.random()).slice(0, finalCount);
                  removeFruitBodies(targetFruits, finalMult);
                }, 800);
              }
            }, 80);
          }
        }, 80);
      };
    }

    // ⑧ Charge Fruit Skill
    function activateChargeFruitSkill(fKey) {
      chargeFruitActive = true;
      chargeCount = 0;

      const btn = document.getElementById(`skillBtn_${fKey}`);
      const badge = document.createElement('div');
      badge.id = 'chargeCountBadge';
      badge.className = 'absolute -top-2 -right-2 bg-pink-600 text-white font-black text-xs px-2 py-0.5 rounded-full shadow border border-white animate-bounce';
      badge.innerText = '0';
      btn.appendChild(badge);

      setTimeout(() => {
        chargeFruitActive = false;
        if (badge) badge.remove();

        // Clear chargeCount amount of fruits
        const toClear = [...fruitBodies].slice(0, chargeCount);
        removeFruitBodies(toClear, 1.0, true);
      }, 5000);
    }

    function showFlashMessage(text) {

      msg.className = 'absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-3xl font-black text-amber-300 bg-slate-900/90 border-2 border-amber-400 px-6 py-2 rounded-2xl shadow-2xl z-50 animate-bounce pointer-events-none';
      msg.innerText = text;

    function renderSkillMenu() {
      // 1. Pair Assignment Dropdowns
      const pairList = document.getElementById('pairAssignList');
      pairList.innerHTML = '';

      Object.keys(FRUITS).forEach(fKey => {
        const fruit = FRUITS[fKey];
        const currentSkill = state.pairAssignments[fKey];

        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-800';
        row.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="text-2xl">${fruit.emoji}</span>
            <span class="text-sm font-bold text-white">${fruit.name}</span>
          </div>
          <select id="select_${fKey}" class="bg-slate-800 text-amber-300 font-bold text-xs p-2 rounded-lg border border-purple-500/40 focus:outline-none">
            <option value="">(なし)</option>
            ${Object.keys(state.ownedSkills).map(sId => {
              const master = SKILL_MASTERS[sId];
              const selected = currentSkill === sId ? 'selected' : '';
              return `<option value="${sId}" ${selected}>${master.name} (Lv.${state.ownedSkills[sId].level})</option>`;
            }).join('')}
          </select>
        `;
        pairList.appendChild(row);

        document.getElementById(`select_${fKey}`).addEventListener('change', (e) => {
          state.pairAssignments[fKey] = e.target.value || null;
          saveSaveData();
          updateUI();
        });
      });

      // 2. Owned Skills & Upgrades
      const ownedList = document.getElementById('ownedSkillsList');
      ownedList.innerHTML = '';

      Object.keys(state.ownedSkills).forEach(sId => {
        const master = SKILL_MASTERS[sId];
        const skill = state.ownedSkills[sId];
        const cost = 1000 + (skill.level - 1) * 500;
        const canAfford = state.coins >= cost;

        const card = document.createElement('div');
        card.className = 'bg-slate-900 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between';
        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${master.bg} flex items-center justify-center text-white text-xl shadow">
              <i class="fas ${master.icon}"></i>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="text-sm font-black text-white">${master.name}</span>
                <span class="bg-purple-900/80 text-purple-300 text-[10px] px-2 py-0.5 rounded-full font-bold">Lv.${skill.level}</span>
              </div>
              <div class="text-[11px] text-slate-400 mt-0.5 max-w-[180px]">${master.desc}</div>
            </div>
          </div>
          <button id="btnUpgrade_${sId}" ${canAfford ? '' : 'disabled'} class="px-3 py-2 bg-amber-500 hover:bg-amber-400 disabled:bg-slate-800 disabled:text-slate-600 text-slate-950 font-black text-xs rounded-xl transition flex flex-col items-center">
            <span>強化</span>
            <span class="text-[9px]">${cost} G</span>
          </button>
        `;
        ownedList.appendChild(card);

        const upBtn = document.getElementById(`btnUpgrade_${sId}`);
        if (upBtn && canAfford) {
          upBtn.onclick = () => {
            state.coins -= cost;
            skill.level++;
            saveSaveData();
            updateUI();
            renderSkillMenu();
          };
        }
      });
    }

    // Gacha Handler
    document.getElementById('btnGacha').addEventListener('click', () => {
      if (state.coins < 2000) {
        showFlashMessage('コインが不足しています');
        return;
      }

      state.coins -= 2000;
      saveSaveData();
      updateUI();

      // Show Gacha Anim Modal
      const modal = document.getElementById('modalGachaAnim');
      const box = document.getElementById('gachaEffectBox');
      const title = document.getElementById('gachaTitle');
      const result = document.getElementById('gachaResult');

      modal.classList.remove('hidden');
      box.classList.remove('hidden');
      result.classList.add('hidden');
      title.innerText = 'フルーツ大爆発...!?';

      // Pick Random Skill
      const allSkillIds = Object.keys(SKILL_MASTERS);
      const rewardId = allSkillIds[Math.floor(Math.random() * allSkillIds.length)];
      const isNew = !state.ownedSkills[rewardId];

      if (isNew) {
        state.ownedSkills[rewardId] = { level: 1 };
      } else {
        state.ownedSkills[rewardId].level++;
      }
      saveSaveData();

      setTimeout(() => {
        box.classList.add('hidden');
        title.innerText = isNew ? '🎉 NEW SKILL GET!! 🎉' : '✨ SKILL LEVEL UP! ✨';
        result.classList.remove('hidden');

        const master = SKILL_MASTERS[rewardId];
        const iconBox = document.getElementById('gachaSkillIcon');
        iconBox.className = `w-20 h-20 rounded-2xl bg-gradient-to-br ${master.bg} flex items-center justify-center text-4xl mb-2 text-white shadow-lg`;
        iconBox.innerHTML = `<i class="fas ${master.icon}"></i>`;

        document.getElementById('gachaSkillName').innerText = `${master.name} (Lv.${state.ownedSkills[rewardId].level})`;
        document.getElementById('gachaSkillDesc').innerText = master.desc;
      }, 1800);
    });

    document.getElementById('btnCloseGacha').onclick = () => {
      document.getElementById('modalGachaAnim').classList.add('hidden');
      renderSkillMenu();
    };

    document.getElementById('btnStartGame').onclick = startGame;

    document.getElementById('btnOpenSkillMenu').onclick = () => {
      renderSkillMenu();
      document.getElementById('screenSkill').classList.remove('hidden');
    };

    document.getElementById('btnCloseSkillMenu').onclick = () => {
      document.getElementById('screenSkill').classList.add('hidden');
      updateUI();
    };

    document.getElementById('btnHighScore').onclick = () => {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      if (state.scoreHistory.length === 0) {
        list.innerHTML = '<div class="text-slate-500 text-center py-4">履歴がありません</div>';
      } else {
        state.scoreHistory.forEach((h, idx) => {
          const item = document.createElement('div');
          item.className = 'bg-slate-800 p-2.5 rounded-lg flex justify-between items-center';
          item.innerHTML = `
            <div>
              <div class="text-xs text-slate-400">#${idx + 1} - ${h.date}</div>
              <div class="text-amber-300 font-bold">${h.score.toLocaleString()} pts</div>
            </div>
            <div class="text-xs text-amber-400 font-bold">+${h.coins} 🪙</div>
          `;
          list.appendChild(item);
        });
      }
      document.getElementById('modalHistory').classList.remove('hidden');
    };

    document.getElementById('btnCloseHistory').onclick = () => {
      document.getElementById('modalHistory').classList.add('hidden');
    };

    document.getElementById('btnFinishGame').onclick = () => {
      document.getElementById('modalGameOver').classList.add('hidden');
      document.getElementById('screenGame').classList.add('hidden');
      document.getElementById('mainHeader').classList.remove('hidden');
      document.getElementById('screenHome').classList.remove('hidden');
    };

    // Window Load Bootstrap
    window.onload = function () {
      loadSaveData();
      updateUI();
    };
  </script>
</body>
</html>
