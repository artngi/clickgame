<script>
/* ==========================================================================
   GAME ENGINE & CONFIGURATION

// Audio Synthesizer (Web Audio API) for dopamine SFX without external assets
class SoundFX {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    playHit() {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }

    playDodge() {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
    }

    playUlt() {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
    }

    playShoot() {
        if(this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
    }
}
const sfx = new SoundFX();

// Characters Data Definition
const CHARACTERS = [

        icon: 'fa-shuttle-space',
        shootStyle: 'spread'

// Skills List (5 Passives, 5 Actives)

    passives: [

    ],

        { id: 'a_teleport', name: 'フラッシュ', desc: '画面中央上部に一瞬でテレポートし、弾幕から離脱', cd: 10, icon: 'fa-bolt-lightning' },

/* ==========================================================================

   ========================================================================== */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let screenWidth = window.innerWidth;
let screenHeight = window.innerHeight;

    screenHeight = window.innerHeight;

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Game Logic Variables
let isPlaying = false;
let score = 0;
let combo = 0;
let maxCombo = 0;
let dodgeCount = 0;

// Player State

    char: CHARACTERS[0],

// Enemy Boss State
let boss = {

};

// Game Entities
let playerBullets = [];
let enemyBullets = [];
let particles = [];
let floatingTexts = [];

// Virtual Joystick State
let joystick = {
    active: false,
    startX: 0,
    startY: 0,
    currX: 0,
    currY: 0,
    dx: 0,
    dy: 0,
    maxLen: 45
};

// Slow motion modifier for Active Skill: Chronosis
let timeDilation = 1.0;
let timeStopTimer = 0;

/* ==========================================================================
   USER INTERFACE & BUILD SYSTEM
   ========================================================================== */

let selectedCharIndex = 0;
let selectingSlotType = null; // 'passive0', 'passive1', 'active0', 'active1'

function initMenuUI() {
    // Render Characters
    const charContainer = document.getElementById('charSelectContainer');
    charContainer.innerHTML = '';
    CHARACTERS.forEach((char, index) => {
        const btn = document.createElement('div');
        btn.className = `p-3 rounded-xl border-2 flex flex-col items-center gap-1 cursor-pointer transition-all ${
            selectedCharIndex === index ? 'border-pink-500 bg-pink-500/10 glow-box' : 'border-gray-800 bg-gray-900/60'
        }`;
        btn.innerHTML = `
            <i class="fa-solid ${char.icon} text-2xl" style="color: ${char.color}"></i>
            <div class="font-bold text-sm">${char.name}</div>
            <div class="text-[10px] text-gray-400 text-center leading-tight mt-1">${char.desc}</div>
        `;
        btn.onclick = () => {
            selectedCharIndex = index;
            player.char = CHARACTERS[index];
            initMenuUI();
        };
        charContainer.appendChild(btn);
    });

    // Render Skill Slots
    const renderSlot = (slotId, skillId, type) => {
        const list = type === 'passive' ? SKILLS.passives : SKILLS.actives;
        const skill = list.find(s => s.id === skillId) || list[0];
        return `
            <div onclick="openSkillModal('${slotId}')" class="bg-gray-900/80 border border-gray-700 hover:border-cyan-400 p-2.5 rounded-lg flex items-center gap-3 cursor-pointer">
                <i class="fa-solid ${skill.icon} text-lg text-cyan-400"></i>
                <div class="overflow-hidden">
                    <div class="text-xs font-bold text-white truncate">${skill.name}</div>
                    <div class="text-[10px] text-gray-400 truncate">${skill.desc}</div>
                </div>
            </div>
        `;
    };

    document.getElementById('passiveSlots').innerHTML = 
        renderSlot('passive0', player.passives[0], 'passive') +
        renderSlot('passive1', player.passives[1], 'passive');

    document.getElementById('activeSlots').innerHTML = 
        renderSlot('active0', player.actives[0].id, 'active') +
        renderSlot('active1', player.actives[1].id, 'active');
}

function openSkillModal(slotType) {
    selectingSlotType = slotType;
    const modal = document.getElementById('skillModal');
    const listContainer = document.getElementById('modalList');
    const isPassive = slotType.startsWith('passive');

    document.getElementById('modalTitle').innerText = isPassive ? 'パッシブスキルを選択' : 'アクティブスキルを選択';
    listContainer.innerHTML = '';

    const skillList = isPassive ? SKILLS.passives : SKILLS.actives;
    skillList.forEach(sk => {
        const item = document.createElement('div');
        item.className = 'bg-gray-900 border border-gray-800 hover:border-purple-500 p-3 rounded-lg flex items-center gap-3 cursor-pointer';
        item.innerHTML = `
            <i class="fa-solid ${sk.icon} text-xl text-purple-400"></i>
            <div>
                <div class="text-sm font-bold text-white">${sk.name}</div>
                <div class="text-xs text-gray-400">${sk.desc}</div>
            </div>
        `;
        item.onclick = () => {
            if (slotType === 'passive0') player.passives[0] = sk.id;
            if (slotType === 'passive1') player.passives[1] = sk.id;
            if (slotType === 'active0') player.actives[0].id = sk.id;
            if (slotType === 'active1') player.actives[1].id = sk.id;
            modal.classList.add('hidden');
            initMenuUI();
        };
        listContainer.appendChild(item);
    });

    modal.classList.remove('hidden');
}

document.getElementById('btnCloseModal').onclick = () => {

};

/* ==========================================================================
   INPUT CONTROLS (JOYSTICK & BUTTONS)
   ========================================================================== */

const joyZone = document.getElementById('joystickZone');
const joyStick = document.getElementById('joyStick');

joyZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = joyZone.getBoundingClientRect();
    joystick.active = true;
    joystick.startX = rect.left + rect.width / 2;
    joystick.startY = rect.top + rect.height / 2;
    updateJoystick(touch.clientX, touch.clientY);
}, { passive: false });

window.addEventListener('touchmove', (e) => {
    if (!joystick.active) return;
    const touch = e.touches[0];
    updateJoystick(touch.clientX, touch.clientY);
}, { passive: false });

window.addEventListener('touchend', () => {
    joystick.active = false;
    joystick.dx = 0;
    joystick.dy = 0;
    joyStick.style.transform = `translate(-50%, -50%)`;
});

function updateJoystick(clientX, clientY) {
    let dx = clientX - joystick.startX;
    let dy = clientY - joystick.startY;
    let dist = Math.hypot(dx, dy);

    if (dist > joystick.maxLen) {
        dx = (dx / dist) * joystick.maxLen;
        dy = (dy / dist) * joystick.maxLen;
    }

    joystick.dx = dx / joystick.maxLen;
    joystick.dy = dy / joystick.maxLen;

    joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

// Mouse Controls Fallback for PC/Testing
let isMouseDown = false;
window.addEventListener('mousedown', (e) => {
    if(!isPlaying) return;
    if(e.clientX < screenWidth / 2 && e.clientY > screenHeight / 2) {
        isMouseDown = true;
        joystick.startX = e.clientX;
        joystick.startY = e.clientY;
        joystick.active = true;
    }
});
window.addEventListener('mousemove', (e) => {
    if(isMouseDown && joystick.active) {
        updateJoystick(e.clientX, e.clientY);
    }
});
window.addEventListener('mouseup', () => {
    isMouseDown = false;
    joystick.active = false;
    joystick.dx = 0;
    joystick.dy = 0;
    joyStick.style.transform = `translate(-50%, -50%)`;
});

// Action Buttons
document.getElementById('btnDodge').onclick = triggerExtremeDodge;
document.getElementById('btnUlt').onclick = triggerUltimate;
document.getElementById('btnActive1').onclick = () => triggerActiveSkill(0);
document.getElementById('btnActive2').onclick = () => triggerActiveSkill(1);

/* ==========================================================================
   GAMEPLAY MECHANICS & SKILLS LOGIC
   ========================================================================== */

function triggerExtremeDodge() {
    if (player.dodgeCooldown > 0 || !isPlaying) return;

    let dodgeDuration = 0.8; // default 0.8s invincibility
    if (player.passives.includes('p_phantom')) dodgeDuration += 0.5;

    player.dodgeTimer = dodgeDuration;
    player.invincibleTimer = dodgeDuration;
    player.dodgeCooldown = player.maxDodgeCooldown;

    sfx.playDodge();
    spawnNotification("極限回避 (EXTREME DODGE)", "#38bdf8");

    // Passive: Vampire
    if (player.passives.includes('p_vampire') && Math.random() < 0.25) {
        if (player.hp < player.maxHp) {
            player.hp++;
            updateHpUI();
            spawnNotification("HP回復 +1", "#22c55e");
        }
    }

    // Passive: Counter Nova
    if (player.passives.includes('p_counter')) {
        let cleared = 0;
        enemyBullets = enemyBullets.filter(b => {
            let d = Math.hypot(b.x - player.x, b.y - player.y);
            if (d < 180) {
                cleared++;
                spawnParticles(b.x, b.y, b.color, 4);
                return false;
            }
            return true;
        });
        if (cleared > 0) addScore(cleared * 200, "カウンター波");
    }

    // Passive: Overcharge
    let ultGain = 25;
    if (player.passives.includes('p_overcharge')) ultGain *= 1.8;
    addUltGauge(ultGain);

    dodgeCount++;
    addScore(1000, "極限回避 SUCCESS");
}

function triggerUltimate() {
    if (player.ultGauge < 100 || !isPlaying) return;

    player.ultGauge = 0;
    sfx.playUlt();
    spawnNotification("能力過解放 (OVERDRIVE RAVE)", "#a855f7");

    // Clear all enemy bullets
    let count = enemyBullets.length;
    enemyBullets.forEach(b => spawnParticles(b.x, b.y, '#f43f5e', 3));
    enemyBullets = [];

    // Damage Boss & Massive particles
    boss.hp -= 1500;
    for (let i = 0; i < 60; i++) {
        particles.push({
            x: screenWidth / 2 + (Math.random() - 0.5) * 300,
            y: screenHeight / 2 + (Math.random() - 0.5) * 300,
            vx: (Math.random() - 0.5) * 15,
            vy: (Math.random() - 0.5) * 15,
            radius: Math.random() * 6 + 2,
            color: ['#a855f7', '#ec4899', '#38bdf8'][Math.floor(Math.random() * 3)],
            life: 1.0
        });
    }

    addScore(5000 + count * 100, "全弾清算 OVERKILL");
}

function triggerActiveSkill(index) {
    let act = player.actives[index];
    if (act.cdTimer > 0 || !isPlaying) return;

    const skillDef = SKILLS.actives.find(s => s.id === act.id);
    act.cdTimer = skillDef.cd;

    if (act.id === 'a_time_stop') {
        timeStopTimer = 3.0;
        timeDilation = 0.2;
        spawnNotification("クロノシス (TIME SLOW)", "#60a5fa");
    } else if (act.id === 'a_shield') {
        player.shieldActive = true;
        spawnNotification("イージスバリア (SHIELD)", "#34d399");
    } else if (act.id === 'a_clear_ring') {
        enemyBullets = enemyBullets.filter(b => {
            let d = Math.hypot(b.x - player.x, b.y - player.y);
            if(d < 150) {
                spawnParticles(b.x, b.y, '#38bdf8', 3);
                return false;
            }
            return true;
        });
        spawnNotification("パルスブラスト", "#38bdf8");
    } else if (act.id === 'a_teleport') {
        player.x = screenWidth / 2;
        player.y = 120;
        player.invincibleTimer = 1.0;
        spawnParticles(player.x, player.y, '#f472b6', 15);
        spawnNotification("フラッシュワープ", "#f472b6");
    } else if (act.id === 'a_frenzy') {
        player.frenzyTimer = 5.0;
        spawnNotification("オーバードライブ!", "#f59e0b");
    }
}

/* ==========================================================================
   BULLET PATTERNS (東方 & UNDERTALE INSPIRED)
   ========================================================================== */

let bulletTimer = 0;

function updateBossPatterns(dt) {
    boss.timer += dt;
    boss.moveAngle += dt * 0.8;
    
    // Boss floating movement
    boss.x = screenWidth / 2 + Math.sin(boss.moveAngle) * (screenWidth * 0.3);
    boss.y = screenHeight * 0.2 + Math.cos(boss.moveAngle * 1.5) * 30;

    // Pattern Selector based on boss HP Phase
    bulletTimer += dt * timeDilation;

    if (bulletTimer > 0.08) {
        bulletTimer = 0;

        // Phase 0: Touhou Style Spiral & Ring Attacks
        if (boss.hp > 7000) {
            let count = 12;
            let baseAngle = boss.timer * 2;
            for (let i = 0; i < count; i++) {
                let angle = baseAngle + (i * Math.PI * 2 / count);
                enemyBullets.push({
                    x: boss.x,
                    y: boss.y,
                    vx: Math.cos(angle) * 3.5,
                    vy: Math.sin(angle) * 3.5,
                    radius: 5,
                    color: '#ec4899',
                    type: 'normal'
                });
            }
        }
        // Phase 1: Undertale Style Laser / Grid & Dense Flower Wave
        else if (boss.hp > 3500) {
            let angle = Math.sin(boss.timer * 3) * Math.PI;
            enemyBullets.push({
                x: boss.x,
                y: boss.y,
                vx: Math.cos(angle) * 5,
                vy: Math.sin(angle) * 5,
                radius: 4,
                color: '#38bdf8',
                type: 'normal'
            });
            
            // Aimed target shot
            if (Math.random() < 0.3) {
                let aimAngle = Math.atan2(player.y - boss.y, player.x - boss.x);
                enemyBullets.push({
                    x: boss.x,
                    y: boss.y,
                    vx: Math.cos(aimAngle) * 6,
                    vy: Math.sin(aimAngle) * 6,
                    radius: 7,
                    color: '#f59e0b',
                    type: 'aimed'
                });
            }
        }
        // Phase 2: Ultimate Dopamine Chaos Patterns
        else {
            let count = 8;
            let baseAngle = Math.random() * Math.PI * 2;
            for (let i = 0; i < count; i++) {
                let angle = baseAngle + (i * Math.PI * 2 / count);
                let speed = 2 + Math.random() * 4;
                enemyBullets.push({
                    x: boss.x,
                    y: boss.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 4.5,
                    color: i % 2 === 0 ? '#a855f7' : '#10b981',
                    type: 'accelerating'
                });
            }
        }
    }
}

/* ==========================================================================
   GAME LOOP & RENDERING
   ========================================================================== */

function gameLoop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; // Cap delta time
    lastTime = timestamp;

    if (isPlaying) {
        update(dt);
    }
    render();

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    // Timers
    if (timeStopTimer > 0) {
        timeStopTimer -= dt;
        if (timeStopTimer <= 0) timeDilation = 1.0;
    }
    if (player.invincibleTimer > 0) player.invincibleTimer -= dt;
    if (player.dodgeTimer > 0) player.dodgeTimer -= dt;
    if (player.frenzyTimer > 0) player.frenzyTimer -= dt;

    if (player.dodgeCooldown > 0) {
        player.dodgeCooldown -= dt;
        if (player.dodgeCooldown < 0) player.dodgeCooldown = 0;
    }

    player.actives.forEach((act, idx) => {
        if (act.cdTimer > 0) {
            act.cdTimer -= dt;
            if (act.cdTimer < 0) act.cdTimer = 0;
        }
    });

    // Player Movement via Joystick
    if (joystick.active) {
        player.x += joystick.dx * player.speed;
        player.y += joystick.dy * player.speed;

        // Canvas Boundary Constraints
        player.x = Math.max(player.radius, Math.min(screenWidth - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(screenHeight - player.radius, player.y));
    }

    // Player Automatic Shooting
    let shootInterval = player.frenzyTimer > 0 ? 0.05 : 0.12;
    player.shootTimer = (player.shootTimer || 0) + dt;
    if (player.shootTimer >= shootInterval) {
        player.shootTimer = 0;
        sfx.playShoot();

        if (player.char.shootStyle === 'laser') {
            playerBullets.push({ x: player.x - 6, y: player.y - 10, vx: 0, vy: -14, color: '#38bdf8' });
            playerBullets.push({ x: player.x + 6, y: player.y - 10, vx: 0, vy: -14, color: '#38bdf8' });
        } else {
            // Spread Shot
            [-0.3, -0.15, 0, 0.15, 0.3].forEach(angle => {
                playerBullets.push({
                    x: player.x,
                    y: player.y - 10,
                    vx: Math.sin(angle) * 12,
                    vy: -Math.cos(angle) * 12,
                    color: '#ec4899'
                });
            });
        }
    }

    // Update Player Bullets
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        let b = playerBullets[i];
        b.x += b.vx;
        b.y += b.vy;

        // Check Boss Collision
        let d = Math.hypot(b.x - boss.x, b.y - boss.y);
        if (d < boss.radius) {
            boss.hp -= player.frenzyTimer > 0 ? 35 : 12;
            addUltGauge(0.4);
            addScore(20);
            spawnParticles(b.x, b.y, b.color, 2);
            playerBullets.splice(i, 1);
            continue;
        }

        if (b.y < -20 || b.x < -20 || b.x > screenWidth + 20) {
            playerBullets.splice(i, 1);
        }
    }

    // Update Boss & Enemy Bullets
    updateBossPatterns(dt);

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let b = enemyBullets[i];
        b.x += b.vx * timeDilation;
        b.y += b.vy * timeDilation;

        // Player Collision Check
        let dist = Math.hypot(b.x - player.x, b.y - player.y);
        
        // Grazing / Dodging Detection (Dopamine Trigger)
        if (dist < player.radius + 18 && player.dodgeTimer > 0) {
            // Extreme Dodge Triggered against this bullet
            addScore(150, "GRAZE!");
        }

        if (dist < player.hitboxRadius + b.radius) {
            if (player.shieldActive) {
                player.shieldActive = false;
                spawnNotification("バリア吸収!", "#34d399");
                enemyBullets.splice(i, 1);
                continue;
            }

            if (player.invincibleTimer <= 0) {
                // Take Damage
                player.hp--;
                sfx.playHit();
                updateHpUI();
                combo = 0;
                updateScoreUI();
                player.invincibleTimer = 1.5; // Invincible iframe after hit
                spawnParticles(player.x, player.y, '#ef4444', 20);

                if (player.hp <= 0) {
                    gameOver(false);
                }
            }
        }

        // Out of bounds cleanup
        if (b.y > screenHeight + 30 || b.y < -30 || b.x < -30 || b.x > screenWidth + 30) {
            enemyBullets.splice(i, 1);
        }
    }

    // Check Boss Defeat
    if (boss.hp <= 0) {
        gameOver(true);
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update Action Buttons CD Display
    updateCooldownsUI();
}

function render() {
    // Clear Screen
    ctx.fillStyle = '#09090b';
    ctx.fillRect(0, 0, screenWidth, screenHeight);

    // Render Grid lines for Cyberpunk vibe
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    let gridSize = 40;
    for (let x = 0; x < screenWidth; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, screenHeight); ctx.stroke();
    }
    for (let y = 0; y < screenHeight; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(screenWidth, y); ctx.stroke();
    }

    if (!isPlaying) return;

    // Render Boss
    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ec4899';
    ctx.fillStyle = '#ec4899';
    ctx.beginPath();
    ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Boss HP Bar Top
    let hpPercent = Math.max(0, boss.hp / boss.maxHp);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(screenWidth * 0.1, 15, screenWidth * 0.8, 6);
    ctx.fillStyle = '#ec4899';
    ctx.fillRect(screenWidth * 0.1, 15, (screenWidth * 0.8) * hpPercent, 6);

    // Render Player Bullets
    playerBullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = b.color;
        ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
    });

    // Render Enemy Bullets
    enemyBullets.forEach(b => {
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    // Render Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // Render Player Ship
    if (player.invincibleTimer <= 0 || Math.floor(performance.now() / 80) % 2 === 0) {
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = player.dodgeTimer > 0 ? '#38bdf8' : player.char.color;

        // Extreme Dodge Aura Effect
        if (player.dodgeTimer > 0) {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius + 12, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Shield Aura Effect
        if (player.shieldActive) {
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius + 16, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Player Ship Triangle Body
        ctx.fillStyle = player.char.color;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.radius - 6);
        ctx.lineTo(player.x - player.radius - 4, player.y + player.radius + 4);
        ctx.lineTo(player.x + player.radius + 4, player.y + player.radius + 4);
        ctx.closePath();
        ctx.fill();

        // Hitbox Center Dot (Red Dot)
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.hitboxRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

/* ==========================================================================
   SCORE & NOTIFICATION HELPERS
   ========================================================================== */

function addScore(val, reason = "") {
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    let multiplier = 1 + Math.floor(combo / 10) * 0.2;
    let added = Math.floor(val * multiplier);
    score += added;

    updateScoreUI();

    if (reason && Math.random() < 0.4) {
        spawnNotification(`${reason} +${added}`, '#facc15');
    }
}

function addUltGauge(val) {
    player.ultGauge = Math.min(100, player.ultGauge + val);
    document.getElementById('ultBar').style.width = `${player.ultGauge}%`;
    document.getElementById('btnUlt').disabled = player.ultGauge < 100;
}

function updateHpUI() {
    const container = document.getElementById('hpContainer');
    container.innerHTML = '';
    for (let i = 0; i < player.maxHp; i++) {
        let heart = document.createElement('i');
        heart.className = `fa-solid fa-heart ${i < player.hp ? 'text-red-500' : 'text-gray-700'}`;
        container.appendChild(heart);
    }
}

function updateScoreUI() {
    document.getElementById('scoreDisplay').innerText = String(score).padStart(7, '0');
    const comboEl = document.getElementById('comboDisplay');
    if (combo > 2) {
        comboEl.classList.remove('opacity-0');
        document.getElementById('comboCount').innerText = combo;
    } else {
        comboEl.classList.add('opacity-0');
    }
}

function updateCooldownsUI() {
    // Dodge CD
    const dodgeCdEl = document.getElementById('dodgeCd');
    if (player.dodgeCooldown > 0) {
        dodgeCdEl.classList.remove('hidden');
        dodgeCdEl.innerText = player.dodgeCooldown.toFixed(1);
    } else {
        dodgeCdEl.classList.add('hidden');
    }

    // Active Skills CD
    player.actives.forEach((act, idx) => {
        const cdEl = document.getElementById(`active${idx + 1}Cd`);
        const iconEl = document.getElementById(`active${idx + 1}Icon`);
        const skillDef = SKILLS.actives.find(s => s.id === act.id);
        if (iconEl) iconEl.className = `fa-solid ${skillDef.icon}`;

        if (act.cdTimer > 0) {
            cdEl.classList.remove('hidden');
            cdEl.innerText = act.cdTimer.toFixed(1);
        } else {
            cdEl.classList.add('hidden');
        }
    });
}

function spawnNotification(text, color = '#ffffff') {
    const container = document.getElementById('notifyContainer');
    const el = document.createElement('div');
    el.className = 'font-black text-sm tracking-wider glow-text animate-bounce my-0.5';
    el.style.color = color;
    el.innerText = text;
    container.appendChild(el);

    setTimeout(() => {
        el.remove();
    }, 1000);
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 4 + 1;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 3 + 1,
            color: color,
            life: 1.0
        });
    }
}

/* ==========================================================================
   GAME FLOW CONTROLS
   ========================================================================== */

function startGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    dodgeCount = 0;
    player.hp = 5;
    player.x = screenWidth / 2;
    player.y = screenHeight * 0.8;
    player.ultGauge = 0;
    player.dodgeCooldown = 0;
    player.actives[0].cdTimer = 0;
    player.actives[1].cdTimer = 0;
    playerBullets = [];
    enemyBullets = [];
    particles = [];

    boss.hp = boss.maxHp;
    boss.x = screenWidth / 2;

    updateHpUI();
    updateScoreUI();
    addUltGauge(0);

    document.getElementById('menuScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.add('hidden');
    document.getElementById('gameplayControls').classList.remove('hidden');

    isPlaying = true;
}

function gameOver(isWin) {
    isPlaying = false;

    document.getElementById('gameplayControls').classList.add('hidden');
    const resultScreen = document.getElementById('resultScreen');
    const title = document.getElementById('resultTitle');
    const sub = document.getElementById('resultSub');

    if (isWin) {
        title.innerText = "MISSION CLEAR!";
        title.className = "text-4xl font-black text-yellow-400 glow-text mb-2";
        sub.innerText = "完璧なる極限回避と弾幕突破！";
    } else {
        title.innerText = "GAME OVER";
        title.className = "text-4xl font-black text-red-500 glow-text mb-2";
        sub.innerText = "弾幕の渦に呑み込まれた...";
    }

    document.getElementById('finalScore').innerText = score;
    document.getElementById('finalDodges').innerText = dodgeCount;
    document.getElementById('finalCombo').innerText = maxCombo;

    resultScreen.classList.remove('hidden');
}

// Event Listeners for Game Flow
document.getElementById('btnStartGame').onclick = startGame;
document.getElementById('btnRetry').onclick = () => {
    document.getElementById('resultScreen').classList.add('hidden');
    document.getElementById('menuScreen').classList.remove('hidden');
};

// Initialize UI on startup
window.onload = () => {
    initMenuUI();
    requestAnimationFrame(gameLoop);
};
</script>
